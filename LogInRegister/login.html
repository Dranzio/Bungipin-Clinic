<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../output.css" rel="stylesheet">
    <title>Login</title>
</head>
<body class="min-h-screen bg-[#A2AC89]">

<!--Upper header of clinic with logo-->
<div class="w-full flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-2 sm:py-3 md:absolute md:top-4 md:left-4 md:max-w-[38%] z-30 animate-fadeIn">
    <img src="../images/logo.png" alt="Bungipin Dental Clinic logo" class="w-9 h-9 sm:w-11 sm:h-11 md:w-15 md:h-15 shrink-0"/>
    <span class="font-extrabold tracking-wide text-[#2A1001] text-base sm:text-lg md:text-[30px] font-['Poppins'] leading-tight">
    BUNGIPIN DENTAL CLINIC
  </span>
</div>

<div class="relative min-h-screen">
    <!--The cream rounded box/right slide-->
    <div class="mx-4 mt-4 mb-4 md:ml-auto md:mt-0 md:mb-0 md:mr-0 md:w-[60%] md:min-h-screen bg-[#F3EFE4]
            rounded-[30px] md:rounded-none md:rounded-tl-[116px] md:rounded-bl-[116px]
            pt-8 pb-12 px-6 md:pt-11 md:pb-20 md:px-16
            flex flex-col relative z-10 animate-slideInRight">

        <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] font-bold text-[#2A1001] font-['Poppins'] text-center">
            Welcome Back!
        </h1>
        <p class="mt-3 text-sm text-center text-[#2A1001] font-['Poppins'] pb-6 md:pb-10">
            Don't have an account? <a href="register.html" class="text-blue-500 hover:underline">Sign up</a>
        </p>

        <!--The light green box container login form-->
        <div class="bg-[#D3DCBE] rounded-[30px] md:rounded-[90px]
            px-6 md:px-14 pt-8 md:pt-14 pb-8 md:pb-10
            mt-5 mx-0 md:mx-6
            md:flex-1 flex flex-col justify-start animate-slideInRight">
            <form id="loginForm" action="#" method="POST">
                <h2 class="text-xl sm:text-2xl md:text-4xl 2xl:text-[70px] font-extrabold text-center text-[#2A1001] mb-6 md:mb-8 font-['Poppins']">
                    LOGIN
                </h2>

                <label class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Email:</label>
                <input id="email" type="email" class="w-full h-12 md:h-14 px-4 bg-white outline-none rounded-[30px] mb-4 md:mb-6" placeholder="Email" />

                <label class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Password:</label>
                <input id="password_hash" type="password" class="w-full h-12 md:h-14 px-4 bg-white outline-none rounded-[30px] mb-6 md:mb-8" placeholder="Password" />

                <div class="flex justify-center">
                    <button class="w-1/4 bg-[#D5C04D] text-sm md:text-[20px] font-bold text-[#2A1001] py-2 rounded-full shadow-lg
                   transition-all duration-200 ease-in-out 
                   hover:scale-105 hover:bg-[#FDFCE9] hover:shadow-xl
                   active:scale-95 active:bg-[#c2ae3b]">
                        Login
                    </button>
                </div>
                <!--Add forget password function soon!-->
                <p class="mt-3 text-sm text-center text-[#2A1001] font-['Poppins'] pb-6 md:pb-10">
                    <a href="#" class="text-[#2A1001] hover:underline">Forgot your password?</a>
                </p>
            </form>
        </div>
    </div>

    <!--Animated Bungie Mascot-->
    <img
            src="../images/toothmascot.png"
            class="hidden lg:block absolute left-[1%] top-[55%] -translate-y-1/2 w-[70%] max-w-[700px] z-20 pointer-events-none select-none drop-shadow-xl animate-slideInLeft"
    />
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password_hash');

    loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        try {
            const response = await fetch('http://localhost:3000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: emailInput.value.trim(),
                    password: passwordInput.value
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Login failed');
            }

            localStorage.setItem('userToken', data.token);

            // Redirect based on role — adjust these paths to match your actual folder structure
            if (data.user.role === 'employee') {
                window.location.href = '../Employee/employeeProfile.html';
            } else if (data.user.role === 'admin') {
                window.location.href = '../Admin/adminPlaceholder.html';
            } else {
                window.location.href = '../Customer/customerProfile.html';
            }

        } catch (error) {
            console.error('Login error:', error);
            alert(error.message);
        }
    });
</script>
</body>
