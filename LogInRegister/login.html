<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/output.css" rel="stylesheet">
    <title>Login</title>
    <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="min-h-screen bg-[#A2AC89]">

<!--Upper header of clinic with logo-->
<div class="w-full flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-2 sm:py-3 md:absolute md:top-4 md:left-4 md:max-w-[38%] z-30 animate-fadeIn">
    <a href="/WelcomePage/home.html" class="w-[280px] text-center bg-[#D5C04D] text-sm md:text-[20px] font-bold text-[#2A1001] py-2 rounded-full shadow-lg transition-all duration-200 ease-in-out hover:scale-105 hover:bg-[#FDFCE9] hover:shadow-xl active:scale-95 active:bg-[#c2ae3b]">
        <i class="fa-solid fa-arrow-left"></i> Return to Landing
    </a>
    <img src="../assets/logo.png" alt="Bungipin Dental Clinic logo" class="w-9 h-9 sm:w-11 sm:h-11 md:w-15 md:h-15 shrink-0"/>
    <span class="font-extrabold tracking-wide text-[#2A1001] text-base sm:text-lg md:text-[30px] font-['Poppins'] leading-tight">
    BUNGIPIN DENTAL CLINIC
  </span>
</div>

<div class="relative min-h-screen">
    <!--The cream rounded box/right slide-->
    <div class="mx-4 mt-4 mb-4 md:ml-auto md:mt-0 md:mb-0 md:mr-0 md:w-[60%] md:min-h-screen bg-[#F3EFE4]
            rounded-[30px] md:rounded-none md:rounded-tl-[116px] md:rounded-bl-[116px]
            pt-8 pb-12 px-6 md:pt-11 md:pb-20 md:px-16
            flex flex-col relative z-10 animate-slideInRight">

        <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] font-bold text-[#2A1001] font-['Poppins'] text-center">
            Welcome Back!
        </h1>
        <p class="mt-3 text-sm text-center text-[#2A1001] font-['Poppins'] pb-6 md:pb-10">
            Don't have an account? <a href="register.html" class="text-blue-500 hover:underline">Sign up</a>
        </p>

        <!--The light green box container login form-->
        <div class="bg-[#D3DCBE] rounded-[30px] md:rounded-[90px]
            px-6 md:px-14 pt-8 md:pt-14 pb-8 md:pb-10
            mt-5 mx-0 md:mx-6
            md:flex-1 flex flex-col justify-start animate-slideInRight">
            <form id="loginForm" action="#" method="POST">
                <h2 class="text-xl sm:text-2xl md:text-4xl 2xl:text-[70px] font-extrabold text-center text-[#2A1001] mb-6 md:mb-8 font-['Poppins']">
                    LOGIN
                </h2>

                <div>
                    <label for="email" class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Email:</label>
                    <!-- COLORS SEND HELP -->
                    <input id="email" type="email" class="w-full h-12 md:h-14 px-4 bg-white outline-none rounded-[30px] mb-4 md:mb-6 disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed " placeholder="Email" maxlength="30"/>
                    <p id="emailError" class="hidden text-sm font-semibold text-red-600 -mt-2 mb-4 md:mb-6" role="alert"></p>
                </div>

                <div>
                    <label for="password_hash" class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Password:</label>
                    <!-- COLORS SEND HELP -->

                    <div class="relative w-full mb-6 md:mb-8">
                        <!-- Input field with right padding to prevent text overlapping the button -->
                        <input id="password_hash" type="password" class="w-full h-12 md:h-14 px-4 pr-16 bg-white outline-none rounded-[30px] disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed"
                               placeholder="Password" maxlength="30"
                        />

                        <!-- Show/Hide Toggle Button -->
                        <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 text-sm font-medium focus:outline-none"
                        >
                            Show
                        </button>
                    </div>

                    <p id="passwordError" class="hidden text-sm font-semibold text-red-600 -mt-4 mb-6 md:mb-8" role="alert"></p>
                </div>

                <div class="flex justify-center">
                    <button type="submit" class="w-1/2 md:w-1/3 lg:w-1/4 bg-[#D5C04D] text-sm md:text-[20px] font-bold text-[#2A1001] py-2.5 rounded-full shadow-lg
                        transition-all duration-200 ease-in-out 
                        hover:scale-105 hover:bg-[#FDFCE9] hover:shadow-xl
                        active:scale-95 active:bg-[#c2ae3b]
                        disabled:bg-gray-400 disabled:text-gray-600 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:bg-gray-400 disabled:hover:shadow-lg cursor-pointer">
                        Login
                    </button>
                </div>
                
                <p id="loginError" class="hidden text-sm font-semibold text-red-600 text-center mt-4" role="alert"></p>
                
                <!-- Centered Forgot Password Link -->
                <div class="flex justify-center mt-4 pb-6 md:pb-10">
                    <a href="ForgetPassEmail.html" class="text-sm font-semibold text-[#2A1001] hover:text-[#5c6e2e] hover:underline transition-colors font-poppins">
                        Forgot your password?
                    </a>
                </div>  
            </form>
        </div>
    </div>

    <!--Animated Bungie Mascot-->
    <img
            src="../assets/toothmascot.png"
            class="hidden lg:block absolute left-[1%] top-[55%] -translate-y-1/2 w-[70%] max-w-[700px] z-20 pointer-events-none select-none drop-shadow-xl animate-slideInLeft"
    />
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password_hash');
    const loginButton = loginForm.querySelector('button[type="submit"]');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const loginError = document.getElementById('loginError');
    const togglePassword = document.getElementById('togglePassword');

    togglePassword.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            togglePassword.textContent = 'Hide';
        } else {
            passwordInput.type = 'password';
            togglePassword.textContent = 'Show';
        }
    });

    function clearErrors() {
        [emailError, passwordError, loginError].forEach(message => {
            message.textContent = '';
            message.classList.add('hidden');
        });
    }

    function showError(messageElement, message) {
        messageElement.textContent = message;
        messageElement.classList.remove('hidden');
    }

    // Only used when the SERVER reports the account is locked (HTTP 423).
    // The server (users.is_locked) is the source of truth; there is no
    // client-side attempt counter anymore, so a page reload always works
    // once an admin has reset the account.
    function lockLogin() {
        emailInput.disabled = true;
        passwordInput.disabled = true;
        loginButton.disabled = true;
        showError(loginError, 'This account is locked. Please contact an administrator to reset your session.');
    }

    // LOGIN ATTEMPT SECURITY
    // Admin page fires this (via localStorage 'storage' event) after resetting a lock.
    function unlockLoginForEmail(email) {
        if (emailInput.value.trim().toLowerCase() !== email) return;

        emailInput.disabled = false;
        passwordInput.disabled = false;
        loginButton.disabled = false;
        clearErrors();
    }

    // eli to eli: should keep input fields and login button disabled upon refresh
    async function recheckOnLoad() {
        const email = (localStorage.getItem('lastLoginEmail') || '').trim();
        if (!email) return;

        try {
            const response = await fetch(`/api/auth/login?email=${encodeURIComponent(email)}`, {
                method: 'GET'
            });

            if (response.status === 429) {
                emailInput.value = email;
                lockLogin();
            }
        } catch (error) {
            // silent ignore :b
        }
    }
    recheckOnLoad();

    window.addEventListener('storage', event => {
        if (event.key !== 'loginSessionReset' || !event.newValue) return;

        try {
            const reset = JSON.parse(event.newValue);
            unlockLoginForEmail(reset.email);
        } catch (error) {
            console.error('Could not read login reset event:', error);
        }
    });

    emailInput.addEventListener('input', () => emailError.classList.add('hidden'));
    passwordInput.addEventListener('input', () => passwordError.classList.add('hidden'));

    loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearErrors();

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: emailInput.value.trim(),
                    password: passwordInput.value
                })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                localStorage.setItem('lastLoginEmail', emailInput.value.trim().toLowerCase());
                if (response.status === 429) {
                    // Account locked on the server after too many failed attempts
                    lockLogin();
                    showError(loginError, 'Too many attempts. Please contact an administrator.');
                } else {
                    showError(loginError, data.error || "Login failed");
                }
                return;
            }

            localStorage.setItem('userToken', data.token);
            if (data.user) {
                if (data.user.role) localStorage.setItem('userRole', data.user.role);
                else localStorage.removeItem('userRole');
                
                if (data.user.position) localStorage.setItem('userPosition', data.user.position.toLowerCase());
                else localStorage.removeItem('userPosition');
            }

            // Redirect based on role — adjust these paths to match your actual folder structure
            if (data.user.role === 'employee') {
                window.location.href = '../Employee/employeeProfile.html';
            } else if (data.user.role === 'admin') {
                window.location.href = '../Admin/Index.html'; //important please dont lowercase
            } else {
                window.location.href = '../Customer/History.html';
            }

        } catch (error) {
            console.error('Login error:', error);
            showError(loginError, 'Unable to connect to the login service. Please try again.');
        }
    });

    passwordInput.addEventListener('paste', (event) => {
        event.preventDefault();
    });

    passwordInput.addEventListener('copy', (event) => {
        event.preventDefault();
    });
</script>
</body>
