<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/output.css" rel="stylesheet">
    <title>Register</title>
</head>

<body class="min-h-screen bg-[#A2AC89]">
    <div class="relative min-h-screen">

        <!-- Mobile register design format-->
        <div class="flex flex-col items-center lg:block">
            <img src="../images/logowithtitle.png"
                class="lg:hidden w-[45%] max-w-[220px] mt-4 mb-2 animate-slideInLeft" />
            <a href="login.html"
                class="lg:hidden bg-[#D5C04D] text-sm font-bold text-[#2A1001] px-6 py-2 rounded-full hover:bg-[#FDFCE9] transition duration-300 mb-4 animate-slideInLeft">
                Back to Login</a>
        </div>
        <!-- Desktop register design format-->
        <div
            class="hidden lg:flex absolute right-0 top-0 h-full w-[40%] flex-col items-center justify-center z-20 gap-8">
            <img src="../images/logowithtitle.png"
                class="w-[70%] max-w-[500px] pointer-events-none select-none drop-shadow-xl animate-slideInLeft" />
            <a href="login.html" class="z-30 bg-[#D5C04D] text-sm md:text-base font-bold text-[#2A1001] px-6 py-2 rounded-full animate-slideInLeft
                transition-all duration-200 ease-in-out 
               hover:scale-105 hover:bg-[#FDFCE9] hover:shadow-xl
               active:scale-95 active:bg-[#c2ae3b]">
                Back to Login
            </a>
        </div>

        <!--Code to make the entire page responsive-->
        <div class="mx-4 mt-4 mb-4 md:mx-0 md:mt-0 md:mb-0 md:w-[60%] md:min-h-screen bg-[#D3DCBE]
            rounded-[30px] md:rounded-none md:rounded-tr-[116px] md:rounded-br-[116px]
            pt-8 pb-12 px-6 md:pt-11 md:pb-20 md:px-16
            flex flex-col relative z-10 animate-slideInLeft">

            <!--Form Registration-->
            <form id="registerForm" action="#" method="POST">

                <h1
                    class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] font-bold text-[#2A1001] font-['Poppins'] text-left">
                    REGISTER</h1>
                <p class="mt-3 text-sm text-left text-[#2A1001] font-['Poppins'] pb-6 md:pb-10">
                    Let’s get you all set up to begin your journey with Bungipin Dental Clinic!
                </p>

                <!--Input fields are in separate containers by twos to format them by twos-->
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1">
                        <label class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">First
                            Name:</label>
                        <input type="text" id="first_name" required
                            class="w-full h-8 md:h-11 px-4 bg-white outline-none rounded-[30px] border border-gray-200 mb-4 md:mb-12"
                            placeholder="Coleen" />
                    </div>

                    <div class="flex-1">
                        <label class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Last
                            Name:</label>
                        <input type="text" id="last_name" required
                            class="w-full h-8 md:h-11 px-4 bg-white outline-none rounded-[30px] border border-gray-200 mb-4 md:mb-12"
                            placeholder="Silvestre" />
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1">
                        <label
                            class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Email:</label>
                        <input type="email" id="email" required
                            class="w-full h-8 md:h-11 px-4 bg-white outline-none rounded-[30px] border border-gray-200 mb-4 md:mb-12"
                            placeholder="bungipin123@gmail.com" />
                    </div>

                    <div class="flex-1">
                        <label class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Phone
                            Number:</label>
                        <input type="tel" id="phone" pattern="^09\d{9}$" maxlength="11"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);" required
                            class="w-full h-8 md:h-11 px-4 bg-white outline-none rounded-[30px] border border-gray-200 mb-4 md:mb-12"
                            placeholder="09171234567" />
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1">
                        <label
                            class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Password:</label>
                        <input type="password" id="password_hash" required minlength="8"
                            class="w-full h-8 md:h-11 px-4 bg-white outline-none rounded-[30px] border border-gray-200 mb-4 md:mb-12"
                            placeholder="12345678" />
                    </div>

                    <div class="flex-1">
                        <label
                            class="text-sm md:text-[20px] block font-semibold text-[#2A1001] font-poppins mb-2">Confirm
                            Password:</label>
                        <input type="password" id="confirm_password" required minlength="8"
                            class="w-full h-8 md:h-11 px-4 bg-white outline-none rounded-[30px] border border-gray-200 mb-4 md:mb-12"
                            placeholder="Confirm Password"
                            oninput="this.setCustomValidity(this.value !== document.getElementById('password_hash').value ? 'Passwords do not match.' : '')" />
                    </div>
                </div>

                <div class="flex items-center gap-6 mb-6 md:mb-12">
                    <label
                        class="text-sm md:text-[20px] font-semibold text-[#2A1001] font-poppins whitespace-nowrap">Sex:</label>
                    <div class="flex items-center gap-6">
                        <label
                            class="flex items-center gap-2 text-sm md:text-base text-[#2A1001] font-poppins cursor-pointer">
                            <input type="radio" id="male" name="sex" value="M" required
                                class="w-4 h-4 accent-[#2A1001]" /> Male
                        </label>
                        <label
                            class="flex items-center gap-2 text-sm md:text-base text-[#2A1001] font-poppins cursor-pointer">
                            <input type="radio" id="female" name="sex" value="F" class="w-4 h-4 accent-[#2A1001]" />
                            Female
                        </label>
                    </div>
                </div>

                <div class="flex justify-center">
                    <button type="submit"
                        class="w-1/4 mx-4 bg-[#D5C04D] text-sm md:text-[20px] font-bold text-[#2A1001] py-2 rounded-full shadow-lg transition-all duration-200 ease-in-out hover:scale-105 hover:bg-[#FDFCE9] hover:shadow-xl active:scale-95 active:bg-[#c2ae3b]">
                        Create Account
                    </button>
                </div>

                <!-- Checkbox HTML -->
                <div class="flex items-center justify-center gap-2 mt-6 mb-6 md:mb-8">
                    <input type="checkbox" id="terms" required class="w-4 h-4 accent-[#2A1001] cursor-pointer"
                        oninvalid="this.setCustomValidity('Please agree to the Terms and Conditions before creating an account.')"
                        oninput="this.setCustomValidity('')" />

                    <div class="text-sm md:text-base text-[#2A1001] font-poppins">
                        <label for="terms" class="cursor-pointer hover:text-gray-700">I agree to the</label>
                        <span id="termsLink" class="text-blue-500 hover:underline cursor-pointer">Terms and
                            Conditions</span>
                        and
                        <span id="privacyLink" class="text-blue-500 hover:underline cursor-pointer">Privacy
                            Policy</span>
                    </div>
                </div>

            </form>

            <div id="successMessage"
                class="hidden text-center mt-4 p-4 bg-green-100 border border-green-400 text-green-800 rounded-2xl font-poppins">
                Account created successfully!
            </div>
        </div>

        <!--policy modal -->
        <div id="policyModal"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-4 transition-opacity duration-300">
            <div
                class="bg-[#F2F0EF] rounded-[30px] w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl relative p-6 md:p-8">


                <button id="closeServiceModal"
                    class="absolute top-5 right-6 text-3xl font-extrabold text-[#382414] hover:opacity-60 transition leading-none">&times;</button>

                <img src="../images/logowithtitle.png" class="absolute top-4 right-16 w-20 h-20 object-contain z-10"
                    alt="Logo" />

                <h2 id="modalTitle"
                    class="text-2xl md:text-3xl font-extrabold text-[#2A1001] font-poppins text-center mt-2 mb-6 border-b border-gray-100 pb-4">
                    Terms & Conditions
                </h2>

                <!-- Content Area -->
                <div id="modalContent"
                    class="overflow-y-auto flex-1 text-sm md:text-base text-[#2A1001] font-poppins space-y-4 pr-3 mb-6">
                    <!-- Content injected here via JS -->
                </div>

                <div class="flex justify-center pt-2">
                    <button id="closeModalBtn"
                        class="bg-[#D5C04D] text-[#2A1001] font-bold py-3 px-12 rounded-[20px] shadow-md hover:bg-[#e6d057] hover:scale-105 transition-all text-lg">
                        Close
                    </button>
                </div>
            </div>
        </div>


        <script>
            const form = document.getElementById('registerForm');
            const password = document.getElementById('password_hash');
            const confirmPassword = document.getElementById('confirm_password');
            const successMessage = document.getElementById('successMessage');

            const policyModal = document.getElementById('policyModal');
            const termsLink = document.getElementById('termsLink');
            const privacyLink = document.getElementById('privacyLink');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const closeModalIcon = document.getElementById('closeModalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');

            const termsText = `
        <p><strong>1. The Use of Our Website: </strong> You may use our website and online tools to request appointments, 
            complete forms, and communicate with our dentists. By using this website, you agree to use these services only 
            for lawful purposes and in a way that does not interfere with operation, security, or integrity of our systems.</p>

        <p><strong>2. Accuracy of Information: </strong> You agree to provide accurate, current, and complete information when 
            submitting forms, requesting appointments, or communicating with our dentists. You are responsible for updating 
            your contact information so we can reach you about appointments, treatment coordination, billing, and other 
            patient support matters.</p>

        <p><strong>3. Appointment Requests and Scheduling:</strong> Submitting an appointment request through our website does 
            not guarantee appointment availability or confirmation. All appointments are subject to review, provider 
            availability, and practice policies.</p>

        <p><strong>4. Consent to Email and Text Communications:</strong> By providing your email address or mobile phone number 
            to Bungipin, you consent to receive service-related communications from us. These communications may include 
            appointment reminders, rescheduling notices, and treatment coordination. Patients opt in to receive messages by 
            providing consent. Consent is not a condition of receiving dental treatment.</p>

        <p><strong>5. Intellectual Property:</strong> All content on this website, including text, graphics, logos, and other 
            materials, is owned or used with permission by Bungipin. You may not copy, reproduce, distribute, or exploit website 
            content.</p>

        <p><strong>6. Website Availability:</strong> We work to keep our website and related services accurate and available, but 
            we do not guarantee uninterrupted access, error-free performance, or that all information is always current.</p>

        <p><strong>7. Limitation of Liability:</strong> Bungipin is not liable for indirect, incidental, consequential, special, 
            or punitive damages arising out of or related to your use of our website, scheduling tools, or communication terms.</p>

        <div>
            <strong>8. Prohibited Use:</strong> 
                <ul class="pl-5 mt-2">
                    <li>You agree not to:
                        <ul class="list-disc pl-5 mt-2 space-y-2">
                            <li>Use the website or related services for unlawful, fraudulent, abusive, or disruptive purposes;</li>
                            <li>Attempt to gain unauthorized access to systems, accounts, or data;</li>
                            <li>Upload or transmit harmful code or malicious content; or</li>
                            <li>Misuse our communication tools in a way that interferes with patient care or office operations.</li>
                        </ul>
                    </li>
                </ul>
        </div>

        <p><strong>9. Changes to These Terms:</strong> We may update these Terms from time to time by posting a revised version 
            of this page. Your continued use of the website or related digital services after updated Terms are posted means you 
            accept the revised Terms.</p>

        <p><strong>10. Bungipin Dentist Support Messages:</strong> The Bungipin Dentist Support Messages allows direct dentists 
            and patients to send direct messages to each other. Messages may include appointment reminders, appointment 
            confirmations, scheduling updates, treatment coordination, and other office support communications.</p>


    `;
            // test

            const privacyText = `
        <p>Bungipin respects your privacy. This Privacy Policy explains how we collect, use, disclose, and protect 
            information when you visit our website, request or manage appointments, and communicate with our dentists.</p>
                <div>
                  <ol>
                    <li>
                        1. Scope of This Privacy Policy<br>
                        This Privacy Policy applies to information collected through:
                        <ul>
                            <li>Our website and online forms;</li>
                            <li>Appointment requests and scheduling tools;</li>
                            <li>Email, phone, and text communications with our dentists</li>
                        </ul>
                    </li>
                <li>
                        2. Information We Collect<br>
                        Depending on how you interact with us, we may collect:
                        <ul>
                            <li>Your name, phone number, and email address;</li>
                            <li>Appointment-related information such as requested dates, appointment history, reminders, confirmations, and scheduling notes;</li>
                            <li>Information you submit through forms, messages, or patient communications;</li>
                            <li>Records of communications with our dentists.</li>
                        </ul>
                    </li>
                <li>
                        3. How We Collect Information<br>
                        We collect information:
                        <ul>
                            <li>Directly from you when you contact us, submit a form, request an appointment, or communicate with our dentists.</li>
                        </ul>
                    </li>
                <li>
                        4. How We Use Information<br>
                        We may use information we collect to:
                    <ul>
                            <li>Operate, maintain, and improve our website and patient communication processes;</li>
                            <li>Schedule, confirm, remind, reschedule, and manage appointments;</li>
                            <li>Respond to your inquiries;</li>
                            <li>Send service-related text messages about appointments, patient support, treatment coordination;</li>
                            <li>Document communications sent;</li>
                            <li>Protect the safety, security, and integrity of our systems and services.</li>
                        </ul>
                    </li>
                <li>
                        5. Your Choices<br>
                        You may contact us to:
                        <ul>
                            <li>Update or correct your contact information;</li>
                            <li>Ask questions about our privacy practices;</li>
                        </ul>
                    </li>
                <li>
                    6. Changes To This Privacy Policy<br>
                    We may update this Privacy Policy from time to time. If we do, we will post the revised version on this page.
                </li>
            </ol>
               </div>
    `;

            function openModal(title, content) {//for modal to show up
                modalTitle.innerText = title;
                modalContent.innerHTML = content;
                policyModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {//for modal to close
                policyModal.classList.add('hidden');
                document.body.style.overflow = '';
            }

            termsLink.addEventListener('click', () => {
                openModal('Terms & Conditions', termsText);
            });

            privacyLink.addEventListener('click', () => {
                openModal('Privacy Policy', privacyText);
            });

            closeModalBtn.addEventListener('click', closeModal);
            closeServiceModal.addEventListener('click', closeModal);

            policyModal.addEventListener('click', (e) => {
                if (e.target === policyModal) {
                    closeModal();
                }
            });

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                if (password.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity('Passwords do not match.');
                    confirmPassword.reportValidity();
                    return;
                } else {
                    confirmPassword.setCustomValidity('');
                }

                const sexValue = document.querySelector('input[name="sex"]:checked')?.value;

                const payload = {
                    first_name: document.getElementById('first_name').value.trim(),
                    last_name: document.getElementById('last_name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    password: password.value,
                    sex: sexValue
                };

                try {
                    const response = await fetch('http://localhost:3000/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Registration failed');
                    }

                    // Log the new patient straight in, same as login.html does
                    localStorage.setItem('userToken', data.token);

                    form.reset();
                    successMessage.classList.remove('hidden');
                    successMessage.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);

                } catch (error) {
                    console.error('Registration error:', error);
                    alert(error.message);
                }
            });

            document.getElementById('phone').addEventListener('input', function (e) {//makes sure no letters and strictly numbers
                this.value = this.value.replace(/\D/g, '').slice(0, 11);
            });

            confirmPassword.addEventListener('input', function () {//validates password matches
                if (password.value === confirmPassword.value) {
                    confirmPassword.setCustomValidity('');
                }
            });
        </script>
    </div>
</body>

</html>
