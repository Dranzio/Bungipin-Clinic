<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f2eb] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#ccd6be] p-8 sm:p-10 rounded-3xl shadow-sm w-full max-w-md flex flex-col justify-center">

        <h1 class="text-2xl sm:text-3xl font-bold text-[#38220f] mb-3">Forgot your password?</h1>
        <p class="text-[#38220f]/80 text-sm sm:text-base mb-6 leading-relaxed">Please enter your email address so that we send a reset link to your account</p>

        <form action="/api/user/forgotPassword" method="POST" class="space-y-5">
            <div>
                <label for="email" class="block text-xs sm:text-sm font-medium text-[#38220f] mb-2">Enter your email address</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-3 bg-[#e8eddf] text-[#38220f] rounded-xl border border-transparent focus:outline-none focus:ring-2 focus:ring-[#586f42] placeholder-[#38220f]/40 text-sm" placeholder="" required>
            </div>
            <button type="submit" class="w-full py-3 px-4 bg-[#586f42] hover:bg-[#4a5e37] text-white font-medium rounded-xl transition-colors duration-200 text-sm shadow-sm">Request reset link</button>
        </form>
        
        <div class="text-center mt-6">
            <a href="login.html" class="text-sm font-medium text-[#38220f] underline hover:text-black transition-colors">Back to Login</a>
        </div>
    </div>
</body>
</html>
