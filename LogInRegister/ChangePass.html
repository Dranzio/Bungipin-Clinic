<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f2eb] min-h-screen flex items-center justify-center p-4">
<div class="bg-[#ccd6be] p-8 sm:p-10 rounded-3xl shadow-sm w-full max-w-md flex flex-col justify-center">

    <h1 class="text-2xl sm:text-3xl font-bold text-[#38220f] mb-2">Change Password</h1>
    <p class="text-[#38220f]/80 text-sm sm:text-base mb-6">Enter your new password</p>

    <div id="statusMessage" class="hidden mb-5 px-4 py-3 rounded-xl text-sm"></div>

    <form id="reset-form" class="space-y-5">
        <div>
            <label for="new_password" class="block text-xs sm:text-sm font-medium text-[#38220f] mb-2">New Password</label>
            <div class="relative">
                <input type="password" id="new_password" name="password" minlength="8" class="w-full px-4 pr-16 py-3 bg-[#e8eddf] text-[#38220f] rounded-xl border border-transparent focus:outline-none focus:ring-2 focus:ring-[#586f42] placeholder-[#38220f]/40 text-sm" placeholder="" required>
                <button type="button" id="toggleNewPass" class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-[#38220f]/60 hover:text-[#38220f] focus:outline-none transition-colors cursor-pointer">Show</button>
            </div>
        </div>

              <div class="w-full mt-2 mb-2">
                <div id="StrengthBars" class="flex gap-2 mb-1.5 w-[95%] mx-auto">
                    <div class="StrengthCap flex-1 h-[8px] rounded-[99px] bg-[#808a92]" id="Weak"></div>
                    <div class="StrengthCap flex-1 h-[8px] rounded-[99px] bg-[#808a92]" id="Medium"></div>
                    <div class="StrengthCap flex-1 h-[8px] rounded-[99px] bg-[#808a92]" id="Good"></div>
                    <div class="StrengthCap flex-1 h-[8px] rounded-[99px] bg-[#808a92]" id="Strong"></div>
                </div>
                <p class="text-xs text-[#2A1001] mb-3">
                    Strength: <span id="PassStrength" class="font-bold"></span>
                </p>
                
                <!-- Password Criteria Checklist -->
                <div id="passwordCriteria" class="pl-1 mb-4">
                    <p class="text-sm md:text-base font-bold text-[#2A1001] font-poppins mb-2">Password Criteria:</p>
                    <ul class="list-disc pl-5 text-xs md:text-sm font-poppins space-y-1">
                        <li id="req-length" class="text-gray-500 transition-colors duration-200">Must exceed 8 characters</li>
                        <li id="req-case" class="text-gray-500 transition-colors duration-200">Must have Upper and Lower case</li>
                        <li id="req-num" class="text-gray-500 transition-colors duration-200">Must have numbers</li>
                        <li id="req-spec" class="text-gray-500 transition-colors duration-200">Must have special characters</li>
                    </ul>
                </div>
              </div>
              <div id="passwordWarning" class="text-red-700 text-xs font-semibold hidden mb-2"></div>
        <div>
            <label for="confirm_password" class="block text-xs sm:text-sm font-medium text-[#38220f] mb-2">Confirm Password</label>
            <div class="relative">
                <input type="password" id="confirm_password" name="confirmPassword" minlength="8" class="w-full px-4 pr-16 py-3 bg-[#e8eddf] text-[#38220f] rounded-xl border border-transparent focus:outline-none focus:ring-2 focus:ring-[#586f42] text-sm" required>
                <button type="button" id="toggleConfirmPass" class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-[#38220f]/60 hover:text-[#38220f] focus:outline-none transition-colors cursor-pointer">Show</button>
            </div>
        </div>
        <button type="submit" id="submitBtn" class="w-full py-3 px-4 bg-[#586f42] hover:bg-[#4a5e37] text-white font-medium rounded-xl transition-colors duration-200 text-sm shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">Change Password</button>
    </form>

    <div class="text-center mt-6">
        <a href="login.html" class="text-sm font-medium text-[#38220f] underline hover:text-black transition-colors">Back to Login</a>
    </div>
</div>

<script>
    // --- Show/Hide Password Logic ---
    const toggleNewPass = document.getElementById('toggleNewPass');
    const newPasswordInput = document.getElementById('new_password');
    
    toggleNewPass.addEventListener('click', () => {
        if (newPasswordInput.type === 'password') {
            newPasswordInput.type = 'text';
            toggleNewPass.textContent = 'Hide';
        } else {
            newPasswordInput.type = 'password';
            toggleNewPass.textContent = 'Show';
        }
    });

    const toggleConfirmPass = document.getElementById('toggleConfirmPass');
    const confirmPasswordInput = document.getElementById('confirm_password');
    
    toggleConfirmPass.addEventListener('click', () => {
        if (confirmPasswordInput.type === 'password') {
            confirmPasswordInput.type = 'text';
            toggleConfirmPass.textContent = 'Hide';
        } else {
            confirmPasswordInput.type = 'password';
            toggleConfirmPass.textContent = 'Show';
        }
    });

    // --- DOM Elements for Password Strength & Submit ---
    const form = document.getElementById('reset-form');
    const statusMessage = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('submitBtn');
    
    const newPassword = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');
    const weakBar = document.getElementById('Weak');
    const mediumBar = document.getElementById('Medium');
    const goodBar = document.getElementById('Good');
    const strongBar = document.getElementById('Strong');
    const passStrength = document.getElementById('PassStrength');
    const passwordWarning = document.getElementById('passwordWarning');

    // --- Password Validation Logic ---
    function updatePasswordStrength() {
        if (!newPassword) return;
        const value = newPassword.value;
        const bars = [weakBar, mediumBar, goodBar, strongBar];
        let strengthColor = '#808a92';

        bars.forEach(bar => { if (bar) bar.style.background = '#808A92'; });
        if (passStrength) passStrength.textContent = '';

        if (value === '') {
            if (passwordWarning) passwordWarning.classList.add('hidden');
            if (submitBtn) submitBtn.disabled = false;
            return;
        }

        let strength = 0;
        if (value.length >= 8) strength++;
        if (/\d/.test(value)) strength++;
        if (/[^A-Za-z0-9\s]/.test(value)) strength++;
        if (/[A-Z]/.test(value) && /[a-z]/.test(value)) strength++;

        if (strength === 1) { if(passStrength) passStrength.textContent = 'Weak'; strengthColor = '#EF4444'; }
        else if (strength === 2) { if(passStrength) passStrength.textContent = 'Medium'; strengthColor = '#F59E0B'; }
        else if (strength === 3) { if(passStrength) passStrength.textContent = 'Good'; strengthColor = '#EAB308'; }
        else if (strength === 4) { if(passStrength) passStrength.textContent = 'Strong'; strengthColor = '#22C55E'; }

        for (let i = 0; i < strength; i++) {
            if (bars[i]) bars[i].style.backgroundColor = strengthColor;
        }
    }

    function checkPasswordRequirements() {
        if (!newPassword || !confirmPassword) return;
        const passwordValue = newPassword.value;
        const confirmValue = confirmPassword.value;
        
        // Grab checklist items
        const reqLength = document.getElementById('req-length');
        const reqCase = document.getElementById('req-case');
        const reqNum = document.getElementById('req-num');
        const reqSpec = document.getElementById('req-spec');

        if (passwordValue === '') {
            if (passwordWarning) passwordWarning.classList.add('hidden');
            if (submitBtn) submitBtn.disabled = false;
            
            // Reset checklist colors when empty
            if (reqLength) reqLength.className = 'text-gray-500 transition-colors duration-200';
            if (reqCase) reqCase.className = 'text-gray-500 transition-colors duration-200';
            if (reqNum) reqNum.className = 'text-gray-500 transition-colors duration-200';
            if (reqSpec) reqSpec.className = 'text-gray-500 transition-colors duration-200';
            return;
        }

        const hasMinLength = passwordValue.length >= 8;
        const hasNumber = /\d/.test(passwordValue);
        const hasSpace = passwordValue.includes(' ');
        const hasSpecialChar = /[^A-Za-z0-9\s]/.test(passwordValue);
        const hasUpperLower = /[A-Z]/.test(passwordValue) && /[a-z]/.test(passwordValue);
        const passwordsMatch = (passwordValue === confirmValue) && passwordValue !== '';
        
        // Repetition checks
        const hasRepeatChar = /(.)\1{2,}/.test(passwordValue);
        const hasRepeatPattern = /(.{2,})\1{2,}/.test(passwordValue);

        // Update Criteria Checklist Colors
        if (reqLength) reqLength.className = hasMinLength ? 'text-green-600 transition-colors duration-200' : 'text-gray-500 transition-colors duration-200';
        if (reqCase) reqCase.className = hasUpperLower ? 'text-green-600 transition-colors duration-200' : 'text-gray-500 transition-colors duration-200';
        if (reqNum) reqNum.className = hasNumber ? 'text-green-600 transition-colors duration-200' : 'text-gray-500 transition-colors duration-200';
        if (reqSpec) reqSpec.className = hasSpecialChar ? 'text-green-600 transition-colors duration-200' : 'text-gray-500 transition-colors duration-200';

        let strength = 0;
        if (hasMinLength) strength++;
        if (hasNumber) strength++;
        if (hasSpecialChar) strength++;
        if (hasUpperLower) strength++;

        let warningMessage = "";
        let isValid = true;

        if (passwordValue !== "" && hasSpace) {
            warningMessage = "Password should not contain spaces.";
            isValid = false;
        } else if (passwordValue !== "" && hasRepeatChar) {
            warningMessage = "Password should not have repetitive characters.";
            isValid = false;
        } else if (passwordValue !== "" && hasRepeatPattern) {
            warningMessage = "Password should not have repetitive patterns.";
            isValid = false;
        } else if (passwordValue !== "" && !hasMinLength) {
            isValid = false;
        } else if (passwordValue !== "" && !hasNumber) {
            isValid = false;
        } else if (passwordValue !== "" && !hasSpecialChar) {
            isValid = false;
        } else if (passwordValue !== "" && !hasUpperLower) {
            isValid = false;
        } else if (confirmValue !== "" && !passwordsMatch) {
            warningMessage = "Passwords do not match.";
            isValid = false;
        }

        if (passwordWarning) {
            if (warningMessage !== "") {
                passwordWarning.textContent = warningMessage;
                passwordWarning.classList.remove('hidden');
            } else {
                passwordWarning.textContent = "";
                passwordWarning.classList.add('hidden');
            }
        }

        if (submitBtn) submitBtn.disabled = !isValid || strength < 3;
    }

    if (newPassword) {
        newPassword.addEventListener('input', () => {
            updatePasswordStrength();
            checkPasswordRequirements();
        });
    }
    if (confirmPassword) {
        confirmPassword.addEventListener('input', checkPasswordRequirements);
    }

    // ── Prevent Copy & Paste in Password Fields ──
    if (newPassword) {
      newPassword.addEventListener('paste', (event) => event.preventDefault());
      newPassword.addEventListener('copy', (event) => event.preventDefault());
    }
    if (confirmPassword) {
      confirmPassword.addEventListener('paste', (event) => event.preventDefault());
      confirmPassword.addEventListener('copy', (event) => event.preventDefault());
    }

    // --- Form Submission Logic ---
    const token = new URLSearchParams(window.location.search).get('token');

    function showStatus(text, isError) {
        statusMessage.textContent = text;
        statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');
        statusMessage.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-800' : 'text-green-800');
    }

    if (!token) {
        showStatus('This link is missing its reset token. Please use the link from your email, or request a new one.', true);
        form.querySelectorAll('input, button').forEach(el => el.disabled = true);
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const password = newPasswordInput.value;
        const confirmPasswordVal = confirmPasswordInput.value;

        if (password !== confirmPasswordVal) {
            showStatus('Passwords do not match.', true);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Changing...';

        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password })
            });

            const result = await response.json();

            if (response.ok) {
                showStatus(result.message, false);
                form.querySelectorAll('input, button').forEach(el => el.disabled = true);
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } else {
                showStatus(result.error || 'Something went wrong. Please try again.', true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Change Password';
            }
        } catch (err) {
            console.error('Reset password request failed:', err);
            showStatus('Network error. Please check your connection and try again.', true);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Change Password';
        }
    });
</script>
</body>
</html>
