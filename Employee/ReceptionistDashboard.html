<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- DENIED DIRECT PAGE ACCESS VIA URL -->
  <script src="../pageProtection.js"></script>
  <script src="/passwordGate.js"></script>
  <link href="/output.css" rel="stylesheet">
  <title>Employee Dashboard - Profile</title>
  <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
  <script src="../Taskbar/Employee_Sidebar.js"></script>
</head>

<body class="min-h-screen bg-[#F3EFE4] relative flex flex-col md:flex-row antialiased">

  <!-- SIDEBAR -->
  <div id="sidebar-placeholder"></div>
  <script>
    function syncContentOffset() {
      const placeholder = document.getElementById('sidebar-placeholder');
      const sidebar = Array.from(placeholder?.children || [])
        .find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
      if (!sidebar) return;

      const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

      const apply = () => {
        const desktop = window.innerWidth >= 768;
        set(placeholder, 'flexShrink', '0');
        set(sidebar, 'position', desktop ? 'sticky' : 'relative');  
        set(sidebar, 'top', desktop ? '0px' : 'auto');
        set(sidebar, 'height', desktop ? '100vh' : '');
        set(sidebar, 'overflowY', desktop ? 'auto' : '');           
      };

      window.addEventListener('resize', apply);
      apply();
    }

    (async () => {
      try {
        const response = await fetch('/Taskbar/Receptionist_Task.html');
        if (response.ok) {
          const data = await response.text();
          document.getElementById('sidebar-placeholder').innerHTML = data;
          const currentPage = window.location.pathname.split("/").pop();
          document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('data-page') === currentPage) {
              link.classList.add('bg-[#FDFCE9]');
            }
          });
          if (typeof initSidebar === 'function') {
            initSidebar();
          }
          syncContentOffset();
        }
      } catch (error) {
        console.log('Sidebar fallback:', error);
      }
    })();
  </script>

  <!-- CONTENT WRAPPER -->
  <div id="main-content" class="flex-1 min-w-0 min-h-0 overflow-y-auto">

    <div class="flex justify-between items-start pt-5 pl-6 pr-4 md:pl-24 md:pr-8">
      <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] pt-5 font-bold text-[#2A1001] font-['Poppins']">
        Receptionist Dashboard
      </h1>
      <img
        src="../assets/logowithtitle.png"
        class="w-20 sm:w-24 md:w-28 h-auto object-contain shrink-0"
        onerror="this.style.display='none'"
        alt="Logo"/>
    </div>
    <hr class="border-t border-[#2A1001] mt-2 mb-6" />

  </div>

  <script src="/InactivityTimer/InactivityTimer.js"></script>
</body>
</html>
