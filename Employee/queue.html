<div id="sidebar-placeholder" class="shrink-0 w-full md:w-auto"></div>

<script>
    function syncContentOffset() {
        const placeholder = document.getElementById('sidebar-placeholder');
        const sidebar = Array.from(placeholder?.children || []).find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
        if (!sidebar) return;

        const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

        const apply = () => {
            const desktop = window.innerWidth >= 768;
            set(placeholder, 'flexShrink', '0');
            set(sidebar, 'position', desktop ? 'sticky' : 'relative');
            set(sidebar, 'top', desktop ? '0px' : 'auto');
            set(sidebar, 'height', desktop ? '100vh' : '');
            set(sidebar, 'overflowY', desktop ? 'auto' : '');
        };

        window.addEventListener('resize', apply);
        apply();
    }

    (async () => {
        try {
            const response = await fetch('/Taskbar/Receptionist_Task.html');
            if (response.ok) {
                const data = await response.text();
                document.getElementById('sidebar-placeholder').innerHTML = data;
                const currentPage = window.location.pathname.split("/").pop();
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.getAttribute('data-page') === currentPage || link.getAttribute('href')?.includes(currentPage)) {
                        link.classList.add('bg-[#FDFCE9]');
                    }
                });
                if (typeof initSidebar === 'function') initSidebar();
                syncContentOffset();
            }
        } catch (error) {
            console.log('Sidebar fallback:', error);
        }
    })();
</script>

<script src="/socket.io/socket.io.js"></script>
<script>
    let appointments = [];
    let currentDateFilter = "today";
    let currentFilter = "pending";
    let currentSearch = "";
    let currentSort = "earliest";
    const rowsPerPage = 8;
    let currentPage = 1;

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
    }

    function getTodayDateStr() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function isAppointmentToday(dateStr) {
        if (!dateStr) return false;
        const todayStr = getTodayDateStr();
        const apptDateStr = dateStr.split('T')[0];
        return apptDateStr === todayStr;
    }

    function formatTime12h(timeStr) {
        if (!timeStr) return "";
        const [hours, minutes] = String(timeStr).split(":");
        let h = parseInt(hours, 10);
        const ampm = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return `${h}:${minutes || '00'} ${ampm}`;
    }

    // Formats Start Time and End Time (e.g. 10:00 AM – 10:45 AM)
    function getFormattedTimeRange(timeSlot, endTime, serviceLabel) {
        if (!timeSlot) return "TBD";
        
        if (endTime && endTime !== '00:00:00' && endTime !== timeSlot) {
            return `${formatTime12h(timeSlot)} – ${formatTime12h(endTime)}`;
        }
        const [hStr, mStr] = String(timeSlot).split(":");
        const startMins = parseInt(hStr, 10) * 60 + parseInt(mStr || "0", 10);
        const l = String(serviceLabel || '').toLowerCase();
        let duration = 30;
        if (l.includes('root') || l.includes('canal')) duration = 90;
        else if (l.includes('whiten')) duration = 60;
        else if (l.includes('clean') || l.includes('prophylaxis')) duration = 45;
        else if (l.includes('pasta') || l.includes('filling')) duration = 30;
        else if (l.includes('brace') || l.includes('ortho')) duration = 60;
        else if (l.includes('extract') || l.includes('surgery')) duration = 45;
        const endMins = startMins + duration;
        const endH = Math.floor(endMins / 60);
        const endM = endMins % 60;
        const fallbackEnd = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}:00`;
        return `${formatTime12h(timeSlot)} – ${formatTime12h(fallbackEnd)}`;
    }

    function formatApptDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${d.getFullYear()}`;
    }

    // ── CALENDAR 6-MONTH LIMIT BOUNDS ──
    function initDateInputBounds() {
        const today = new Date();
        const pad = (n) => String(n).padStart(2, '0');

        // Past 6 months
        const past6m = new Date(today);
        past6m.setMonth(today.getMonth() - 6);
        const minStr = `${past6m.getFullYear()}-${pad(past6m.getMonth() + 1)}-${pad(past6m.getDate())}`;

        // Future 6 months
        const future6m = new Date(today);
        future6m.setMonth(today.getMonth() + 6);
        const maxStr = `${future6m.getFullYear()}-${pad(future6m.getMonth() + 1)}-${pad(future6m.getDate())}`;

        const input = document.getElementById('customDateInput');
        if (input) {
            input.min = minStr;
            input.max = maxStr;
        }
    }

    function showNotice(message, { title = "Notice", type = "info" } = {}) {
        const modal = document.getElementById('noticeModal');
        if (!modal) return;
        const iconWrap = document.getElementById('noticeIconWrap');
        const icon = document.getElementById('noticeIcon');
        const titleEl = document.getElementById('noticeTitle');
        const msgEl = document.getElementById('noticeMessage');
        const styles = {
            success: { wrap: 'bg-green-100 text-green-700', icon: 'fa-circle-check' },
            error:   { wrap: 'bg-red-100 text-red-600',     icon: 'fa-circle-exclamation' },
            info:    { wrap: 'bg-[#EAF0DD] text-[#556022]', icon: 'fa-circle-info' }
        };
        const s = styles[type] || styles.info;
        iconWrap.className = `w-10 h-10 rounded-full flex items-center justify-center text-lg shrink-0 ${s.wrap}`;
        icon.className = `fa-solid ${s.icon}`;
        titleEl.textContent = title;
        msgEl.textContent = message;
        modal.classList.remove('hidden');
    }

    function closeNoticeModal() {
        const modal = document.getElementById('noticeModal');
        if (modal) modal.classList.add('hidden');
    }

    document.getElementById('noticeOkBtn')?.addEventListener('click', closeNoticeModal);
    document.getElementById('noticeModal')?.addEventListener('click', (e) => {
        if (e.target === document.getElementById('noticeModal')) closeNoticeModal();
    });

    async function getAppointments() {
        try {
            const token = localStorage.getItem('userToken') || localStorage.getItem('token');
            const params = new URLSearchParams();
            if (currentDateFilter) params.append('date', currentDateFilter);

            const response = await fetch(`/api/appointments/queue?${params.toString()}`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) throw new Error(`Server error: ${response.status}`);
            return await response.json();
        } catch (error) {
            console.error("Failed to load appointments:", error);
            showNotice("Failed to load queue appointments from server.", { title: "Error", type: "error" });
            return [];
        }
    }

    async function updateAppointmentStatus(appointmentId, newStatus) {
        try {
            const token = localStorage.getItem('userToken') || localStorage.getItem('token');
            const response = await fetch(`/api/appointments/${appointmentId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ queue_status: newStatus })
            });

            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.message || `Server error: ${response.status}`);
            }

            return true;
        } catch (error) {
            console.error("Failed to update appointment status:", error);
            showNotice(error.message || "Failed to update appointment status.", { title: "Update Error", type: "error" });
            return false;
        }
    }

    const statusColors = {
        "pending": "bg-[#E8A55C]",
        "waiting": "bg-[#E8DD5C]",
        "ongoing": "bg-[#7FD8E8]",
        "completed": "bg-[#B6E85C]"
    };

    const statusLabels = {
        "pending": "Pending",
        "waiting": "Waiting",
        "ongoing": "Ongoing",
        "completed": "Completed"
    };

    function getFilteredAndSorted() {
        let list = appointments.filter(a => {
            const matchesFilter = currentFilter === "All" || a.queue_status === currentFilter;
            const searchLower = currentSearch.toLowerCase().trim();
            const dentistName = `${a.dentist_first_name || ''} ${a.dentist_last_name || ''}`.toLowerCase();

            const matchesSearch = !searchLower ||
                                  (a.public_id || '').toLowerCase().includes(searchLower) ||
                                  `${a.first_name || ''} ${a.last_name || ''}`.toLowerCase().includes(searchLower) ||
                                  `${a.phone || ''}`.includes(searchLower) ||
                                  `${a.label || ''}`.toLowerCase().includes(searchLower) ||
                                  dentistName.includes(searchLower);
            return matchesFilter && matchesSearch;
        });

        // Date and Time Sorting (Earliest First / Latest First)
        list.sort((a, b) => {
            const dateA = a.appointment_date ? a.appointment_date.split('T')[0] : '';
            const dateB = b.appointment_date ? b.appointment_date.split('T')[0] : '';
            const timeA = a.time_slot || '00:00:00';
            const timeB = b.time_slot || '00:00:00';

            const compA = `${dateA} ${timeA}`;
            const compB = `${dateB} ${timeB}`;

            return currentSort === 'earliest' 
                ? compA.localeCompare(compB) 
                : compB.localeCompare(compA);
        });

        return list;
    }

    function renderCounts() {
        document.getElementById('countPending').textContent =
            appointments.filter(a => a.queue_status === "pending").length;

        document.getElementById('countWaiting').textContent =
            appointments.filter(a => a.queue_status === "waiting").length;

        document.getElementById('countOngoing').textContent =
            appointments.filter(a => a.queue_status === "ongoing").length;

        document.getElementById('countCompleted').textContent =
            appointments.filter(a => a.queue_status === "completed").length;

        const countAllEl = document.getElementById('countAll');
        if (countAllEl) {
            countAllEl.textContent = appointments.length;
        }
    }

    function renderTable() {
        const filtered = getFilteredAndSorted();
        const start = (currentPage - 1) * rowsPerPage;
        const pageItems = filtered.slice(start, start + rowsPerPage);

        const tbody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');

        tbody.innerHTML = '';

        if (pageItems.length === 0) {
            if (emptyState) emptyState.classList.remove('hidden');
            renderPagination(0);
            return;
        }

        if (emptyState) emptyState.classList.add('hidden');

        pageItems.forEach((item) => {
            const formattedDate = formatApptDate(item.appointment_date);
            const timeRangeFormatted = getFormattedTimeRange(item.time_slot, item.end_time, item.label);
            const isToday = isAppointmentToday(item.appointment_date);

            // 👨‍⚕️ Selected Attending Dentist
            const docFullName = (item.dentist_first_name || item.dentist_last_name)
                ? `Dr. ${item.dentist_first_name || ''} ${item.dentist_last_name || ''}`.trim()
                : 'Dr. Ramon Cruz';

            const dentistBadge = `
                <div class="font-extrabold text-[#2A1001] flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-user-doctor text-[#667733]"></i>
                    <span class="text-xs sm:text-sm">${escapeHtml(docFullName)}</span>
                </div>
            `;

            // Interactive dropdown for TODAY, Locked badge for FUTURE dates
            let statusControl = '';

            if (isToday) {
                statusControl = `
                    <select class="statusSelect ${statusColors[item.queue_status] || 'bg-gray-200'} font-bold text-xs sm:text-sm text-[#2A1001] rounded-full px-3 py-1.5 outline-none cursor-pointer shadow-xs border border-black/10 transition active:scale-95 whitespace-nowrap" data-id="${item.appointment_id}">
                        ${Object.keys(statusLabels).map(key => `
                            <option value="${key}" class="bg-white text-[#2A1001] font-medium" ${item.queue_status === key ? "selected" : ""}>
                                ${statusLabels[key]}
                            </option>
                        `).join('')}
                    </select>
                `;
            } else {
                statusControl = `
                    <div class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-extrabold ${statusColors[item.queue_status] || 'bg-gray-100'} text-[#2A1001] border border-black/10 cursor-not-allowed opacity-85 select-none shadow-xs whitespace-nowrap" title="Queue progression is locked until scheduled date (${formattedDate})">
                        <i class="fa-solid fa-lock text-[10px] opacity-70"></i>
                        <span>${statusLabels[item.queue_status] || 'Scheduled'}</span>
                    </div>
                `;
            }

            const row = document.createElement('tr');
            row.className = "hover:bg-[#FDFCE9]/60 transition border-b border-[#2A1001]/10";
            row.innerHTML = `
                <!-- 1. Scheduled Date & Time -->
                <td class="py-3.5 px-3 sm:px-4 text-center whitespace-nowrap">
                    <span class="font-extrabold text-[#2A1001] block text-xs sm:text-sm">${escapeHtml(formattedDate)}</span>
                    <span class="text-[11px] text-[#667733] font-bold"><i class="fa-regular fa-clock mr-1"></i>${escapeHtml(timeRangeFormatted)}</span>
                </td>

                <!-- 2. Patient ID (Exact Patient Record styling) -->
                <td class="py-3.5 px-3 text-center font-bold text-[#2A1001] whitespace-nowrap">
                    ${escapeHtml(item.public_id || 'N/A')}
                </td>

                <!-- 3. Patient Name & Phone -->
                <td class="py-3.5 px-3 text-center">
                    <div class="font-bold text-xs sm:text-sm text-[#2A1001] whitespace-nowrap">${escapeHtml(item.first_name)} ${escapeHtml(item.last_name)}</div>
                    <div class="text-[11px] text-gray-500 font-medium whitespace-nowrap mt-0.5"><i class="fa-solid fa-phone text-[9px] text-gray-400 mr-1"></i>${escapeHtml(item.phone || 'N/A')}</div>
                </td>

                <!-- 4. Selected Attending Dentist -->
                <td class="py-3.5 px-3 text-center">
                    ${dentistBadge}
                </td>

                <!-- 5. Service Treatment -->
                <td class="py-3.5 px-3 text-center font-bold text-xs sm:text-sm text-[#2A1001]">
                    <span class="break-words">${escapeHtml(item.label)}</span>
                </td>

                <!-- 6. Queue Status Action -->
                <td class="py-3.5 px-3 text-center whitespace-nowrap">
                    ${statusControl}
                </td>
            `;
            tbody.appendChild(row);
        });

        renderPagination(filtered.length);
    }

    document.getElementById('main-content').addEventListener('change', async function (e) {
        if (e.target.classList.contains('statusSelect')) {
            const id = Number(e.target.dataset.id);
            const newStatus = e.target.value;

            const success = await updateAppointmentStatus(id, newStatus);
            if (success) {
                const appt = appointments.find(a => a.appointment_id === id);
                if (appt) {
                    appt.queue_status = newStatus;
                }
                renderCounts();
                renderTable();
            }
        }
    });

    function renderPagination(totalItems) {
        const totalPages = Math.max(1, Math.ceil(totalItems / rowsPerPage));
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        if (totalPages <= 1) return;

        const maxVisible = 7;
        const currentBatch = Math.floor((currentPage - 1) / maxVisible);
        const batchStart = currentBatch * maxVisible + 1;
        const batchEnd = Math.min(batchStart + maxVisible - 1, totalPages);

        if (batchStart > 1) {
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '‹';
            prevBtn.className = "w-8 h-8 sm:w-9 sm:h-9 rounded-full font-bold text-[#2A1001] bg-white border border-[#2A1001]/20 hover:bg-[#2A1001]/10 transition flex items-center justify-center cursor-pointer text-xs sm:text-sm";
            prevBtn.addEventListener('click', () => {
                currentPage = batchStart - 1;
                renderTable();
            });
            pagination.appendChild(prevBtn);
        }

        for (let i = batchStart; i <= batchEnd; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `w-8 h-8 sm:w-9 sm:h-9 rounded-full font-semibold cursor-pointer transition text-xs sm:text-sm ${
                i === currentPage
                    ? 'bg-[#667733] text-white shadow-sm'
                    : 'bg-white text-[#2A1001] border border-[#2A1001]/20 hover:bg-gray-50'
            }`;
            btn.addEventListener('click', () => {
                currentPage = i;
                renderTable();
            });
            pagination.appendChild(btn);
        }

        if (batchEnd < totalPages) {
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '›';
            nextBtn.className = "w-8 h-8 sm:w-9 sm:h-9 rounded-full font-bold text-[#2A1001] bg-white border border-[#2A1001]/20 hover:bg-[#2A1001]/10 transition flex items-center justify-center cursor-pointer text-xs sm:text-sm";
            nextBtn.addEventListener('click', () => {
                currentPage = batchEnd + 1;
                renderTable();
            });
            pagination.appendChild(nextBtn);
        }
    }

    // ── DATE PRESET TABS ──
    document.querySelectorAll('.date-tab').forEach(btn => {
        btn.addEventListener('click', async function () {
            document.querySelectorAll('.date-tab').forEach(b => {
                b.className = 'date-tab px-3.5 py-1.5 rounded-full border text-[11px] sm:text-xs font-bold transition cursor-pointer active:scale-95 bg-white text-[#2A1001] border-gray-200 hover:bg-[#FDFCE9]';
            });
            this.className = 'date-tab px-3.5 py-1.5 rounded-full border text-[11px] sm:text-xs font-bold transition cursor-pointer active:scale-95 bg-[#667733] text-white border-[#667733] shadow-xs';
            
            document.getElementById('customDateInput').value = '';
            currentDateFilter = this.dataset.date;
            
            const titles = {
                'today': "Today's Appointments (Live Queue)",
                'tomorrow': "Tomorrow's Appointments (Queue Progression Locked)",
                'upcoming': "All Upcoming Future Appointments (Queue Progression Locked)",
                'all': "All Appointments (Past & Future)"
            };
            document.getElementById('currentViewIndicator').innerHTML = `Showing: <strong class="text-[#2A1001]">${titles[currentDateFilter] || 'Selected Date'}</strong>`;

            currentPage = 1;
            await refreshQueue();
        });
    });

    // ── CUSTOM DATE PICKER (LIMITED TO 6 MONTHS) ──
    document.getElementById('customDateInput').addEventListener('change', async function () {
        if (!this.value) return;

        const pickedDate = new Date(this.value + 'T00:00:00');
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const past6m = new Date(today);
        past6m.setMonth(today.getMonth() - 6);

        const future6m = new Date(today);
        future6m.setMonth(today.getMonth() + 6);

        if (pickedDate < past6m || pickedDate > future6m) {
            showNotice("Please select a date within 6 months from today.", { title: "Date Range Limit", type: "error" });
            this.value = '';
            return;
        }

        document.querySelectorAll('.date-tab').forEach(b => {
            b.className = 'date-tab px-3.5 py-1.5 rounded-full border text-[11px] sm:text-xs font-bold transition cursor-pointer active:scale-95 bg-white text-[#2A1001] border-gray-200 hover:bg-[#FDFCE9]';
        });
        currentDateFilter = this.value;
        const isToday = isAppointmentToday(this.value);
        document.getElementById('currentViewIndicator').innerHTML = `Showing: <strong class="text-[#2A1001]">Date: ${this.value} ${isToday ? '(Live Queue)' : '(Queue Progression Locked)'}</strong>`;
        currentPage = 1;
        await refreshQueue();
    });

    // ── SORT ORDER ──
    document.getElementById('sortSelect').addEventListener('change', function () {
        currentSort = this.value;
        renderTable();
    });

    // ── STATUS FILTER BUTTONS ──
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('ring-2', 'ring-[#2A1001]/30', 'active-filter');
            });
            this.classList.add('ring-2', 'ring-[#2A1001]/30', 'active-filter');
            currentFilter = this.dataset.filter;
            currentPage = 1;
            renderTable();
        });
    });

    document.getElementById('searchInput').addEventListener('input', function () {
        currentSearch = this.value;
        currentPage = 1;
        renderTable();
    });

    async function refreshQueue() {
        appointments = await getAppointments();
        renderCounts();
        renderTable();
    }

    (async function init() {
        initDateInputBounds();
        await refreshQueue();

        // Real-time synchronization
        if (typeof io === 'function') {
            const socket = io();
            socket.on('queue_updated', () => { refreshQueue(); });
            socket.on('appointment-updated', () => { refreshQueue(); });
        }
    })();
</script>
<script src="/InactivityTimer/InactivityTimer.js"></script>
</body>
</html>
