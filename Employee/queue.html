    const statusColors = {//color background for status dropdown
        "Pending": "bg-[#E8A55C]",
        "Waiting": "bg-[#E8DD5C]",
        "Ongoing": "bg-[#7FD8E8]",
        "Completed": "bg-[#B6E85C]"
    };

    const rowsPerPage = 8;
    let currentPage = 1;
    let currentFilter = "All";
    let currentSearch = "";

    function getFiltered() {
    return appointments
        .map((a, originalIndex) => ({ ...a, originalIndex })) // attach real index
        .filter(a => {
            const matchesFilter = currentFilter === "All" || a.status === currentFilter;
            const matchesSearch = `${a.firstName} ${a.lastName}`.toLowerCase().includes(currentSearch.toLowerCase());
            return matchesFilter && matchesSearch;
        });
    }

    function renderCounts() { //update the counts in the filter cards based on current data
        document.getElementById('countPending').textContent = appointments.filter(a => a.status === "Pending").length;
        document.getElementById('countWaiting').textContent = appointments.filter(a => a.status === "Waiting").length;
        document.getElementById('countOngoing').textContent = appointments.filter(a => a.status === "Ongoing").length;
        document.getElementById('countCompleted').textContent = appointments.filter(a => a.status === "Completed").length;
    }

function renderTable() { //dynamically render table based on current filter, search, and pagination
    const filtered = getFiltered();
    const start = (currentPage - 1) * rowsPerPage;
    const pageItems = filtered.slice(start, start + rowsPerPage);

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

        pageItems.forEach((item) => {
        const row = document.createElement('tr');
        row.className = "border-b border-[#2A1001]/10";
        row.innerHTML = `
            <td class="py-3 px-4 text-center">${item.firstName} ${item.lastName}</td>
            <td class="py-3 px-4 text-center">${item.phone}</td>
            <td class="py-3 px-4 text-center">${item.service}</td>
            <td class="py-3 px-4 text-center">
                <select class="statusSelect ${statusColors[item.status]} font-semibold text-[#2A1001] rounded-full px-3 py-1 outline-none cursor-pointer" data-index="${item.originalIndex}">
                    <option class="bg-white text-[#2A1001]" ${item.status === "Pending" ? "selected" : ""}>Pending</option>
                    <option class="bg-white text-[#2A1001]" ${item.status === "Waiting" ? "selected" : ""}>Waiting</option>
                    <option class="bg-white text-[#2A1001]" ${item.status === "Ongoing" ? "selected" : ""}>Ongoing</option>
                    <option class="bg-white text-[#2A1001]" ${item.status === "Completed" ? "selected" : ""}>Completed</option>
                </select>
            </td>
        `;
        tbody.appendChild(row);
    });


    renderPagination(filtered.length);
}


document.getElementById('tableBody').addEventListener('change', function (e) {//filter the table based on the status selected in the dropdown
    if (e.target.classList.contains('statusSelect')) {
        const idx = e.target.dataset.index;
        appointments[idx].status = e.target.value;
        renderCounts();
        renderTable();
    }
});
    function renderPagination(totalItems) { //dynamically render pagination buttons based on current filter, search, and total items
    const totalPages = Math.max(1, Math.ceil(totalItems / rowsPerPage));
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';

    const maxVisible = 7;


    const currentBatch = Math.floor((currentPage - 1) / maxVisible); 
    const batchStart = currentBatch * maxVisible + 1;
    const batchEnd = Math.min(batchStart + maxVisible - 1, totalPages);

  
    if (batchStart > 1) {// PREV arrow
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.className = "w-9 h-9 rounded-full font-bold text-[#2A1001] bg-transparent border border-[#2A1001]/30 hover:bg-[#2A1001]/10 transition flex items-center justify-center";
    prevBtn.addEventListener('click', () => {
        currentPage = batchStart - 1;
        renderTable();
    });
    pagination.appendChild(prevBtn);
}

    // Page number buttons for the current batch only
    for (let i = batchStart; i <= batchEnd; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = `w-9 h-9 rounded-full font-semibold ${i === currentPage ? 'bg-[#6B7A4C] text-white' : 'bg-white text-[#2A1001] border border-[#2A1001]/20'}`;
        btn.addEventListener('click', () => {
            currentPage = i;
            renderTable();
        });
        pagination.appendChild(btn);
    }

    // NEXT arrow
    if (batchEnd < totalPages) {
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    nextBtn.className = "w-9 h-9 rounded-full font-bold text-[#2A1001] bg-transparent border border-[#2A1001]/30 hover:bg-[#2A1001]/10 transition flex items-center justify-center";
    nextBtn.addEventListener('click', () => {
        currentPage = batchEnd + 1;
        renderTable();
    });
    pagination.appendChild(nextBtn);
}
}

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            currentFilter = this.dataset.filter;
            currentPage = 1;
            renderTable();
        });
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', function () {
        currentSearch = this.value;
        currentPage = 1;
        renderTable();
    });

    // Initial render
    renderCounts();
    renderTable();
