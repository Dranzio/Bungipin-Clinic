async function loadPatientsFromDatabase() {
    try {
        const token = localStorage.getItem('userToken');
        const response = await fetch('http://localhost:3000/api/patients', {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        patients = await response.json();
        populateSortDropdown();
        renderTable();
    } catch (error) {
        console.error("Failed to load patient records:", error);
    }
}

//this is for tab switching 
const tabSessionBtn = document.getElementById('tabSessionBtn');
const tabHistoryBtn = document.getElementById('tabHistoryBtn');
const tabSessionContent = document.getElementById('tabSessionContent');
const tabHistoryContent = document.getElementById('tabHistoryContent');


// this is the logic that visually switches the tabs and updates their styling
function activateTab(tab) { 
    if (tab === 'session') {
        tabSessionContent.classList.remove('hidden');
        tabHistoryContent.classList.add('hidden');

        tabSessionBtn.classList.add('border-[#667733]', 'text-[#2A1001]');
        tabSessionBtn.classList.remove('border-transparent', 'text-[#2A1001]/50');

        tabHistoryBtn.classList.add('border-transparent', 'text-[#2A1001]/50');
        tabHistoryBtn.classList.remove('border-[#667733]', 'text-[#2A1001]');
    } else {
        tabHistoryContent.classList.remove('hidden');
        tabSessionContent.classList.add('hidden');

        tabHistoryBtn.classList.add('border-[#667733]', 'text-[#2A1001]');
        tabHistoryBtn.classList.remove('border-transparent', 'text-[#2A1001]/50');

        tabSessionBtn.classList.add('border-transparent', 'text-[#2A1001]/50');
        tabSessionBtn.classList.remove('border-[#667733]', 'text-[#2A1001]');
    }
}

tabSessionBtn.addEventListener('click', () => activateTab('session'));
tabHistoryBtn.addEventListener('click', () => activateTab('history'));


// This function dynamically builds and displays the list of past appointment cards in the "Past History" tab.
// It loops through a patient's previous visits, counts how many X-rays belong to each specific visit
function renderVisitHistory(appointmentsList, allXrays) {
    const container = document.getElementById('visitHistoryList');

    if (!appointmentsList || appointmentsList.length === 0) {
        container.innerHTML = `<p class="text-sm text-[#2A1001]/50 text-center py-6">No previous visits recorded.</p>`;
        return;
    }

    container.innerHTML = appointmentsList.map(a => {
        const xrayCount = allXrays.filter(x => x.appointment_id === a.appointment_id).length;

        return `
        <div class="bg-white/70 rounded-2xl p-4">
            <div class="flex justify-between items-start mb-1">
                <p class="font-bold text-[#2A1001]">${a.appointment_date}</p>
                <span class="text-xs font-semibold text-[#667733] bg-[#667733]/10 px-3 py-1 rounded-full">${a.service_label}</span>
            </div>
            <p class="text-sm text-[#2A1001]/70 mb-1"><span class="font-semibold">Patient Concern:</span> ${a.patient_note || 'None noted'}</p>
            <p class="text-sm text-[#2A1001]/70 mb-2"><span class="font-semibold">Dentist Note:</span> ${a.dentist_note || 'No notes recorded'}</p>

            ${xrayCount > 0
                ? `<button class="viewVisitXraysBtn text-xs font-semibold text-white bg-[#667733] hover:bg-[#556022] transition px-3 py-1.5 rounded-full" data-appointment-id="${a.appointment_id}" data-date="${a.appointment_date}" data-service="${a.service_label}">
                       View X-Rays (${xrayCount})
                   </button>`
                : `<p class="text-xs text-[#2A1001]/40 italic">No X-rays for this visit.</p>`
            }
        </div>
    `}).join('');


  // "View X-Rays" button and filters the X-rays for last visit's specific date, populates the modal gallery
    // it also displays the pop-up window so the dentist can see the previous xray assets
    document.querySelectorAll('.viewVisitXraysBtn').forEach(btn => {
        btn.addEventListener('click', function () {
            const xraysForVisit = allXrays.filter(x => x.appointment_id == this.dataset.appointmentId);

            document.getElementById('visitXrayModalDate').textContent = this.dataset.date;
            document.getElementById('visitXrayModalService').textContent = this.dataset.service;
            
        
            document.getElementById('visitXrayModalGrid').innerHTML = xraysForVisit
                .map(x => `<img src="${x.file_url}" class="w-full aspect-square rounded-xl object-cover cursor-pointer hover:opacity-90 transition" />`)
                .join('');

            document.getElementById('visitXrayModal').classList.remove('hidden');
        });
    });
}

//This checks if the receptionist has cchanged the status queue of the patient to ongoing. If yes, it shows the medical form.
function refreshSessionTabVisibility(p) {
    const noSession = document.getElementById('noSessionContent');
    const activeSession = document.getElementById('sessionActiveContent');

    if (p.ongoing_appointment) {
        noSession.classList.add('hidden');
        activeSession.classList.remove('hidden');
    } else {
        noSession.classList.remove('hidden');
        activeSession.classList.add('hidden');
    }
}

//opens the modal and populates the fields with the selected patient's data
function openModal(id) {
    const p = patients.find(p => p.patient_id == id);
    if (!p) return;

    currentPatientId = id;

    document.getElementById('mFirstName').textContent = p.first_name;
    document.getElementById('mLastName').textContent = p.last_name;
    document.getElementById('mSex').textContent = p.sex;
    document.getElementById('mBirthday').textContent = p.birthday;
    document.getElementById('mEmail').textContent = p.email;
    document.getElementById('mPhone').textContent = p.phone;
    document.getElementById('mCivilStatus').textContent = p.civil_status;
    document.getElementById('mHealthConditions').textContent = p.health_conditions.map(c => c.description).join(', ') || 'None';
    document.getElementById('mPregnancy').textContent = p.pregnancy_status;
    document.getElementById('mPrescriptions').textContent = p.prescriptions.map(rx => rx.medication_name).join(', ') || 'None';
    document.getElementById('mAllergies').textContent = p.allergies.map(a => a.allergen).join(', ') || 'None';

// Today's Session notes 
    const ongoing = p.ongoing_appointment;
    document.getElementById('mNotes').value = ongoing ? (ongoing.dentist_note || '') : (p.dentist_note || ''); //DELETE THIS AND REPLACE=================================================================LOOOKKK
    //document.getElementById('mNotes').value = ongoing ? (ongoing.dentist_note || '') : ''; use this

    // Past History
    renderVisitHistory(p.past_appointments, p.xrays);

    renderXrayPreviews(p); 

    refreshSessionTabVisibility(p); // show live session form

    activateTab('session'); // always reset to Tab 1 when opening a patient
    document.getElementById('saveConfirmation').classList.add('hidden')//Save confirmation message
    document.getElementById('patientModal').classList.remove('hidden');
}

//This function displays a patient's X-ray assets as small thumbnails and lets the user delete them.
function renderXrayPreviews(p) {
    const sessionPreview = document.getElementById('sessionXrayPreview');
    sessionPreview.innerHTML = '';

    // Filter to only show X-rays belonging to today's ongoing appointment
    const ongoingId = p.ongoing_appointment ? p.ongoing_appointment.appointment_id : null;
    const todayXrays = p.xrays.filter(x => x.appointment_id === ongoingId);

    
//If no assets have been uploaded today, show a default placeholder message
    if (todayXrays.length === 0) {
        sessionPreview.innerHTML = `<p class="text-sm text-[#2A1001]/50 w-full text-center py-2">No X-rays uploaded for today's session yet.</p>`;
        return;
    }

    todayXrays.forEach((xray) => {
        // This makes sure that the little "X" button deletes the correct image from the database, not just the filtered list.
        const globalIndex = p.xrays.indexOf(xray);
        
        const thumb = document.createElement('div');
        thumb.className = "relative w-20 h-20 rounded-xl overflow-hidden border border-[#2A1001]/20";
        thumb.innerHTML = `
            <img src="${xray.file_url}" class="w-full h-full object-cover" />
            <button class="removeXrayBtn absolute top-0.5 right-0.5 bg-black/60 text-white text-xs w-5 h-5 rounded-full" data-index="${globalIndex}">×</button>
        `;
        sessionPreview.appendChild(thumb);
    });

    
    document.querySelectorAll('.removeXrayBtn').forEach(btn => {
        btn.addEventListener('click', function () {
            p.xrays.splice(this.dataset.index, 1);
            renderXrayPreviews(p); // Re-render live session previews
        });
    });
}


//This allows the user to close the X-ray history modal by clicking anywhere in the empty background
document.getElementById('visitXrayModal').addEventListener('click', function (e) {
    if (e.target === this) this.classList.add('hidden');
});

document.getElementById('visitXrayModalGrid').addEventListener('click', function(e) {
    // Check if the user clicked on an image
    if (e.target.tagName === 'IMG') {
        const fullViewer = document.getElementById('fullImageViewer');
        document.getElementById('fullImageSrc').src = e.target.src; // Copy the clicked image source
        fullViewer.classList.remove('hidden'); // Show the dark viewer
        fullViewer.classList.add('flex');

    const rowsPerPage = 10;
    let currentPage = 1;
    let currentSearch = "";
    let currentSort = "recent";

function getAvailableDateGroups() {
    const groups = new Set();

    patients.forEach(p => {
        const date = new Date(p.last_visit);
        const year = date.getFullYear();
        const month = date.toLocaleString('default', { month: 'long' }); 
        groups.add(`${year}-${date.getMonth()}::${month} ${year}`);
    });

   
    return Array.from(groups)
        .map(g => {
            const [sortKey, label] = g.split('::');
            return { sortKey, label };
        })
        .sort((a, b) => b.sortKey.localeCompare(a.sortKey));
}


//sets up a dropdown menu that lets users sort or filter patients by date
function populateSortDropdown() {
    const sortSelect = document.getElementById('sortSelect');
    const groups = getAvailableDateGroups();

    // Static top options
    sortSelect.innerHTML = `
        <option value="recent" class="bg-white text-[#2A1001]">Sort: Most Recent</option>
        <option value="oldest" class="bg-white text-[#2A1001]">Oldest First</option>
    `;

    // Dynamic month/year options, generated from real patient data
    groups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.sortKey;   
        opt.textContent = g.label; 
        opt.className = "bg-white text-[#2A1001]";
        sortSelect.appendChild(opt);
    });
}


// filter patients based on search input and sort selection
 function getFiltered() {
    let result = patients.filter(p =>
        `${p.first_name} ${p.last_name}`.toLowerCase().includes(currentSearch.toLowerCase())
    );

    if (currentSort === "recent") {
        result.sort((a, b) => new Date(b.last_visit) - new Date(a.last_visit));
    } else if (currentSort === "oldest") {
        result.sort((a, b) => new Date(a.last_visit) - new Date(b.last_visit));
    } else {
        // filter to just that year+month
        const [year, monthIndex] = currentSort.split('-').map(Number);
        result = result.filter(p => {
            const d = new Date(p.last_visit);
            return d.getFullYear() === year && d.getMonth() === monthIndex;
        });
        result.sort((a, b) => new Date(b.last_visit) - new Date(a.last_visit));
    }

    return result;
}

//builds and displays the table of patients making sure only the correct number of rows are shown per page after filtering and sorting 
    function renderTable() {
        const filtered = getFiltered();
        const start = (currentPage - 1) * rowsPerPage;
        const pageItems = filtered.slice(start, start + rowsPerPage);

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        pageItems.forEach(p => {
            const row = document.createElement('tr');
            row.className = "border-b border-[#2A1001]/10";
            row.innerHTML = `
                <td class="text-center py-3 px-6">${p.patient_id}</td>
                    <td class="text-center py-3 px-6">${p.first_name} ${p.last_name}</td>
                    <td class="text-center py-3 px-6">${p.last_visit}</td>
                    <td class="text-center py-3 px-6">
                    <button class="viewFullBtn inline-flex flex-row items-center justify-center gap-2 bg-[#667733] hover:bg-[#556022] transition text-white text-sm font-semibold px-5 py-2 rounded-full" data-id="${p.patient_id}">
                        <img src="../assets/view.png" alt="View" class="w-5 h-5 object-contain shrink-0" />
                        <span class="whitespace-nowrap">View Full</span>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });

    

        renderPagination(filtered.length);
    }

    document.getElementById('tableBody').addEventListener('click', function (e) {
    if (e.target.closest('.viewFullBtn')) {
        const btn = e.target.closest('.viewFullBtn');
        openModal(btn.dataset.id);
    }
});


// builds and displays the pagination buttons based on the number of filtered patients and the current page also only shows batch number by 7
    function renderPagination(totalItems) {
        const totalPages = Math.max(1, Math.ceil(totalItems / rowsPerPage));
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        const maxVisible = 7;
        const currentBatch = Math.floor((currentPage - 1) / maxVisible);
        const batchStart = currentBatch * maxVisible + 1;
        const batchEnd = Math.min(batchStart + maxVisible - 1, totalPages);

        if (batchStart > 1) {
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '‹';
            prevBtn.className = "w-9 h-9 rounded-full font-bold text-[#2A1001] bg-transparent border border-[#2A1001]/30 hover:bg-[#2A1001]/10 transition flex items-center justify-center";
            prevBtn.addEventListener('click', () => { currentPage = batchStart - 1; renderTable(); });
            pagination.appendChild(prevBtn);
        }

        for (let i = batchStart; i <= batchEnd; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `w-9 h-9 rounded-full font-semibold ${i === currentPage ? 'bg-[#6B7A4C] text-white' : 'bg-white text-[#2A1001] border border-[#2A1001]/20'}`;
            btn.addEventListener('click', () => { currentPage = i; renderTable(); });
            pagination.appendChild(btn);
        }

        if (batchEnd < totalPages) {
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '›';
            nextBtn.className = "w-9 h-9 rounded-full font-bold text-[#2A1001] bg-transparent border border-[#2A1001]/30 hover:bg-[#2A1001]/10 transition flex items-center justify-center";
            nextBtn.addEventListener('click', () => { currentPage = batchEnd + 1; renderTable(); });
            pagination.appendChild(nextBtn);
        }
    }

    //Patient Modal click x button to close
    document.getElementById('closeModal').addEventListener('click', function () {
    document.getElementById('patientModal').classList.add('hidden');
    });

   //Patient Modal click outside to close
    document.getElementById('patientModal').addEventListener('click', function (e) {
        if (e.target === this) this.classList.add('hidden');
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', function () {
        currentSearch = this.value;
        currentPage = 1;
        renderTable();
    });

    // Sort
    document.getElementById('sortSelect').addEventListener('change', function () {
        currentSort = this.value;
        currentPage = 1;
        renderTable();
    });

    // QR button — placeholder for now
    document.getElementById('qrBtn').addEventListener('click', function () {
        alert("QR Scanner coming soon placeholder lng toh lols");
    });

    // Initial render
    populateSortDropdown();
    renderTable();
    activateTab('session');
</script>

</body>
</html>
