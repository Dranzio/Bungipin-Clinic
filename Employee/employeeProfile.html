<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/output.css" rel="stylesheet">
  <title>Employee Dashboard - Profile</title>
  <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
  <script src="../Taskbar/Employee_Sidebar.js"></script>
</head>

<body class="min-h-screen bg-[#F3EFE4] relative flex flex-col md:flex-row antialiased">

<!-- SIDEBAR -->
  <div id="sidebar-placeholder"></div>
  <script>
    (async () => {
      try {
        const response = await fetch('../Taskbar/Employee_Task.html');
        if (response.ok) {
          const data = await response.text();
          document.getElementById('sidebar-placeholder').innerHTML = data;
          const currentPage = window.location.pathname.split("/").pop();
          document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('data-page') === currentPage) {
              link.classList.add('bg-[#FDFCE9]');
            }
          });
          if (typeof initSidebar === 'function') {
            initSidebar();
          }
        }
      } catch (error) {
        console.log('Sidebar fallback:', error);
      }
    })();
  </script>

<!-- CONTENT WRAPPER-->
<div class="flex-1 flex flex-col w-full max-h-screen overflow-y-auto">

  <!-- Header -->
  <div class="flex justify-between items-start pt-5 pl-6 pr-4 md:pl-24 md:pr-8">
    <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] pt-5 font-bold text-[#2A1001] font-['Poppins']">
      Employee Profile
    </h1>
    <img
            src="../assets/logowithtitle.png"
            class="w-20 sm:w-24 md:w-28 h-auto object-contain shrink-0"
            alt="Logo"/>
  </div>
  <hr class="border-t border-[#2A1001] mt-2 mb-6" />

  <!-- MAIN CONTENT -->
  <main class="w-full max-w-4xl mx-auto py-8 px-6 md:px-12">

    <!-- Success Message -->
    <div id="successMessage" class="hidden mb-6 p-4 rounded-2xl bg-[#556b2f] text-white font-bold text-center text-sm shadow-md">
      Profile changes updated successfully!
    </div>

    <!-- PROFILE FORM -->
    <form id="employee_profile" class="flex flex-col items-center gap-12 w-full">

      <!-- Section 1: Basic Information -->
      <div class="relative w-full bg-[#D7E3A5] rounded-2xl p-7 pt-9 shadow-sm">
          <span class="absolute -top-3.5 left-6 bg-[#667733] text-white text-xs font-bold px-4 py-1.5 rounded-full tracking-wider uppercase shadow-sm">
            Basic Information
          </span>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">

          <!-- First Name (READONLY) -->
          <div class="flex flex-col gap-1.5">
            <label for="first_name" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">First Name:</label>
            <input type="text" id="first_name" name="first_name" readonly
                   class="w-full px-4 py-2.5 rounded-full bg-[#dedede] text-[#2d372e]/70 font-semibold text-sm outline-none shadow-inner cursor-not-allowed border border-black/10">
          </div>

          <!-- Last Name (READONLY) -->
          <div class="flex flex-col gap-1.5">
            <label for="last_name" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Last Name:</label>
            <input type="text" id="last_name" name="last_name" readonly
                   class="w-full px-4 py-2.5 rounded-full bg-[#dedede] text-[#2d372e]/70 font-semibold text-sm outline-none shadow-inner cursor-not-allowed border border-black/10">
          </div>

          <!-- Employee ID / Staff Code (READONLY) -->
          <div class="flex flex-col gap-1.5">
            <label for="staff_code" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Employee ID:</label>
            <input type="text" id="staff_code" name="staff_code" readonly
                   class="w-full px-4 py-2.5 rounded-full bg-[#dedede] text-[#2d372e]/70 font-semibold text-sm outline-none shadow-inner cursor-not-allowed border border-black/10">
          </div>

          <!-- Position (READONLY — only Admin can change this, via User Management) -->
          <div class="flex flex-col gap-1.5">
            <label for="position" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Position:</label>
            <input type="text" id="position" name="position" readonly
                   class="w-full px-4 py-2.5 rounded-full bg-[#dedede] text-[#2d372e]/70 font-semibold text-sm outline-none shadow-inner cursor-not-allowed border border-black/10">
          </div>

          <!--sex (READONLY)-->
          <div class="flex flex-col gap-1.5">
            <label for="sex" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Sex:</label>
            <input type="text" id="sex" name="sex" readonly
                   class="w-full px-4 py-2.5 rounded-full bg-[#dedede] text-[#2d372e]/70 font-semibold text-sm outline-none shadow-inner cursor-not-allowed border border-black/10">
          </div>


          <!-- Birthday (EDITABLE - Will be auto-locked) -->
          <div class="flex flex-col gap-1.5">
            <label for="birthday" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Birthday:</label>
            <input type="date" id="birthday" name="birthday"
                   class="w-full px-4 py-2.5 rounded-full bg-white text-[#2d372e] font-medium text-sm outline-none shadow-inner focus:ring-2 focus:ring-[#556b2f]/50">
          </div>

          <!-- Civil Status (EDITABLE - Will be auto-locked) -->
          <div class="flex flex-col gap-1.5">
            <label for="civil_status" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Civil Status:</label>
            <select id="civil_status" name="civil_status" required
                    class="w-full px-4 py-2.5 rounded-full bg-white text-[#2d372e] font-medium text-sm outline-none shadow-inner focus:ring-2 focus:ring-[#556b2f]/50 cursor-pointer">
              <option value="" disabled selected>Select civil status</option>
              <option value="Single">Single</option>
              <option value="Married">Married</option>
              <option value="Divorced">Divorced</option>
              <option value="Widowed">Widowed</option>
            </select>
          </div>

        </div>
      </div>

      <!-- Section 2: Contact Information -->
      <div class="relative w-full bg-[#D7E3A5] rounded-2xl p-7 pt-9 shadow-sm">
          <span class="absolute -top-3.5 left-6 bg-[#667733] text-white text-xs font-bold px-4 py-1.5 rounded-full tracking-wider uppercase shadow-sm">
            Contact Information
          </span>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">

          <!-- Primary Email (READONLY) -->
          <div class="flex flex-col gap-1.5">
            <label for="email" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Primary Email:</label>
            <input type="email" id="email" name="email" readonly
                   class="w-full px-4 py-2.5 rounded-full bg-[#dedede] text-[#2d372e]/70 font-semibold text-sm outline-none shadow-inner cursor-not-allowed border border-black/10">
          </div>

          <!-- Phone Number (EDITABLE - Will be auto-locked) -->
          <div class="flex flex-col gap-1.5">
            <label for="phone" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="09XXXXXXXXX" maxlength="11"
                   class="w-full px-4 py-2.5 rounded-full bg-white text-[#2d372e] font-medium text-sm outline-none shadow-inner focus:ring-2 focus:ring-[#556b2f]/50">
          </div>
        </div>
      </div>

      <!-- Section 3: Change Password -->
      <div class="relative w-full bg-[#D7E3A5] rounded-2xl p-7 pt-9 shadow-sm">
          <span class="absolute -top-3.5 left-6 bg-[#667733] text-white text-xs font-bold px-4 py-1.5 rounded-full tracking-wider uppercase shadow-sm">
            Change Password
          </span>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
          <!-- New Password (EDITABLE - Will be auto-locked) -->
          <div class="flex flex-col gap-1.5">
            <label for="new_password" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">New Account Password:</label>
            <input type="password" id="new_password" name="new_password" placeholder="Enter New Password"
                   class="w-full px-4 py-2.5 rounded-full bg-white text-[#2d372e] font-medium text-sm outline-none shadow-inner focus:ring-2 focus:ring-[#556b2f]/50">
          </div>

          <!-- Confirm Password (EDITABLE - Will be auto-locked) -->
          <div class="flex flex-col gap-1.5">
            <label for="confirm_password" class="text-[11px] font-extrabold tracking-wider text-[#2d372e] uppercase">Confirm Account Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password"
                   class="w-full px-4 py-2.5 rounded-full bg-white text-[#2d372e] font-medium text-sm outline-none shadow-inner focus:ring-2 focus:ring-[#556b2f]/50">
          </div>
        </div>
      </div>
      <!-- Submit Button -->
      <button type="submit" class="z-10 bg-[#D5C04D] hover:bg-[#F6F2DB] text-[#2A1001] font-black text-xl px-12 py-3 rounded-full shadow-md active:scale-95 transition transform">
        Update Changes
      </button>
    </form>
  </main>
</div>




<script>

  const form = document.getElementById('employee_profile');
  const newPassword = document.getElementById('new_password');
  const confirmPassword = document.getElementById('confirm_password');
  const phoneInput = document.getElementById('phone');
  const successMessage = document.getElementById('successMessage');


  phoneInput.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 11);
  });

  // Real-time password match validation
  confirmPassword.addEventListener('input', function () {
    if (newPassword.value && this.value && newPassword.value !== this.value) {
      this.setCustomValidity('Passwords do not match.');
    } else {
      this.setCustomValidity('');
    }
  });

  newPassword.addEventListener('input', function () {
    if (confirmPassword.value && this.value !== confirmPassword.value) {
      confirmPassword.setCustomValidity('Passwords do not match.');
    } else {
      confirmPassword.setCustomValidity('');
    }
  });

  // Collect data from database
  async function loadProfileFromDatabase() {
    try {
      const token = localStorage.getItem('userToken');

      const response = await fetch('/api/employee-profile', {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) throw new Error(`Server error: ${response.status}`);

      const data = await response.json();

      // Readonly fields
      document.getElementById('first_name').value = data.first_name || '';
      document.getElementById('last_name').value  = data.last_name || '';
      document.getElementById('staff_code').value = data.staff_code || data.public_id || '';
      document.getElementById('position').value   = data.position || '';
      document.getElementById('email').value      = data.email || '';
      document.getElementById('sex').value        = data.sex || '';

      // Editable fields
      if (data.birthday) {
        document.getElementById('birthday').value = data.birthday.split('T')[0];
      }
      document.getElementById('civil_status').value = data.civil_status || '';
      document.getElementById('phone').value        = data.phone || '';

    } catch (error) {
      console.error('Failed to load profile:', error);
    }
  }

  //update profile to database
  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    // Password check
    if (newPassword.value && newPassword.value !== confirmPassword.value) {
      confirmPassword.setCustomValidity('Passwords do not match.');
      confirmPassword.reportValidity();
      return;
    } else {
      confirmPassword.setCustomValidity('');
    }

    // Build payload (only editable fields)
    const payload = {
      birthday:     document.getElementById('birthday').value,
      civil_status: document.getElementById('civil_status').value.trim(),
      phone:        document.getElementById('phone').value.trim()
    };

    // Only send password if user typed a new one
    if (newPassword.value) {
      payload.new_password = newPassword.value;
    }

    try {
      const token = localStorage.getItem('userToken');

      const response = await fetch('/api/employee-profile', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.message || 'Failed to update profile');
      }

      // Clear password fields after success
      newPassword.value = '';
      confirmPassword.value = '';

      // Show success message for 4 seconds
      successMessage.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      setTimeout(() => {
        successMessage.classList.add('hidden');
      }, 4000);

    } catch (error) {
      console.error('Error saving profile:', error);
      alert('Could not update profile: ' + error.message);
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    loadProfileFromDatabase();
  });

  document.addEventListener('DOMContentLoaded', () => {
    // List of editable field IDs specific to the employee page
    const editableFields = [
      'birthday', 'civil_status', 'phone', 'new_password', 'confirm_password'
    ];

    editableFields.forEach(id => {
      const field = document.getElementById(id);
      if (!field) return;

      // Lock the fields (keeps them white, prevents editing until clicked)
      if (field.tagName === 'SELECT') {
        field.classList.add('pointer-events-none');
      } else {
        field.setAttribute('readonly', 'true');
        field.classList.add('cursor-default');
      }

      field.classList.add('pr-10');

      //Create the wrapper for the icon
      const wrapper = document.createElement('div');
      wrapper.className = 'relative w-full flex items-center';

      field.parentNode.insertBefore(wrapper, field);
      wrapper.appendChild(field);

      //Create the circular pencil button
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'absolute right-2 w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-md border border-gray-100 hover:bg-gray-50 transition z-10 cursor-pointer';
      btn.innerHTML = `<img src="../assets/editIcon.png" class="w-3.5 h-3.5 opacity-80" alt="Edit">`;

      //Click event to unlock
      btn.addEventListener('click', () => {
        if (field.tagName === 'SELECT') {
          field.classList.remove('pointer-events-none');
        } else {
          field.removeAttribute('readonly');
          field.classList.remove('cursor-default');
        }
        field.focus();
        btn.classList.add('hidden'); // Hide pencil when unlocked
      });

      wrapper.appendChild(btn);
    });
  });
</script>

</body>
</html>
