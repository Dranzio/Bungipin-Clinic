<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- DENIED DIRECT PAGE ACCESS VIA URL -->
    <script src="../pageProtection.js"></script>
    <title>Messages</title>
    <link rel="stylesheet" href="/output.css">
    <!-- Tailwind CDN Fallback for missing builds -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
    <script src="/Taskbar/Employee_Sidebar.js"></script>
    <script src="Messages_Employee.js"></script>
</head>
<body class="bg-[#F3EFE4] min-h-screen font-sans text-[#2c3e2b] antialiased">
<div class="min-h-[100dvh] flex flex-col md:flex-row w-full"> <!--Div for whole body-->
    <!-- SIDEBAR -->
    <div id="sidebar-placeholder"></div>
    <script>
        function syncContentOffset() {
            const placeholder = document.getElementById('sidebar-placeholder');
            const sidebar = Array.from(placeholder.children)
                .find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
            if (!sidebar) return;

            const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

            const apply = () => {
                const desktop = window.innerWidth >= 768;
                set(placeholder, 'flexShrink', '0');
                set(sidebar, 'position', desktop ? 'sticky' : 'relative');
                set(sidebar, 'top', desktop ? '0px' : 'auto');
                set(sidebar, 'height', desktop ? '100vh' : '');
                set(sidebar, 'overflowY', desktop ? 'auto' : '');
            };

            window.addEventListener('resize', apply);
            apply();
        }

        (async () => {
            try {
                const response = await fetch('/Taskbar/Dentist_Task.html');
                if (response.ok) {
                    const data = await response.text();
                    document.getElementById('sidebar-placeholder').innerHTML = data;
                    const currentPage = window.location.pathname.split("/").pop();
                    document.querySelectorAll('.nav-link').forEach(link => {
                        if (link.getAttribute('data-page') === currentPage) {
                            link.classList.add('bg-[#FDFCE9]');
                        }
                    });
                    if (typeof initSidebar === 'function') {
                        initSidebar();
                    }
                    syncContentOffset();
                }
            } catch (error) {
                console.log('Sidebar fallback:', error);
            }
        })();
    </script>

    <div id="main-content" class="flex flex-col flex-1 w-full min-w-0 md:overflow-y-auto">
        <div class="shrink-0 flex justify-between items-start pt-5 pl-6 pr-4 md:pl-24 md:pr-8">
            <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] pt-5 font-bold text-[#2A1001] font-['Poppins']">
                Messages
            </h1>
            <img
                    src="../assets/logowithtitle.png"
                    class="w-20 sm:w-24 md:w-28 h-auto object-contain shrink-0"
                    alt="Logo"/>
        </div>
        <hr class="border-t border-[#2A1001] mt-2 mb-6" />



        <!-- Main Content Area Wrapper -->
        <div class="flex-1 p-4 sm:p-6 md:p-10 flex justify-center items-start">
            <main class="w-full max-w-4xl flex flex-col items-center gap-8">

                <div class="flex flex-col w-full max-w-4xl">


                     <!-- Search Bar & Filter Header -->
                    <div class="flex flex-col sm:flex-row w-full items-stretch sm:items-center justify-between gap-3 mb-6">
                        <!-- Modern Search Bar -->
                        <div class="relative w-full sm:max-w-md flex items-center">
                            <span class="absolute left-4 flex items-center pointer-events-none text-gray-400">
                                <i class="fa-solid fa-magnifying-glass text-sm"></i>
                            </span>
                            <input
                                type="text"
                                id="searchInput"
                                placeholder="Search patient or message..."
                                class="w-full h-11 pl-11 pr-4 rounded-full border border-[#2A1001]/20 bg-white outline-none shadow-sm text-xs sm:text-sm text-[#2A1001] focus:ring-2 focus:ring-[#667733]/40 transition"
                            />
                        </div>

                        <!--Filter Buttons-->
                        <div class="relative shrink-0">
                            <span class="font-extrabold text-sm text-[#2c3e2b]">Sort:</span>
                            <select id="filterSelect" class="appearance-none bg-[#D1C363] text-black font-extrabold px-6 py-2.5 pr-10 rounded-full border-black text-sm cursor-pointer shadow-sm outline-none">
                                <option value="all"> All </option>
                                <option value="unread"> Unread </option>
                                <option value="read"> Read </option>
                            </select>

                            <!-- Custom dropdown arrow icon -->
                            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-black">
                                <i class="fa-solid fa-chevron-down text-xs font-bold"></i>
                            </div>
                        </div>
                    </div>

                    <!--Div for Messages Tabs-->
                    <div id="messagesList" class="flex flex-col w-full gap-5.5">
                        <!-- Dynamic messages will be injected here by Messages_Employee.js -->
                    </div>


                </div>

            </main>

            <!-- RIGHT-SIDE CHAT PANEL DRAWER -->
            <div id="chatModal" class="hidden fixed inset-0 bg-black/40 flex justify-end z-50">
                <div class="relative w-full max-w-3xl h-[100dvh] bg-[#F4F1EA] border-1 border-black flex flex-col shadow-2xl overflow-hidden">

                    <!-- Floating Yellow Close Button (Top-Left of the drawer) -->
                    <button onclick="closeChat()" class="absolute top-4 left-4 w-10 h-10 bg-[#D1C363] border-1 border-black rounded-lg flex items-center justify-center font-extrabold text-black cursor-pointer shadow-md hover:bg-[#c5b757] transition-all z-10">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>

                    <!-- Panel Header -->
                    <div class="border-1 border-black px-16 py-5 flex items-center bg-[#F4F1EA]">
                        <h2 id="chatDocName" class="font-extrabold text-2xl text-[#2c3e2b]">Select a patient</h2>
                    </div>

                    <div id="fileErrorBanner" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mx-4 mt-4 relative rounded shadow-sm z-20 flex justify-between items-start">
                        <div class="flex flex-col">
                            <span id="fileErrorMessage" class="text-sm font-bold whitespace-pre-line"></span>
                        </div>
                        <button onclick="closeFileErrorBanner()" class="text-red-700 hover:text-red-900 cursor-pointer ml-4">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Chat Messages Area (Scrollable) -->
                    <div id="chatMessagesArea" class="flex-1 p-6 overflow-y-auto flex flex-col gap-6 bg-[#F9F7F1] break-words">
                        <!-- Dynamic chat messages will be injected here -->
                    </div>

                    <!-- Chat Input & Attachment Area — wrapped for drag-and-drop -->
                    <div id="chatDropZone" class="border-t-4 border-black bg-white flex flex-col relative transition-all duration-200 border-2 border-transparent">
                        <!-- File Preview Area -->
                        <div id="filePreviewArea" class="hidden w-full max-h-24 overflow-y-auto bg-gray-50 border-b-2 border-black flex flex-wrap gap-2 p-2 absolute bottom-full left-0"></div>

                        <!-- Attachment Icons Toolbar -->
                        <div class="px-4 py-2 border-b-2 border-black flex gap-4 items-center text-gray-700 bg-[#F4F1EA]">
                            <!-- 1st button: Files, PDFs, docs, media, images, video, audio ONLY -->
                            <input type="file" id="fileUploadInput" class="hidden" multiple
                                accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,image/*,video/*,audio/*"
                                onchange="handleFileSelect(event)">
                            <button onclick="document.getElementById('fileUploadInput').click()" class="hover:text-black cursor-pointer" title="Attach file (PDF, docs, images, video, audio — max 100 MB)"><i class="fa-solid fa-paperclip text-lg"></i></button>

                            <!-- 2nd button: Insert link modal -->
                            <button type="button" onclick="openLinkModal()" class="hover:text-black cursor-pointer" title="Insert a link"><i class="fa-solid fa-link text-lg"></i></button>

                            <!-- File size hint -->
                            <span class="ml-auto text-xs text-gray-400 select-none">Max 100 MB per file</span>
                        </div>
                        
                        <!-- Textarea Box -->
                        <div id="chatInput" contenteditable="true" 
                            data-placeholder="Type a message... (drag & drop or Ctrl+V to attach files)" 
                            class="w-full h-28 p-4 outline-none overflow-y-auto text-sm bg-white empty:before:content-[attr(data-placeholder)] empty:before:text-gray-400">
                        </div>
                        
                        <!-- Send Button Row -->
                        <div class="px-4 py-2 bg-[#F4F1EA] border-t-2 border-black flex justify-end">
                            <button id="sendBtn" onclick="sendMessage()" class="font-extrabold text-black hover:underline cursor-pointer text-sm">
                                Send
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Link Modal -->
            <div id="linkModal" class="hidden fixed inset-0 bg-black-900/60 backdrop-blur-md flex justify-center items-center z-[60]" onclick="if(event.target===this) closeLinkModal()">
                <div class="bg-[#F4F1EA] border-2 border-black rounded-xl p-6 w-full max-w-md shadow-2xl flex flex-col gap-4">
                    <h3 class="text-xl font-extrabold text-[#2B0F01]">Insert Link</h3>
                    <!-- Inline warning message (hidden by default) -->
                    <p id="linkModalWarning" class="hidden text-red-600 text-xs font-bold bg-red-50 border border-red-300 rounded px-3 py-2"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Please enter a link URL before inserting.</p>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-bold uppercase text-[#2B0F01]">Link URL:</label>
                        <input type="url" id="linkModalUrl" placeholder="https://example.com" class="w-full px-3 py-2 rounded border border-black text-sm bg-white outline-none">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-bold uppercase text-[#2B0F01]">Link Title / Display Name:</label>
                        <input type="text" id="linkModalTitle" placeholder="My Website Document" class="w-full px-3 py-2 rounded border border-black text-sm bg-white outline-none">
                    </div>
                    <div class="flex justify-end gap-3 mt-2">
                        <button type="button" onclick="closeLinkModal()" class="px-4 py-2 bg-[#D7E3A5] text-[#2B0F01] font-bold text-sm rounded-full cursor-pointer border border-black">Cancel</button>
                        <button type="button" onclick="insertCustomLink()" class="px-4 py-2 bg-[#667733] text-[#ECF5E2] font-bold text-sm rounded-full cursor-pointer border border-black">Insert</button>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>
</body>
</html>
