<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <link rel="stylesheet" href="/output.css">
    <!-- Tailwind CDN Fallback for missing builds -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
    <script src="/Taskbar/Customer_Sidebar.js"></script>
    <script src="History.js"></script>
</head>
<body class="bg-[#F3EFE4] min-h-screen font-sans text-[#2c3e2b] antialiased">
<div class="min-h-screen flex flex-col md:flex-row w-full"> <!--Div for whole body-->
    <div id="sidebar-placeholder"></div>
    <script>
        function syncContentOffset() {
            const placeholder = document.getElementById('sidebar-placeholder');
            const sidebar = Array.from(placeholder.children)
                .find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
            if (!sidebar) return;

            const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

            const apply = () => {
                const desktop = window.innerWidth >= 768;
                set(placeholder, 'flexShrink', '0');
                set(sidebar, 'position', desktop ? 'sticky' : 'relative');
                set(sidebar, 'top', desktop ? '0px' : 'auto');
                set(sidebar, 'height', desktop ? '100vh' : '');
                set(sidebar, 'overflowY', desktop ? 'auto' : '');
            };

            window.addEventListener('resize', apply);
            apply();
        }
        (async () => {
            try {
                const response = await fetch('/Taskbar/Customer_Task.html');
                if (response.ok) {
                    const data = await response.text();
                    document.getElementById('sidebar-placeholder').innerHTML = data;
                    const currentPage = window.location.pathname.split("/").pop();
                    document.querySelectorAll('.nav-link').forEach(link => {
                        if (link.getAttribute('data-page') === currentPage) {
                            link.classList.add('bg-[#FDFCE9]');
                        }
                    });
                    if (typeof initSidebar === 'function') {
                        initSidebar();
                    }
                    syncContentOffset();
                }
            } catch (error) {
                console.log('Sidebar fallback:', error);
            }
        })();

    </script>

    <div id="main-content" class="flex-1 min-w-0 flex flex-col">

        <!-- Header -->
        <div class="flex justify-between items-start pt-5 pl-12 pr-4 md:pl-24 md:pr-8">
            <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] pt-5 font-bold text-[#2A1001] font-['Poppins']">
                Appointment History
            </h1>
            <img
                    src="../assets/logowithtitle.png"
                    class="w-20 sm:w-24 md:w-28 h-auto object-contain shrink-0"
                    alt="Logo"/>
        </div>
        <hr class="border-t border-[#2A1001] mt-2 mb-6" />

        <!-- Content area -->
        <div class="p-4 sm:p-6 md:p-10 flex justify-center items-start">
            <main class="w-full max-w-4xl flex flex-col items-center gap-8">

                <div class="flex flex-col w-full max-w-4xl gap-6 sm:gap-8">

                    <!-- Appointments List Container -->
                    <div class="flex flex-col w-full gap-4 sm:gap-5" id="appointment-list">
                        <!-- Dynamic appointments will be injected here by History.js -->
                    </div>

                </div>
            </main>
        </div>
    </div>
</div>


<!-- Appointment Detail Modal -->
<div id="detail-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white border-2 border-[#1a281b] rounded-2xl w-full max-w-xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b-2 border-[#1a281b] bg-[#f7f5ee] shrink-0">
            <h2 class="font-extrabold text-lg text-[#1a281b]">Appointment Details</h2>
            <button onclick="closeDetailModal()" class="w-8 h-8 flex items-center justify-center bg-white border-2 border-[#1a281b] rounded-full font-extrabold text-[#1a281b] hover:bg-gray-100 cursor-pointer transition-all">✕</button>
        </div>
        <!-- Modal Body (scrollable) -->
        <div id="detail-modal-body" class="p-6 overflow-y-auto">
            <!-- Injected by History.js -->
        </div>
    </div>
</div>

<!-- Cancel Confirmation Modal -->
<div id="cancel-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-[#F2F0EF] border-2 border-[#1a281b] rounded-2xl p-6 sm:p-8 w-full max-w-sm flex flex-col gap-5 shadow-2xl">
        <div class="flex flex-col gap-2">
            <h2 class="font-extrabold text-xl text-[#1a281b]">Cancel Appointment?</h2>
            <p class="text-sm text-gray-600">Are you sure you want to cancel this appointment? This action cannot be undone and the clinic will be notified.</p>
        </div>
        <div class="flex gap-3">
            <button id="confirm-cancel-btn"
                    class="flex-1 bg-red-500 hover:bg-red-600 text-white font-extrabold py-2.5 rounded-full border-2 border-[#1a281b] cursor-pointer active:scale-95 transition-all">
                Yes, Cancel It
            </button>
            <button onclick="closeCancelModal()"
                    class="flex-1 bg-white hover:bg-gray-100 text-[#1a281b] font-extrabold py-2.5 rounded-full border-2 border-[#1a281b] cursor-pointer active:scale-95 transition-all">
                Go Back
            </button>
        </div>
    </div>
</div>

</body>
</html>
