<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- DENIED DIRECT PAGE ACCESS VIA URL -->
    <script src="../pageProtection.js"></script>
    <title>Payment Status</title>
    <link rel="stylesheet" href="/output.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
</head>
<body class="bg-[#615F5A] min-h-screen font-poppins text-[#2A1001] antialiased flex items-center justify-center p-4">

<div class="bg-[#F3EFE4] border border-[#2A1001]/20 rounded-3xl px-6 py-7 max-w-sm w-full shadow-2xl text-center flex flex-col items-center gap-3">
    <div id="status-icon" class="w-14 h-14 rounded-full bg-[#D7E3A5] shadow-sm flex items-center justify-center shrink-0">
        <i class="fa-solid fa-spinner fa-spin text-[#667733] text-2xl"></i>
    </div>

    <div>
        <h1 id="status-title" class="font-extrabold text-xl text-[#2A1001]">Confirming your payment...</h1>
        <p id="status-text" class="mt-1 text-xs font-medium text-[#2A1001]/70 leading-snug">
            Please wait a moment while we confirm your payment with PayMongo. Don't close this page.
        </p>
    </div>

    <div id="status-details" class="hidden w-full bg-white border border-[#2A1001]/20 rounded-2xl p-4 text-xs text-left flex flex-col gap-1.5"></div>

    <a id="status-btn" href="History.html" class="w-full h-11 flex items-center justify-center bg-[#667733] hover:bg-[#556022] text-white font-bold rounded-full shadow-md active:scale-95 transition text-[13px]">
        View my appointments
    </a>
</div>

<script>
    // The redirect from PayMongo only tells us the patient came BACK — it is not
    // proof of payment. The real confirmation is the server-side webhook, which
    // flips payments.status to 'paid'. This page just waits for that to happen.
    const appointmentId = new URLSearchParams(window.location.search).get('appointment_id');
    const POLL_MS = 2000;
    const MAX_TRIES = 30; // ~60 seconds

    const el = id => document.getElementById(id);

    function show({ icon, iconBg, title, text, details }) {
        el('status-icon').className = `w-14 h-14 rounded-full ${iconBg} shadow-sm flex items-center justify-center shrink-0`;
        el('status-icon').innerHTML = icon;
        el('status-title').textContent = title;
        el('status-text').textContent = text;
        if (details) {
            const box = el('status-details');
            box.innerHTML = '';
            for (const [label, value] of details) {
                const row = document.createElement('div');
                row.className = 'flex justify-between';
                const l = document.createElement('span');
                l.className = 'font-bold text-[#2A1001]/60';
                l.textContent = label;
                const v = document.createElement('span');
                v.className = 'font-semibold';
                v.textContent = value;
                row.append(l, v);
                box.appendChild(row);
            }
            box.classList.remove('hidden');
        }
    }

    async function poll(attempt = 0) {
        try {
            const token = localStorage.getItem('userToken');
            const res = await fetch(`/api/payments/${encodeURIComponent(appointmentId)}`, {
                headers: token ? { Authorization: `Bearer ${token}` } : {}
            });
            if (!res.ok) throw new Error('lookup failed');
            const p = await res.json();

            if (p.status === 'paid') {
                show({
                    icon: '<i class="fa-solid fa-check text-[#667733] text-2xl"></i>',
                    iconBg: 'bg-[#D7E3A5]',
                    title: 'Payment received!',
                    text: 'Your appointment is booked and now waiting for clinic approval. You can track it under your appointments.',
                    details: [
                        ['Amount paid', '₱' + Number(p.amount).toLocaleString('en-US', { minimumFractionDigits: 2 })],
                        ['Method', 'Online (PayMongo)']
                    ]
                });
                return;
            }

            if (p.status === 'refund_pending') {
                show({
                    icon: '<i class="fa-solid fa-triangle-exclamation text-amber-500 text-2xl"></i>',
                    iconBg: 'bg-amber-50',
                    title: 'Your slot was no longer available',
                    text: 'Your payment went through, but the time slot was taken before it was confirmed. The clinic will refund you — please rebook another time.'
                });
                el('status-btn').href = 'Booking.html';
                el('status-btn').textContent = 'Book another slot';
                return;
            }

            // Still pending after ~20s: ask the server to double-check with PayMongo
            // once, in case the webhook was delayed or missed.
            // eli change: was `attempt === 10` (one single check). Now re-checks every 3rd poll (~6s) so a
            // payment PayMongo records a few seconds late still flips to paid. Reconcile is idempotent.
            if (attempt >= 3 && attempt % 3 === 0) {
                try {
                    await fetch(`/api/payments/${encodeURIComponent(appointmentId)}/reconcile`, {
                        method: 'POST',
                        headers: token ? { Authorization: `Bearer ${token}` } : {}
                    });
                } catch (_) { /* the next poll will pick up any change */ }
            }

            if (attempt < MAX_TRIES) {
                setTimeout(() => poll(attempt + 1), POLL_MS);
                return;
            }
        } catch (e) {
            if (attempt < MAX_TRIES) {
                setTimeout(() => poll(attempt + 1), POLL_MS);
                return;
            }
        }

        // Gave up waiting — not an error, confirmation can lag.
        show({
            icon: '<i class="fa-regular fa-clock text-amber-600 text-2xl"></i>',
            iconBg: 'bg-amber-50',
            title: 'Still confirming',
            text: "We haven't received PayMongo's confirmation yet. If you completed the payment, it will show under your appointments shortly. If you did not pay, your held slot will be released automatically."
        });
    }

    if (!appointmentId) {
        show({
            icon: '<i class="fa-solid fa-circle-question text-amber-600 text-2xl"></i>',
            iconBg: 'bg-amber-50',
            title: 'Missing appointment',
            text: 'We could not tell which appointment this payment is for. Please check your appointments.'
        });
    } else {
        poll();
    }
</script>
</body>
</html>
