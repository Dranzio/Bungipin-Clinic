<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="../output.css">
    <!-- Tailwind CDN Fallback for missing builds -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
    <script src="Booking.js"></script>

    <!-- Integrated Booking.js Script Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let selectedDateValue = '';
            let selectedTimeValue = '';
            let selectedServiceLabel = '';
            let selectedPriceValue = 0;
            let selectedPaymentMethod = 'cash';

            // 1. Time Slot Selection Logic
            document.querySelectorAll('[data-time]').forEach(slot => {
                slot.addEventListener('click', () => {
                    document.querySelectorAll('[data-time]').forEach(s => s.classList.remove('bg-[#D7E3A5]'));
                    slot.classList.add('bg-[#D7E3A5]');
                    selectedTimeValue = slot.getAttribute('data-time');
                    document.getElementById('selected-time').value = selectedTimeValue;
                });
            });

            // 2. Services — generated from the database
            const serviceGrid = document.getElementById('service-grid');
            const CARD_CLASSES = 'flex flex-col w-[200px] h-[250px] justify-between items-center text-center bg-[#FFFFFF] rounded-[8px] border-2 border-black hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer p-3';

            // Used when a service has no uploaded icon (matched on the label).
            function fallbackIcon(label) {
                const l = String(label).toLowerCase();
                if (l.includes('clean')) return '../assets/cleaning.png';
                if (l.includes('pasta') || l.includes('filling')) return '../assets/pasta.png';
                if (l.includes('check') || l.includes('consult')) return '../assets/Checkup.png';
                if (l.includes('whiten')) return '../assets/whitening.png';
                return '../assets/logo.png';
            }

            function buildServiceCard(service) {
                const card = document.createElement('div');
                card.className = CARD_CLASSES;
                card.dataset.service = service.label;
                card.dataset.serviceId = service.service_id;
                card.dataset.price = service.price;

                const title = document.createElement('h1');
                title.className = 'font-bold text-[20px] break-words';
                title.textContent = service.label;

                const img = document.createElement('img');
                img.className = 'w-28 h-28 object-contain';
                img.alt = service.label;
                const hasIcon = service.icon && (service.icon.startsWith('/') || service.icon.startsWith('http'));
                img.src = hasIcon ? service.icon : fallbackIcon(service.label);
                img.onerror = () => { img.onerror = null; img.src = '../assets/logo.png'; };

                const price = document.createElement('h2');
                price.className = 'font-bold text-[18px]';
                price.textContent = `Price: ${Number(service.price).toLocaleString()}`;

                card.append(title, img, price);
                return card;
            }

            function showServiceMessage(text) {
                const p = document.createElement('p');
                p.className = 'col-span-full text-center font-bold text-[#2c3e2b] py-10';
                p.textContent = text;
                serviceGrid.replaceChildren(p);
            }

            async function loadServices() {
                showServiceMessage('Loading services...');
                try {
                    const token = localStorage.getItem('userToken');
                    const response = await fetch(`${API_BASE_URL}/api/services`, {
                        headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                    });
                    if (response.status === 401 || response.status === 403) {
                        throw new Error('Your session has expired. Please log in again.');
                    }
                    if (!response.ok) throw new Error('Failed to load services.');

                    const services = (await response.json()).filter(s => s.is_available);
                    if (services.length === 0) {
                        showServiceMessage('No services are available right now.');
                        return;
                    }
                    serviceGrid.replaceChildren(...services.map(buildServiceCard));
                } catch (error) {
                    console.error('Service load error:', error);
                    showServiceMessage(error.message || 'Could not load services.');
                }
            }

            // One delegated listener, since the cards are created after page load.
            serviceGrid.addEventListener('click', (e) => {
                const card = e.target.closest('[data-service]');
                if (!card) return;

                serviceGrid.querySelectorAll('[data-service]').forEach(c => c.classList.remove('bg-[#D7E3A5]'));
                card.classList.add('bg-[#D7E3A5]');

                selectedServiceLabel = card.dataset.service;
                selectedPriceValue = card.dataset.price;

                document.getElementById('selected-service').value = selectedServiceLabel;
                document.getElementById('selected-service-id').value = card.dataset.serviceId;
                document.getElementById('selected-price').value = selectedPriceValue;
            });

            // Note: Your calendar script handles setting selectedDateValue and updating
            // document.getElementById('selected-date').value = selectedDateValue;

            // 3. Modal & Form Submission Workflow
            const bookingForm = document.getElementById('booking-form');
            const receiptModal = document.getElementById('receipt-modal');
            const closeModalBtn = document.getElementById('close-modal');
            const receiptContent = document.getElementById('receipt-content');
            const payOnlineBtn = document.getElementById('pay-online-btn');
            const payCashBtn = document.getElementById('pay-cash-btn');
            const qrContainer = document.getElementById('qr-container');

            // Change this if your backend uses a different API base URL.
            const API_BASE_URL = window.BACKEND_API_BASE_URL || '';

            loadServices();

            bookingForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const dateVal = document.getElementById('selected-date').value;
                const timeVal = document.getElementById('selected-time').value;
                const serviceVal = document.getElementById('selected-service').value;
                const serviceIdVal = document.getElementById('selected-service-id').value;
                const noteVal = document.getElementById('PNote').value.trim();

                if (!dateVal || !timeVal || !serviceVal || !serviceIdVal) {
                    alert('Please select a date, time slot, and service.');
                    return;
                }

                // The price shown here is for the frontend receipt only.
                // The backend should retrieve the real price from the database using service_id.
                receiptContent.innerHTML = `
                    <p><strong>Service:</strong> ${escapeHtml(selectedServiceLabel)}</p>
                    <p><strong>Date:</strong> ${escapeHtml(dateVal)}</p>
                    <p><strong>Time:</strong> ${escapeHtml(timeVal)}</p>
                    <p><strong>Price:</strong> ₱${Number(selectedPriceValue).toLocaleString()}</p>
                    <p><strong>Note:</strong> ${escapeHtml(noteVal || 'None')}</p>
                `;

                receiptModal.classList.remove('hidden');
            });

            closeModalBtn.addEventListener('click', () => {
                receiptModal.classList.add('hidden');
                qrContainer.classList.add('hidden');
            });

            payOnlineBtn.addEventListener('click', () => {
                selectedPaymentMethod = 'online';
                qrContainer.classList.remove('hidden');
                submitBookingToDatabase('online');
            });

            payCashBtn.addEventListener('click', () => {
                selectedPaymentMethod = 'cash';
                qrContainer.classList.add('hidden');
                submitBookingToDatabase('cash');
            });

            async function submitBookingToDatabase(method) {
                const token = localStorage.getItem('userToken');

                const payload = {
                    appointment_date: document.getElementById('selected-date').value,
                    time_slot: document.getElementById('selected-time').value,
                    service_id: Number(document.getElementById('selected-service-id').value),
                    patient_note: document.getElementById('PNote').value.trim(),
                    payment_method: method
                };

                // The backend should calculate the final amount from service_id.
                // selectedPriceValue is intentionally not used as the source of truth.

                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    };

                    // Add authentication only when a token exists.
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }

                    const response = await fetch(`${API_BASE_URL}/api/appointments`, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(payload)
                    });

                    const contentType = response.headers.get('content-type') || '';
                    const result = contentType.includes('application/json')
                        ? await response.json()
                        : { message: await response.text() };

                    if (!response.ok) {
                        throw new Error(result.error || result.message || 'Failed to save appointment.');
                    }

                    alert(result.message || 'Booking successfully recorded!');

                    receiptModal.classList.add('hidden');
                    window.location.reload();

                } catch (error) {
                    console.error('Booking API Error:', error);
                    alert('Error saving booking: ' + error.message);
                }
            }

            // Prevent user-entered notes from being interpreted as HTML in the receipt.
            function escapeHtml(value) {
                const div = document.createElement('div');
                div.textContent = value;
                return div.innerHTML;
            }
        });
    </script>
    <!--
        BACKEND INTEGRATION:
        POST /api/appointments
        JSON fields:
        - appointment_date
        - time_slot
        - service_id
        - patient_note
        - payment_method

        The backend should authenticate the user, validate the appointment,
        check slot availability, retrieve the service price from the database,
        and save the appointment. Do not trust a frontend price as the final amount.
    -->
    <script src="../Taskbar/Customer_Sidebar.js"></script>
</head>
<body class="bg-[#F3EFE4] min-h-screen font-poppins text-[#2c3e2b] antialiased">
<div class="min-h-screen flex flex-col md:flex-row w-full"> <!--Div for whole body-->
    <div id="sidebar-placeholder"></div>
    <script>
        function syncContentOffset() {
            const placeholder = document.getElementById('sidebar-placeholder');
            const sidebar = Array.from(placeholder.children)
                .find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
            if (!sidebar) return;

            const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

            const apply = () => {
                const desktop = window.innerWidth >= 768;
                set(placeholder, 'flexShrink', '0');
                set(sidebar, 'position', desktop ? 'sticky' : 'relative');
                set(sidebar, 'top', desktop ? '0px' : 'auto');
                set(sidebar, 'height', desktop ? '100vh' : '');
                set(sidebar, 'overflowY', desktop ? 'auto' : '');
            };

            window.addEventListener('resize', apply);
            apply();
        }
        (async () => {
            try {
                const response = await fetch('/Taskbar/Customer_Task.html');
                if (response.ok) {
                    const data = await response.text();
                    document.getElementById('sidebar-placeholder').innerHTML = data;
                    const currentPage = window.location.pathname.split("/").pop();
                    document.querySelectorAll('.nav-link').forEach(link => {
                        if (link.getAttribute('data-page') === currentPage) {
                            link.classList.add('bg-[#FDFCE9]');
                        }
                    });
                    if (typeof initSidebar === 'function') {
                        initSidebar();
                    }
                    syncContentOffset();
                }
            } catch (error) {
                console.log('Sidebar fallback:', error);
            }
        })();

    </script>
    <!-- Main Content Area Wrapper -->
    <!-- Right column: header on top, form below -->
    <div id="main-content" class="flex-1 min-w-0 flex flex-col">

        <!-- Header (same as the Profile page) -->
        <div class="flex justify-between items-start pt-5 pl-12 pr-4 md:pl-24 md:pr-8">
            <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] pt-5 font-bold text-[#2A1001] font-['Poppins']">
                Booking
            </h1>
            <img
                    src="../assets/logowithtitle.png"
                    class="w-20 sm:w-24 md:w-28 h-auto object-contain shrink-0"
                    alt="Logo"/>
        </div>
        <hr class="border-t border-[#2A1001] mt-2 mb-6" />


        <div class="p-4 sm:p-6 md:p-10 flex justify-center items-start">
            <form id="booking-form" method="post" class="w-full max-w-4xl flex flex-col items-center gap-8">

                <!-- Hidden Database Fields -->
                <input type="hidden" id="selected-date" name="appointment_date" required>
                <input type="hidden" id="selected-time" name="time_slot" required>
                <input type="hidden" id="selected-service" name="service_name" required>
                <input type="hidden" id="selected-service-id" name="service_id" required>
                <input type="hidden" id="selected-price" name="service_price" required>

                <div class="w-full flex flex-wrap justify-center items-start gap-12">

                    <div>
                        <!--Calendar-->
                        <div class="w-full max-w-[410px]">
                            <div class="flex flex-col w-full min-h-[360px] rounded-3xl border-[2px] border-black bg-white overflow-hidden">

                                <!--Header-->
                                <div class="flex justify-between items-center p-[10px] w-full h-15 bg-[#667733]">

                                    <!--Left Button-->
                                    <div class="cursor-pointer text-[25px] bold text-[#FDFCE9]" id="prev"><i class="fa-solid fa-arrow-left"></i></div>

                                    <!--Month-Year-->
                                    <div id="month-year" class="text-[25px] bold text-[#FDFCE9]"></div>

                                    <!--Right Button-->
                                    <div class="cursor-pointer text-[25px] bold text-[#FDFCE9]" id="next"><i class="fa-solid fa-arrow-right"></i></div>
                                </div>

                                <!--Days-->
                                <div class="grid grid-cols-7 gap-3 px-4 py-2">
                                    <div>Sun</div>
                                    <div>Mon</div>
                                    <div>Tue</div>
                                    <div>Wed</div>
                                    <div>Thu</div>
                                    <div>Fri</div>
                                    <div>Sat</div>
                                </div>
                                <div class="grid grid-cols-7 gap-3 px-4 py-1" id="days"></div>
                            </div>
                        </div>
                    </div>
                    <!--AM and PM Time slot side by side-->
                    <div class="w-full sm:w-auto flex flex-row gap-3 sm:gap-5">
                        <!--AM Time slot-->
                        <div class="flex flex-col flex-1 min-w-0 sm:flex-none sm:w-[180px] gap-3">
                            <h1 class="font-extrabold text-[#2A1001]">AM-Time</h1>
                            <div data-time="07:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>7AM - 8AM</h2>
                            </div>
                            <div data-time="08:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>8AM - 9AM</h2>
                            </div>
                            <div data-time="09:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>9AM - 10AM</h2>
                            </div>
                            <div data-time="10:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>10AM - 11AM</h2>
                            </div>
                            <div data-time="11:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>11AM - 12PM</h2>
                            </div>
                        </div>

                        <!--PM Time slot-->
                        <div class="flex flex-col flex-1 min-w-0 sm:flex-none sm:w-[180px] gap-3">
                            <h1 class="font-extrabold text-[#2A1001]">PM-Time</h1>
                            <div data-time="12:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>12PM - 1PM</h2>
                            </div>
                            <div data-time="13:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>1PM - 2PM</h2>
                            </div>
                            <div data-time="14:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>2PM - 3PM</h2>
                            </div>
                            <div data-time="15:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>3PM - 4PM</h2>
                            </div>
                            <div data-time="16:00:00" class="flex w-full h-[60px] bg-white rounded-3xl border-[2px] border-black items-center justify-center text-center hover:bg-[#D7E3A5] transition-all duration-250 hover:scale-[1.035] cursor-pointer">
                                <h2>4PM - 5PM</h2>
                            </div>
                        </div>
                    </div>
                </div> <!---->

                <div class="w-full flex flex-col items-start">
                    <h1 class="font-extrabold text-xl text-[#2A1001]">What do you need?</h1>
                </div>

                <div id="service-grid" class="grid text-[#2A1001] grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-5 w-full justify-items-center"> <!--Services are rendered here from /api/services-->
                </div>
                <!--Note For Users-->
                <textarea id="PNote" name="PNote" class="w-full h-[225px] rounded bg-[#FFFFFF] text-[#2c3e2b] font-medium text-lg outline-none resize-none shadow-inner border-2 border-[#000000] p-4" maxlength="1000"></textarea>
                <div class="Counter-Cont">
                    <span id="current-count">0</span>/<span id="max-count">1000</span> characters
                </div>

                <button type="submit" id="submit-btn" class="z-10 bg-[#D5C04D] hover:bg-[#B8A957] text-[#2A1001] font-black text-xl px-12 py-3 rounded-full shadow-md active:scale-95 transition transform">
                    Submit Booking
                </button>

                <!-- Receipt Modal -->
                <div id="receipt-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-4">
                    <div class="bg-white rounded-3xl border-4 border-black w-full max-w-md p-6 flex flex-col gap-4 relative shadow-2xl">
                        <!-- Close Button -->
                        <button type="button" id="close-modal" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center font-bold text-lg bg-gray-100 rounded-full border-2 border-black cursor-pointer hover:bg-gray-200">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <h1 class="font-extrabold text-2xl text-[#2c3e2b]">Booking Receipt</h1>

                        <!-- Receipt Content -->
                        <div id="receipt-content" class="text-[#2c3e2b] flex flex-col gap-2 border-2 border-black p-4 rounded-xl bg-[#FDFCE9]">
                        </div>

                        <!-- Pay Options -->
                        <div class="flex gap-3 mt-2">
                            <button type="button" id="pay-online-btn" class="flex-1 py-3 bg-[#667733] text-[#D7E3A5] font-bold rounded-xl border-2 border-black cursor-pointer hover:opacity-90 transition-all">
                                Pay Online
                            </button>
                            <button type="button" id="pay-cash-btn" class="flex-1 py-3 bg-white text-[#2c3e2b] font-bold rounded-xl border-2 border-black cursor-pointer hover:bg-gray-100 transition-all">
                                Pay Cash
                            </button>
                        </div>

                        <!--QR Code-->
                        <div id="qr-container" class="hidden flex flex-col items-center gap-2 mt-2 p-4 bg-white rounded-xl border-2 border-dashed border-black">
                            <p class="font-bold text-sm text-[#2c3e2b]">Scan QR Code to Pay</p>
                            <div class="w-36 h-36 bg-gray-100 border-2 border-black flex items-center justify-center rounded-lg">
                                <img src="../assets/QRTest.png">
                            </div>
                        </div>

                    </div>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
