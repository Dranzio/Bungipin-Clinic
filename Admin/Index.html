<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../output.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="../Taskbar/Admin_Sidebar.js"></script>
</head>
<body class="bg-[#F3EFE4] min-h-screen font-sans text-[#2c3e2b] antialiased">

    <div class="min-h-screen flex flex-col md:flex-row w-full">

        <!-- Sidebar Container -->
        <aside id="sidebar-aside" class="w-full md:w-auto shrink-0 bg-[#A2AC89]">
            <div id="sidebar-placeholder"></div>

            <script>
                fetch('../Taskbar/Admin_Task.html')
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('sidebar-placeholder').innerHTML = data;

                        const currentPage = window.location.pathname.split("/").pop();
                        document.querySelectorAll('.nav-link').forEach(link => {
                            if (link.getAttribute('data-page') === currentPage) {
                                link.classList.add('bg-[#FDFCE9]');
                            }
                        });

                        initSidebar();
                    });
            </script>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 md:p-10 flex flex-col items-center">
            <div class="w-full max-w-[1100px]">
                <header class="flex items-center justify-between mb-8">
                    <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-[#1a281b] tracking-tight">Admin Dashboard</h1>
                </header>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

                    <!--Patient Chart-->
                    <div class="lg:col-span-2 bg-white border-2 border-[#1A1008] rounded-2xl p-4 h-[400px]">
                        <div class="flex items-center justify-between mb-3">
                            <h2 class="font-bold text-[#1A1008]">
                                Total Numbers of Patients Review
                            </h2>

                            <div class="flex gap-2">
                                <button id="numweeklyBtn" class="px-5 py-2 rounded-lg bg-[#88925F] text-white">
                                    Weekly
                                </button>

                                <button id="nummonthlyBtn" class="px-5 py-2 rounded-lg bg-gray-200 text-[#2A1001]">
                                    Monthly
                                </button>

                                <button id="numyearlyBtn" class="px-5 py-2 rounded-lg bg-gray-200 text-[#2A1001]">
                                    Yearly
                                </button>
                            </div>
                        </div>

                        <div class="w-full h-[320px]">
                            <canvas id="NumPatRev"></canvas>
                        </div>

                    </div>

                    <!--Appointment Card-->
                    <div class="bg-white border-2 border-[#1A1008] rounded-2xl p-5 h-[310px]">

                        <h2 class="font-bold text-[#2A1001] mb-2">
                            Patients showing up in appointments
                        </h2>

                        <div class="w-full h-[200px]">
                            <canvas id="appointmentChart"></canvas>
                        </div>

                    </div>

                    <!--Appointment Card-->
                    <div class="bg-white border-2 border-[#1A1008] rounded-2xl p-5 h-[310px]">

                        <h2 class="font-bold text-[#2A1001] mb-2">
                            Most Requested Services
                        </h2>

                        <div class="w-full h-[200px]">
                            <canvas id="servChart"></canvas>
                        </div>

                    </div>

                    <!--Patient Chart-->
                    <div class="lg:col-span-2 bg-white border-2 border-[#1A1008] rounded-2xl p-4 h-[400px]">
                        <div class="flex items-center justify-between mb-3">
                            <h2 class="font-bold text-[#1A1008]">
                                Total Number of Transaction
                            </h2>

                            <div class="flex gap-2">
                                <button id="transweeklyBtn" class="px-5 py-2 rounded-lg bg-[#88925F] text-white">
                                    Weekly
                                </button>

                                <button id="transmonthlyBtn" class="px-5 py-2 rounded-lg bg-gray-200 text-[#2A1001]">
                                    Monthly
                                </button>

                                <button id="transyearlyBtn" class="px-5 py-2 rounded-lg bg-gray-200 text-[#2A1001]">
                                    Yearly
                                </button>
                            </div>
                        </div>

                        <div class="w-full h-[320px]">
                            <canvas id="TransactionRep"></canvas>
                        </div>

                    </div>
                    <div class="dashboard-controls" style="margin: 20px;">
                        <button onclick="GenPDF()" style="padding: 10px 20px; font-weight: bold; cursor: pointer;">
                            📥 Download PDF Report
                        </button>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <script>
        //WAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        //Num Patients Data
        const weeklyData = {
            labels: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Staurday", "Sunday"],
            
            //WAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            //Insert Weekly Data here
            data: [25, 30, 54, 67, 44, 23, 10]
        }
        
        const monthlyData = {
            labels: ["Week 1", "Week 2", "Week 3", "Week 4", "Week 5"],

            //WAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            //Insert MonthlyData here
            data: [250, 300, 450, 120, 90]
        }

        const yearlyData = {
            labels: ["2022", "2023", "2024", "2025", "2026",],
            
            //WAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            //Insert Yearly Data Here
            data: [500, 600, 250, 350, 2030]
        }


        //WAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        //Transaction Data
        const weektransData = {
            labels: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],

            data: [55000, 45000, 36000, 120000, 10, 2000, 3000]
        }
        const monthtransData = {
            labels: ["Week-1", "Week-2", "Week-3", "Week-4", "Week-5"],

            data: [550000, 4500, 3600, 9000, 1000]
        }
        const yeartransData = {
            labels: ["2022", "2023", "2024", "2025", "2026"],

            data: [55000, 45000, 36000, 120000, 10]
        }

        const appointmentData = {
            labels: [
                'Patients showed up',
                'Patients did not attend'
            ],
            data: [65.6, 34.5]
        }

        const serviceData = {
            labels: [
                'Cleaning',
                'Pasta',
                'Whitening',
                'Checkup'
            ],
            data: [32, 28, 15, 5]
        }

        const NumPatients = document.getElementById('NumPatRev'); //Number of patients chart
        const appointChart = document.getElementById('appointmentChart'); //Appointment chart
        const servChart = document.getElementById('servChart'); //Most Requested Service chart
        const TransactionRep = document.getElementById('TransactionRep'); //Transaction Report chart

        const numweeklyBtn = document.getElementById('numweeklyBtn');
        const nummonthlyBtn = document.getElementById('nummonthlyBtn');
        const numyearlyBtn = document.getElementById('numyearlyBtn');

        const transweeklyBtn = document.getElementById('transweeklyBtn');
        const transmonthlyBtn = document.getElementById('transmonthlyBtn');
        const transyearlyBtn = document.getElementById('transyearlyBtn');


        let NumPaColoRate = weeklyData.data.map(value => {
            if (value <= 10) {
                return '#FA8D8D';
            } else if (value <= 20) {
                return '#D5C04D';
            } else if (value <= 40) {
                return '#D3D078';
            } else {
                return '#88925F';
            }
        });

        const NumPatRev = new Chart(NumPatients, {
            type: 'bar',
            data: {
                labels: weeklyData.labels,
                datasets: [{
                    label: 'Number of users',
                    data: weeklyData.data,
                    backgroundColor: NumPaColoRate,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });

        const appointmentChart = new Chart(appointChart, {
            type: 'pie',
            data: {
                labels: appointmentData.labels,

                datasets: [{
                    data: appointmentData.data,
                    backgroundColor: [
                        '#D7E3A5',
                        '#FA8D8D'
                    ],
                    borderColor: '#2A1001',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugin: {
                    legend: {
                        position: 'right'
                    }
                }
            }
        })

        const serviceChart = new Chart(servChart, {
            type: 'pie',
            data: {
                labels: serviceData.labels,

                datasets: [{
                    data: serviceData.data,
                    backgroundColor: [
                        '#D7E3A5',
                        '#FA8D8D',
                        '#D5C04D',
                        '#A2AC89'
                    ],
                    borderColor: '#2A1001',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugin: {
                    legend: {
                        position: 'right'
                    }
                }
            }
        })

        const TransactionChart = new Chart(TransactionRep, {
            type: 'line',
            data:  {
                labels: weektransData.labels,
                datasets: [{
                    label: 'Money',
                    data: weektransData.data,
                    borderColor: '#88925F'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        })

        numweeklyBtn.addEventListener('click', function () {
            NumPatRev.data.labels = weeklyData.labels;
            NumPatRev.data.datasets[0].data = weeklyData.data;

            NumPatRev.update();

            numweeklyBtn.classList.remove('bg-gray-200', 'text-[#2A1001]');
            numweeklyBtn.classList.add('bg-[#88925F]', 'text-white');

            nummonthlyBtn.classList.remove('bg-[#88925F]', 'text-white');
            nummonthlyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');

            numyearlyBtn.classList.remove('bg-[#88925F]', 'text-white');
            numyearlyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');
        })

        nummonthlyBtn.addEventListener('click', function () {
            NumPatRev.data.labels = monthlyData.labels;
            NumPatRev.data.datasets[0].data = monthlyData.data;
            NumPatRev.update();

            numweeklyBtn.classList.remove('bg-[#88925F]', 'text-white');
            numweeklyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');

            nummonthlyBtn.classList.remove('bg-gray-200', 'text-[#2A1001]');
            nummonthlyBtn.classList.add('bg-[#88925F]', 'text-white');

            numyearlyBtn.classList.remove('bg-[#88925F]', 'text-white');
            numyearlyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');
        })

        numyearlyBtn.addEventListener('click', function () {
            NumPatRev.data.labels = yearlyData.labels;
            NumPatRev.data.datasets[0].data = yearlyData.data;
            NumPatRev.update();

            numweeklyBtn.classList.remove('bg-[#88925F]', 'text-white');
            numweeklyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');

            nummonthlyBtn.classList.remove('bg-[#88925F]', 'text-white');
            nummonthlyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');

            numyearlyBtn.classList.remove('bg-gray-200', 'text-[#2A1001]');
            numyearlyBtn.classList.add('bg-[#88925F]', 'text-white');
        })



        

        transweeklyBtn.addEventListener('click', function () {
            TransactionChart.data.labels = weektransData.labels;
            TransactionChart.data.datasets[0].data = weektransData.data;
            TransactionChart.update();

            transweeklyBtn.classList.remove('bg-gray-200', 'text-[#2A1001]');
            transweeklyBtn.classList.add('bg-[#88925F]', 'text-white');

            transmonthlyBtn.classList.remove('bg-[#88925F]', 'text-white');
            transmonthlyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');

            transyearlyBtn.classList.remove('bg-[#88925F]', 'text-white');
            transyearlyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');
        })

        transmonthlyBtn.addEventListener('click', function () {
            TransactionChart.data.labels = monthtransData.labels;
            TransactionChart.data.datasets[0].data = monthtransData.data;
            TransactionChart.update();

            transweeklyBtn.classList.remove('bg-[#88925F]', 'text-white');
            transweeklyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');

            transmonthlyBtn.classList.remove('bg-gray-200', 'text-[#2A1001]');
            transmonthlyBtn.classList.add('bg-[#88925F]', 'text-white');

            transyearlyBtn.classList.remove('bg-[#88925F]', 'text-white');
            transyearlyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');
        })

        transyearlyBtn.addEventListener('click', function () {
            TransactionChart.data.labels = yeartransData.labels;
            TransactionChart.data.datasets[0].data = yeartransData.data;
            TransactionChart.update();

            transweeklyBtn.classList.remove('bg-[#88925F]', 'text-white');
            transweeklyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');

            transmonthlyBtn.classList.remove('bg-[#88925F]', 'text-white');
            transmonthlyBtn.classList.add('bg-gray-200', 'text-[#2A1001]');

            transyearlyBtn.classList.remove('bg-gray-200', 'text-[#2A1001]');
            transyearlyBtn.classList.add('bg-[#88925F]', 'text-white');
        })
        
        function GenPDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');

            const pageWidth = 210;
            const pageHeight = 297;
            const margin = 14;
            const contentWidth = pageWidth - (margin * 2);
            const border = [26, 16, 8];
            const olive = [136, 146, 95];
            const grayBtn = [229, 231, 235];
            const titleColor = [26, 16, 8];

            pdf.setFillColor(250, 248, 244);
            pdf.rect(0, 0, pageWidth, pageHeight, 'F');

            function drawCard(x, y, w, h) {
                pdf.setFillColor(255, 255, 255);
                pdf.setDrawColor(border[0], border[1], border[2]);
                pdf.setLineWidth(0.4);
                pdf.roundedRect(x, y, w, h, 4, 4, 'FD');
            }

            function isActive(btn) {
                return btn && btn.classList.contains('bg-[#88925F]');
            }

            function drawPills(rightEdge, y, weeklyBtn, monthlyBtn, yearlyBtn) {
                const labels = ['Weekly', 'Monthly', 'Yearly'];
                const buttons = [weeklyBtn, monthlyBtn, yearlyBtn];
                const pillW = 16;
                const pillH = 6;
                const gap = 1.5;
                let x = rightEdge - (3 * pillW + 2 * gap);

                buttons.forEach(function (btn, i) {
                    if (isActive(btn)) {
                        pdf.setFillColor(olive[0], olive[1], olive[2]);
                        pdf.setTextColor(255, 255, 255);
                    } else {
                        pdf.setFillColor(grayBtn[0], grayBtn[1], grayBtn[2]);
                        pdf.setTextColor(42, 16, 1);
                    }

                    pdf.roundedRect(x, y, pillW, pillH, 1.8, 1.8, 'F');
                    pdf.setFont('helvetica', 'bold');
                    pdf.setFontSize(6);
                    pdf.text(labels[i], x + pillW / 2, y + 4.1, { align: 'center' });
                    x += pillW + gap;
                });

                pdf.setTextColor(titleColor[0], titleColor[1], titleColor[2]);
            }

            function addChartImage(chart, x, y, w, h) {
                const image = chart.toBase64Image('image/png', 1);
                pdf.addImage(image, 'PNG', x, y, w, h);
            }

            pdf.setTextColor(0, 0, 0);
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(26);
            pdf.text('Dashboard Report', pageWidth / 2, 22, { align: 'center' });

            const patientsY = 30;
            const patientsH = 78;
            drawCard(margin, patientsY, contentWidth, patientsH);
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(9);
            pdf.setTextColor(titleColor[0], titleColor[1], titleColor[2]);
            pdf.text('Total Numbers of Patients Review', margin + 6, patientsY + 9);
            drawPills(margin + contentWidth - 6, patientsY + 4.2, numweeklyBtn, nummonthlyBtn, numyearlyBtn);
            addChartImage(NumPatRev, margin + 5, patientsY + 14, contentWidth - 10, patientsH - 18);

            const pieGap = 6;
            const pieY = 114;
            const pieH = 68;
            const pieW = (contentWidth - pieGap) / 2;

            drawCard(margin, pieY, pieW, pieH);
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(9);
            pdf.setTextColor(titleColor[0], titleColor[1], titleColor[2]);
            pdf.text('Patients showing up in appointments', margin + 5, pieY + 8);
            addChartImage(appointmentChart, margin + 4, pieY + 11, pieW - 8, pieH - 16);

            const servicesX = margin + pieW + pieGap;
            drawCard(servicesX, pieY, pieW, pieH);
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(9);
            pdf.setTextColor(titleColor[0], titleColor[1], titleColor[2]);
            pdf.text('Most Requested Services', servicesX + 5, pieY + 8);
            addChartImage(serviceChart, servicesX + 4, pieY + 11, pieW - 8, pieH - 16);

            const transY = 188;
            const transH = 82;
            drawCard(margin, transY, contentWidth, transH);
            pdf.setFont('helvetica', 'bold');
            pdf.setFontSize(9);
            pdf.setTextColor(titleColor[0], titleColor[1], titleColor[2]);
            pdf.text('Total Number of Transaction', margin + 6, transY + 9);
            drawPills(margin + contentWidth - 6, transY + 4.2, transweeklyBtn, transmonthlyBtn, transyearlyBtn);
            addChartImage(TransactionChart, margin + 5, transY + 14, contentWidth - 10, transH - 18);

            pdf.save('Dashboard_Report.pdf');
        }
    </script>

</body>
</html>
