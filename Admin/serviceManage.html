<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- DENIED DIRECT PAGE ACCESS VIA URL -->
    <script src="../pageProtection.js"></script>
    <link href="/output.css" rel="stylesheet">
    <title>Service Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
    <script src="../Taskbar/Admin_Sidebar.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        .font-poppins { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="min-h-screen md:h-screen md:overflow-hidden bg-[#F3EFE4] relative flex flex-col md:flex-row antialiased font-poppins text-[#2A1001]">

<!-- SIDEBAR -->
<div id="sidebar-placeholder"></div>
<script>
    function syncContentOffset() {
        const placeholder = document.getElementById('sidebar-placeholder');
        const sidebar = Array.from(placeholder.children)
            .find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
        if (!sidebar) return;

        const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

        const apply = () => {
            const desktop = window.innerWidth >= 768;
            set(placeholder, 'flexShrink', '0');
            set(sidebar, 'position', desktop ? 'sticky' : 'relative');
            set(sidebar, 'top', desktop ? '0px' : 'auto');
            set(sidebar, 'height', desktop ? '100vh' : '');
            set(sidebar, 'overflowY', desktop ? 'auto' : '');
        };

        window.addEventListener('resize', apply);
        apply();
    }

    (async () => {
        try {
            const response = await fetch('/Taskbar/Admin_Task.html');
            if (response.ok) {
                const data = await response.text();
                document.getElementById('sidebar-placeholder').innerHTML = data;
                const currentPage = window.location.pathname.split("/").pop();
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.getAttribute('data-page') === currentPage) {
                        link.classList.add('bg-[#FDFCE9]');
                    }
                });
                if (typeof initSidebar === 'function') {
                    initSidebar();
                }
                syncContentOffset();
            }
        } catch (error) {
            console.log('Sidebar fallback:', error);
        }
    })();
</script>

<div id="main-content" class="flex-1 min-w-0 md:min-h-0 md:overflow-y-auto">

    <!-- Header with logo -->
    <div class="flex justify-between items-start pt-5 pl-6 pr-4 md:pl-24 md:pr-8">
        <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] pt-5 font-bold text-[#2A1001]">
            Service Management
        </h1>
        <img
            src="../assets/logowithtitle.png"
            class="w-20 sm:w-24 md:w-28 h-auto object-contain shrink-0"
            alt="Logo"/>
    </div>
    <hr class="border-t border-[#2A1001] mt-2 mb-6" />

    <div class="px-6 md:px-16">

        <div class="flex justify-between items-center mb-6">
            <p class="text-sm font-bold text-[#2A1001]/70">Configure clinic treatment catalog, service duration & pricing</p>
            <button id="addServiceBtn" class="bg-[#D5C04D] hover:bg-[#c2ad3c] transition text-[#2A1001] font-bold px-6 py-2.5 rounded-full shadow-sm flex items-center gap-2 shrink-0 whitespace-nowrap cursor-pointer active:scale-95">
                <i class="fa-solid fa-plus shrink-0"></i> Add New Service
            </button>
        </div>

        <div id="serviceGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-10">
            <!-- cards injected dynamically by JS -->
        </div>

    </div>
</div>

<!-- ================= SERVICE MODAL ================= -->
<div id="serviceModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md p-7 sm:p-8 relative shadow-2xl border border-black/10 max-h-[92vh] overflow-y-auto">

        <!-- Close Button -->
        <button id="closeServiceModal" type="button" class="absolute top-4 right-5 text-2xl font-bold text-[#2A1001]/60 hover:text-[#2A1001] cursor-pointer">&times;</button>

        <h2 id="modalHeading" class="text-lg font-bold text-[#2A1001] uppercase tracking-wider text-center mb-6">Service Details</h2>

        <div class="flex flex-col items-center gap-4">

            <!-- Service Icon -->
            <div class="relative w-28 h-28 group">
                <img id="serviceIconPreview" src="" class="w-full h-full object-contain hidden" alt="Service Icon" />

                <div id="iconPlaceholder" class="w-full h-full flex items-center justify-center border-2 border-dashed border-gray-300 rounded-2xl bg-gray-50">
                    <span class="text-xs text-gray-400 text-center px-3 font-semibold">Service Icon</span>
                </div>

                <!-- Upload Overlay Button -->
                <button id="editIconBtn" type="button" class="hidden absolute -bottom-1.5 -right-1.5 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md border border-gray-200 hover:bg-gray-50 transition z-10 cursor-pointer" title="Change icon">
                    <i class="fa-solid fa-camera text-xs text-[#2A1001]/80"></i>
                </button>
                <input type="file" id="serviceIconInput" accept="image/png, image/jpeg, image/webp" class="hidden" />
            </div>

            <!-- Service Name -->
            <div class="w-full">
                <label class="block text-xs font-bold text-[#2A1001] uppercase mb-1">Service Name</label>
                <input id="serviceNameInput" type="text" maxlength="80" readonly class="w-full px-4 py-2.5 rounded-full border border-[#2A1001]/20 outline-none bg-[#dedede] text-[#2c3e2b]/70 font-semibold text-sm transition cursor-not-allowed shadow-inner" placeholder="e.g. Tooth Extraction (Wisdom)" />
            </div>

            <!-- Assigned Dentist Specialization -->
            <div class="w-full">
                <label class="block text-xs font-bold text-[#2A1001] uppercase mb-1">Assigned Specialization</label>
                <select id="serviceSpecializationInput" disabled class="w-full px-4 py-2.5 rounded-full border border-[#2A1001]/20 outline-none bg-[#dedede] text-[#2c3e2b]/70 font-semibold text-sm transition cursor-not-allowed shadow-inner">
                    <option value="General Dentist">General Dentist</option>
                    <option value="Pediatric Dentist">Pediatric Dentist</option>
                    <option value="Orthodontist">Orthodontist</option>
                    <option value="Endodontist">Endodontist</option>
                    <option value="Oral Surgeon">Oral Surgeon</option>
                    <option value="Periodontist">Periodontist</option>
                    <option value="Prosthodontist">Prosthodontist</option>
                    <option value="Oral Pathologist">Oral Pathologist</option>
                    <option value="Oral Radiologist">Oral Radiologist</option>
                </select>
            </div>

            <!-- Estimated Duration -->
            <div class="w-full">
                <label class="block text-xs font-bold text-[#2A1001] uppercase mb-1">Estimated Duration (minutes)</label>
                <input id="serviceDurationInput" type="number" min="5" max="480" step="5" readonly class="w-full px-4 py-2.5 rounded-full border border-[#2A1001]/20 outline-none bg-[#dedede] text-[#2c3e2b]/70 font-semibold text-sm transition cursor-not-allowed shadow-inner" placeholder="30" />
            </div>

            <!-- Price Input with Perfect Center Alignment -->
            <div class="w-full">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-bold text-[#2A1001] uppercase">Service Price (PHP)</label>
                    <span class="text-[11px] font-semibold text-gray-500">Max: ₱1,500,000</span>
                </div>
                <div id="servicePriceContainer" class="w-full px-4 py-2.5 rounded-full border border-[#2A1001]/20 bg-[#dedede] flex items-center gap-1.5 shadow-inner transition cursor-not-allowed">
                    <span id="servicePriceSymbol" class="font-bold text-sm text-[#2c3e2b]/70 select-none leading-none">₱</span>
                    <input id="servicePriceInput" type="text" inputmode="decimal" maxlength="10" readonly class="w-full bg-transparent border-0 outline-none p-0 text-[#2c3e2b]/70 font-semibold text-sm cursor-not-allowed placeholder:text-gray-400 leading-none" placeholder="1500" />
                </div>
            </div>

            <!-- VIEW MODE BUTTON -->
            <div id="viewActionsContainer" class="w-full pt-3">
                <button type="button" id="startEditBtn" class="w-full bg-[#667733] hover:bg-[#556022] transition text-white font-bold py-3 rounded-full shadow-md flex items-center justify-center gap-2 cursor-pointer active:scale-95 text-sm sm:text-base">
                    <i class="fa-solid fa-pen-to-square"></i> Edit Service
                </button>
            </div>

            <!-- EDIT MODE BUTTONS (Save & Cancel) -->
            <div id="editActionsContainer" class="w-full hidden flex items-center gap-3 pt-3">
                <button type="button" id="cancelEditBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 transition text-[#2A1001] font-bold py-2.5 rounded-full shadow-sm cursor-pointer active:scale-95 text-sm">
                    Cancel
                </button>
                <button type="button" id="saveServiceBtn" class="flex-1 bg-[#D5C04D] hover:bg-[#c2ad3c] transition text-[#2A1001] font-bold py-2.5 rounded-full shadow-md cursor-pointer active:scale-95 text-sm flex items-center justify-center gap-2">
                    Save Changes
                </button>
            </div>

        </div>
    </div>
</div>

<!-- ================= DELETE MODAL ================= -->

    <div class="bg-white rounded-3xl w-full max-w-sm p-8 text-center border border-black/10 shadow-2xl">
        <div class="w-14 h-14 mx-auto mb-3.5 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-2xl">

        </div>

<!-- ================= APP ALERT MODAL ================= -->
<div id="appAlertModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-7 text-center shadow-2xl border border-black/10 relative transition-all">
        <div id="alertModalIconContainer" class="w-14 h-14 mx-auto mb-3.5 rounded-full flex items-center justify-center">
            <i id="alertModalIcon" class="text-2xl"></i>
        </div>
        <h3 id="alertModalTitle" class="text-lg font-bold text-[#2A1001] mb-1.5">Notification</h3>
        <div id="alertModalMessage" class="text-xs sm:text-sm text-[#2A1001]/75 leading-relaxed mb-6 font-medium whitespace-pre-line"></div>
        <div class="flex justify-center">
            <button id="alertModalOkBtn" type="button" class="px-8 py-2.5 rounded-full font-bold text-sm bg-[#667733] hover:bg-[#556022] text-white transition shadow-md cursor-pointer">
                Got it
            </button>
        </div>
    </div>
</div>

<script>
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function safeIconSrc(icon, fallback) {
        if (typeof icon === 'string') {
            const trimmed = icon.trim();
            if (/^(\.\.\/assets\/|\/uploads\/services\/|\/assets\/|[a-zA-Z0-9_\-\/]+\.(png|jpg|jpeg|webp|svg))$/i.test(trimmed)) {
                return encodeURI(trimmed);
            }
            if (/^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/i.test(trimmed)) {
                return trimmed;
            }
        }
        return fallback;
    }

    function showAlert(title, message, type = 'info') {
        const modal = document.getElementById('appAlertModal');
        const titleEl = document.getElementById('alertModalTitle');
        const msgEl = document.getElementById('alertModalMessage');
        const iconEl = document.getElementById('alertModalIcon');
        const iconContainer = document.getElementById('alertModalIconContainer');
        const btn = document.getElementById('alertModalOkBtn');

        titleEl.textContent = String(title || 'Notification');
        msgEl.textContent = String(message || '');

        if (type === 'error') {
            iconContainer.className = 'w-14 h-14 mx-auto mb-3.5 rounded-full flex items-center justify-center bg-red-100 text-red-600';
            iconEl.className = 'fa-solid fa-circle-exclamation text-2xl';
            btn.className = 'px-8 py-2.5 rounded-full font-bold text-sm bg-[#D9534F] hover:bg-[#c9302c] text-white transition shadow-md cursor-pointer';
        } else if (type === 'success') {
            iconContainer.className = 'w-14 h-14 mx-auto mb-3.5 rounded-full flex items-center justify-center bg-green-100 text-green-700';
            iconEl.className = 'fa-solid fa-circle-check text-2xl';
            btn.className = 'px-8 py-2.5 rounded-full font-bold text-sm bg-[#667733] hover:bg-[#556022] text-white transition shadow-md cursor-pointer';
        } else {
            iconContainer.className = 'w-14 h-14 mx-auto mb-3.5 rounded-full flex items-center justify-center bg-amber-100 text-amber-700';
            iconEl.className = 'fa-solid fa-circle-info text-2xl';
            btn.className = 'px-8 py-2.5 rounded-full font-bold text-sm bg-[#D5C04D] hover:bg-[#c2ad3c] text-[#2A1001] transition shadow-md cursor-pointer';
        }

        modal.classList.remove('hidden');
    }

    document.getElementById('alertModalOkBtn').addEventListener('click', () => {
        document.getElementById('appAlertModal').classList.add('hidden');
    });

    document.getElementById('appAlertModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.add('hidden');
    });

    function authHeaders(json = false) {
        const token = localStorage.getItem('userToken');
        const headers = { 'Authorization': `Bearer ${token}` };
        if (json) headers['Content-Type'] = 'application/json';
        return headers;
    }

    async function readError(response, fallback) {
        try {
            const body = await response.json();
            return body.message || body.error || fallback;
        } catch (_) {
            return fallback;
        }
    }

    async function getServices() {
        try {
            const response = await fetch('/api/services', { headers: authHeaders() });
            if (!response.ok) throw new Error(await readError(response, 'Failed to fetch services'));
            return await response.json();
        } catch (error) {
            console.error('Error fetching services:', error);
            return [];
        }
    }

    async function saveService(service) {
        const isEditing = !!service.service_id;
        const response = await fetch(isEditing ? `/api/services/${encodeURIComponent(service.service_id)}` : '/api/services', {
            method: isEditing ? 'PUT' : 'POST',
            headers: authHeaders(true),
            body: JSON.stringify(service)
        });
        if (!response.ok) throw new Error(await readError(response, 'Failed to save service'));
        return await response.json();
    }

    async function deleteService(id) {
        const response = await fetch(`/api/services/${encodeURIComponent(id)}`, { 
            method: 'DELETE', 
            headers: authHeaders() 
        });
        if (!response.ok) throw new Error(await readError(response, 'Failed to delete service'));
    }

    let services = [];
    let activeServiceId = null;
    let pendingDeleteId = null;
    let uploadedIconData = null;
    let isCreatingNew = false;
    let originalServiceSnapshot = null;

    const defaultIcons = {
        "Cleaning": "../assets/cleaning.png",
        "Pasta": "../assets/pasta.png",
        "Checkup": "../assets/Checkup.png",
        "Whitening": "../assets/whitening.png",
        "default": "../assets/logowithtitle.png"
    };

    function formatDuration(minutes) {
        const m = Math.max(0, parseInt(minutes, 10) || 30);
        const hrs = Math.floor(m / 60);
        const mins = m % 60;
        if (hrs > 0 && mins > 0) return `${hrs}h ${mins}m`;
        if (hrs > 0) return `${hrs} hr${hrs > 1 ? 's' : ''}`;
        return `${mins} mins`;
    }

    // ── FORM LOCKING MECHANISM ──
    function setFormLocked(locked) {
        ['serviceNameInput', 'serviceDurationInput'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            locked ? el.setAttribute('readonly', true) : el.removeAttribute('readonly');
            el.classList.toggle('bg-[#dedede]', locked);
            el.classList.toggle('bg-white', !locked);
            el.classList.toggle('text-[#2c3e2b]/70', locked);
            el.classList.toggle('text-[#2c3e2b]', !locked);
            el.classList.toggle('cursor-not-allowed', locked);
            el.classList.toggle('cursor-text', !locked);
        });

        // Price Container & Input Locking
        const priceContainer = document.getElementById('servicePriceContainer');
        const priceInput = document.getElementById('servicePriceInput');
        const priceSymbol = document.getElementById('servicePriceSymbol');
        if (priceContainer && priceInput) {
            locked ? priceInput.setAttribute('readonly', true) : priceInput.removeAttribute('readonly');
            priceContainer.classList.toggle('bg-[#dedede]', locked);
            priceContainer.classList.toggle('bg-white', !locked);
            priceContainer.classList.toggle('cursor-not-allowed', locked);
            priceContainer.classList.toggle('cursor-text', !locked);

            priceInput.classList.toggle('text-[#2c3e2b]/70', locked);
            priceInput.classList.toggle('text-[#2c3e2b]', !locked);
            priceInput.classList.toggle('cursor-not-allowed', locked);
            priceInput.classList.toggle('cursor-text', !locked);

            if (priceSymbol) {
                priceSymbol.classList.toggle('text-[#2c3e2b]/70', locked);
                priceSymbol.classList.toggle('text-[#2c3e2b]', !locked);
            }
        }

        // Specialization select
        const specInput = document.getElementById('serviceSpecializationInput');
        if (specInput) {
            specInput.disabled = locked;
            specInput.classList.toggle('bg-[#dedede]', locked);
            specInput.classList.toggle('bg-white', !locked);
            specInput.classList.toggle('cursor-not-allowed', locked);
            specInput.classList.toggle('cursor-pointer', !locked);
        }

        // Upload icon button
        document.getElementById('editIconBtn').classList.toggle('hidden', locked);

        // Bottom action bar toggle
        document.getElementById('viewActionsContainer').classList.toggle('hidden', !locked);
        document.getElementById('editActionsContainer').classList.toggle('hidden', locked);
    }

    // ── STRICT NUMERIC INPUT VALIDATION FOR PRICE WITH 1,500,000 LIMIT ──
    const priceInputEl = document.getElementById('servicePriceInput');
    if (priceInputEl) {
        // Focus input when clicking anywhere inside the pill container
        document.getElementById('servicePriceContainer')?.addEventListener('click', () => {
            if (!priceInputEl.hasAttribute('readonly')) {
                priceInputEl.focus();
            }
        });

        // Block letters (e, E), signs (+, -), and invalid symbols on keystroke
        priceInputEl.addEventListener('keydown', function (e) {
            const allowedKeys = [
                'Backspace', 'Delete', 'Tab', 'Escape', 'Enter',
                'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'
            ];
            if (allowedKeys.includes(e.key) || e.ctrlKey || e.metaKey) {
                return;
            }

            // Allow only one decimal point
            if (e.key === '.' || e.key === 'Decimal') {
                if (this.value.includes('.')) {
                    e.preventDefault();
                }
                return;
            }

            // Allow digits 0-9 only
            if (/^[0-9]$/.test(e.key)) {
                return;
            }

            // Block everything else
            e.preventDefault();
        });

        // Limit amount to 1,500,000 PHP and warn when exceeded
        priceInputEl.addEventListener('input', function () {
            let val = this.value.replace(/[^0-9.]/g, '');
            const parts = val.split('.');
            if (parts.length > 2) {
                val = parts[0] + '.' + parts.slice(1).join('');
            }
            if (val.includes('.')) {
                const [intPart, decPart] = val.split('.');
                val = intPart + '.' + decPart.slice(0, 2);
            }

            const numVal = parseFloat(val);
            if (!isNaN(numVal) && numVal > 1500000) {
                this.value = '1500000';
                showAlert('Maximum Price Limit', 'The maximum allowed service price is ₱1,500,000.', 'info');
                return;
            }

            this.value = val;
        });

        priceInputEl.addEventListener('paste', function (e) {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            const cleanText = text.replace(/[^0-9.]/g, '');
            const num = parseFloat(cleanText);
            if (!isNaN(num) && num > 1500000) {
                this.value = '1500000';
                showAlert('Maximum Price Limit', 'The maximum allowed service price is ₱1,500,000.', 'info');
                return;
            }
            if (cleanText) {
                document.execCommand('insertText', false, cleanText);
            }
        });
    }

    // Sanitize duration input (integers only)
    document.getElementById('serviceDurationInput')?.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
    });

    function populateModalData(service) {
        const nameInput = document.getElementById('serviceNameInput');
        const specInput = document.getElementById('serviceSpecializationInput');
        const priceInput = document.getElementById('servicePriceInput');
        const durationInput = document.getElementById('serviceDurationInput');
        const iconPreview = document.getElementById('serviceIconPreview');
        const iconPlaceholder = document.getElementById('iconPlaceholder');

        if (service) {
            nameInput.value = service.label || '';
            specInput.value = service.specialization || 'General Dentist';
            priceInput.value = service.price !== undefined ? Number(service.price) : '';
            durationInput.value = service.duration_minutes !== undefined ? parseInt(service.duration_minutes, 10) : 30;

            if (service.icon) {
                iconPreview.src = safeIconSrc(service.icon, defaultIcons['default']);
                iconPreview.classList.remove('hidden');
                iconPlaceholder.classList.add('hidden');
                uploadedIconData = service.icon;
            } else {
                iconPreview.classList.add('hidden');
                iconPlaceholder.classList.remove('hidden');
                uploadedIconData = null;
            }
        } else {
            nameInput.value = '';
            specInput.value = 'General Dentist';
            priceInput.value = '';
            durationInput.value = '30';
            iconPreview.classList.add('hidden');
            iconPlaceholder.classList.remove('hidden');
            uploadedIconData = null;
        }
    }

    function openServiceModal(id = null) {
        activeServiceId = id ? parseInt(id, 10) : null;
        isCreatingNew = !activeServiceId;

        const heading = document.getElementById('modalHeading');
        const saveBtn = document.getElementById('saveServiceBtn');

        if (activeServiceId) {
            heading.textContent = 'Service Details';
            saveBtn.textContent = 'Save Changes';
            const service = services.find(s => parseInt(s.service_id, 10) === activeServiceId);
            originalServiceSnapshot = { ...service };
            populateModalData(service);
            setFormLocked(true);
        } else {
            heading.textContent = 'Add New Service';
            saveBtn.textContent = 'Save Service';
            originalServiceSnapshot = null;
            populateModalData(null);
            setFormLocked(false);
        }

        document.getElementById('serviceModal').classList.remove('hidden');
    }

    async function renderServices() {
        const grid = document.getElementById('serviceGrid');
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-[#2A1001]/60 font-semibold"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading services catalog...</div>`;

        services = await getServices();

        if (!Array.isArray(services) || services.length === 0) {
            grid.innerHTML = `<p class="col-span-full text-center text-[#2A1001]/60 py-10 font-semibold">No services found.</p>`;
            return;
        }

        grid.innerHTML = services.map(s => {
            const cleanId = parseInt(s.service_id, 10);
            const iconUrl = safeIconSrc(s.icon, defaultIcons[s.label] || defaultIcons['default']);
            const durationDisplay = formatDuration(s.duration_minutes);
            const cleanPrice = Number(s.price || 0).toLocaleString();

            return `
            <div class="bg-white rounded-[30px] p-6 shadow-sm hover:shadow-md transition-all duration-300 relative flex flex-col items-center justify-between min-h-[340px] border border-black/5">
                
                <!-- Duration & Specialization Badges -->
                <div class="absolute top-4 left-4 flex flex-col gap-1 items-start">
                    <div class="bg-amber-50 border border-amber-600/30 text-amber-900 text-[10px] font-black px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm">
                        <i class="fa-regular fa-clock text-[9px]"></i> ${durationDisplay}
                    </div>
                    ${s.specialization ? `
                    <div class="bg-[#D7E3A5] border border-[#c1ccab] text-[#2c3e2b] text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm">
                        ${escapeHtml(s.specialization)}
                    </div>` : ''}
                </div>

                <!-- Context Menu -->
                <div class="absolute top-4 right-4">
                    <button class="menuBtn w-8 h-8 bg-transparent rounded-full flex items-center justify-center text-[#2A1001] hover:bg-gray-100 transition font-bold text-xl leading-none pb-2 cursor-pointer" data-id="${cleanId}">
                        ...
                    </button>
                    <div class="menuDropdown hidden absolute right-0 top-10 bg-white border border-[#2A1001]/10 rounded-xl shadow-lg z-10 w-36 overflow-hidden" data-menu-for="${cleanId}">
                        <button class="editOption w-full flex items-center gap-3 px-4 py-2.5 text-xs font-bold text-[#2A1001] hover:bg-[#F3EFE4] cursor-pointer" data-id="${cleanId}">
                            <i class="fa-solid fa-pen-to-square text-xs text-[#667733]"></i> <span class="whitespace-nowrap">Edit Service</span>
                        </button>
                        <button class="deleteOption w-full flex items-center gap-3 px-4 py-2.5 text-xs font-bold text-red-600 hover:bg-red-50 cursor-pointer" data-id="${cleanId}">
                            <i class="fa-solid fa-trash-can text-xs text-red-500"></i> <span class="whitespace-nowrap">Delete Service</span>
                        </button>
                    </div>
                </div>

                <!-- Title -->
                <h3 class="font-extrabold text-[#382414] text-lg mt-8 mb-1 w-full text-center px-4 line-clamp-2">${escapeHtml(s.label)}</h3>

                <!-- Icon -->
                <div class="flex-1 flex justify-center items-center my-2 w-24 h-24">
                    <img src="${escapeHtml(iconUrl)}" onerror="this.src='../assets/logowithtitle.png'" class="w-full h-full object-contain" alt="${escapeHtml(s.label)}" />
                </div>

                <!-- Price -->
                <div class="w-full pt-3 border-t border-[#2A1001]/10 flex justify-between items-center px-2 text-[#382414]">
                    <span class="text-xs font-bold text-gray-500 uppercase">Rate:</span>
                    <span class="font-black text-base text-[#667733]">₱${cleanPrice}</span>
                </div>
            </div>
            `;
        }).join('');
    }

    document.getElementById('serviceGrid').addEventListener('click', function (e) {
        const btn = e.target.closest('.menuBtn');
        if (btn) {
            const id = btn.dataset.id;
            document.querySelectorAll('.menuDropdown').forEach(menu => {
                if (menu.dataset.menuFor !== id) menu.classList.add('hidden');
            });
            const thisMenu = document.querySelector(`.menuDropdown[data-menu-for="${id}"]`);
            if (thisMenu) thisMenu.classList.toggle('hidden');
            return;
        }

        const editBtn = e.target.closest('.editOption');
        if (editBtn) {
            const id = editBtn.dataset.id;
            openServiceModal(id);
            document.querySelectorAll('.menuDropdown').forEach(m => m.classList.add('hidden'));
            return;
        }

        const deleteBtn = e.target.closest('.deleteOption');
        if (deleteBtn) {
            const id = deleteBtn.dataset.id;
            const service = services.find(s => parseInt(s.service_id, 10) === parseInt(id, 10));
            pendingDeleteId = parseInt(id, 10);

            document.getElementById('deleteModalText').textContent =
                `Are you sure you want to delete "${service ? service.label : 'this service'}"? This cannot be undone.`;

            document.getElementById('deleteModal').classList.remove('hidden');
            document.querySelectorAll('.menuDropdown').forEach(m => m.classList.add('hidden'));
            return;
        }
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.menuBtn')) {
            document.querySelectorAll('.menuDropdown').forEach(m => m.classList.add('hidden'));
        }
    });

    document.getElementById('addServiceBtn').addEventListener('click', () => openServiceModal(null));

    // Unlock button handler
    document.getElementById('startEditBtn').addEventListener('click', () => {
        setFormLocked(false);
        document.getElementById('serviceNameInput').focus();
    });

    // Cancel edit button handler
    document.getElementById('cancelEditBtn').addEventListener('click', () => {
        if (isCreatingNew) {
            document.getElementById('serviceModal').classList.add('hidden');
        } else {
            populateModalData(originalServiceSnapshot);
            setFormLocked(true);
        }
    });

    document.getElementById('closeServiceModal').addEventListener('click', () => {
        document.getElementById('serviceModal').classList.add('hidden');
    });

    document.getElementById('serviceModal').addEventListener('click', function (e) {
        if (e.target === this) this.classList.add('hidden');
    });

    document.getElementById('editIconBtn').addEventListener('click', () => {
        document.getElementById('serviceIconInput').click();
    });

    document.getElementById('serviceIconInput').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
            showAlert('Invalid Image', 'Please select a valid image file (PNG, JPEG, WEBP).', 'error');
            this.value = '';
            return;
        }

        if (file.size > 2 * 1024 * 1024) {
            showAlert('File Too Large', 'Please select an image smaller than 2MB.', 'error');
            this.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = function (event) {
            uploadedIconData = event.target.result;
            const preview = document.getElementById('serviceIconPreview');
            preview.src = uploadedIconData;
            preview.classList.remove('hidden');
            document.getElementById('iconPlaceholder').classList.add('hidden');
        };
        reader.readAsDataURL(file);
    });

    // ── SAVE / UPDATE SERVICE HANDLER WITH LOADING ──
    document.getElementById('saveServiceBtn').addEventListener('click', async function () {
        const labelValue = document.getElementById('serviceNameInput').value.trim();
        const specValue = document.getElementById('serviceSpecializationInput').value.trim();
        const priceValue = parseFloat(document.getElementById('servicePriceInput').value);
        const durationValue = parseInt(document.getElementById('serviceDurationInput').value, 10);

        if (!labelValue || labelValue.length < 2 || labelValue.length > 80) {
            showAlert('Validation Error', 'Service name must be between 2 and 80 characters.', 'error');
            return;
        }

        if (/[%$^*<>{}[\]\\;~|_+=]/.test(labelValue) || /([()\-',/.]){2,}/.test(labelValue)) {
            showAlert('Validation Error', 'Service name contains invalid symbols or repeated characters.', 'error');
            return;
        }

        const openCount = (labelValue.match(/\(/g) || []).length;
        const closeCount = (labelValue.match(/\)/g) || []).length;
        if (openCount !== closeCount) {
            showAlert('Validation Error', 'Parentheses must be properly closed (e.g. "Root Canal (Molar)").', 'error');
            return;
        }

        const cleanTitleRegex = /^[A-Za-z0-9][A-Za-z0-9\s\-',/().]*[A-Za-z0-9.)]$/;
        if (!cleanTitleRegex.test(labelValue)) {
            showAlert('Validation Error', 'Please enter a valid title using letters and numbers.', 'error');
            return;
        }

        if (isNaN(priceValue) || priceValue < 0 || priceValue > 1500000) {
            showAlert('Validation Error', 'Please enter a valid non-negative price up to ₱1,500,000.', 'error');
            return;
        }

        if (isNaN(durationValue) || durationValue < 5 || durationValue > 480) {
            showAlert('Validation Error', 'Estimated duration must be between 5 and 480 minutes.', 'error');
            return;
        }

        const btn = this;
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

        const serviceData = {
            label: labelValue,
            specialization: specValue,
            price: priceValue,
            duration_minutes: durationValue,
            icon: uploadedIconData
        };

        if (activeServiceId) serviceData.service_id = activeServiceId;

        try {
            await saveService(serviceData);
            document.getElementById('serviceModal').classList.add('hidden');
            await renderServices();
            showAlert('Service Saved', 'The clinic service catalog has been updated successfully.', 'success');
        } catch (error) {
            showAlert('Save Failed', error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });

    document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
        pendingDeleteId = null;
        document.getElementById('deleteModal').classList.add('hidden');
    });

    // ── DELETE SERVICE HANDLER WITH LOADING ──
    document.getElementById('confirmDeleteBtn').addEventListener('click', async function() {
        if (!pendingDeleteId) return;
        const targetId = pendingDeleteId;
        const btn = this;
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Deleting...';

        try {
            await deleteService(targetId);
            pendingDeleteId = null;
            document.getElementById('deleteModal').classList.add('hidden');
            await renderServices();
            showAlert('Service Deleted', 'The service was removed from the clinic catalog.', 'success');
        } catch (error) {
            showAlert('Delete Failed', error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });

    document.getElementById('deleteModal').addEventListener('click', function (e) {
        if (e.target === this) {
            pendingDeleteId = null;
            this.classList.add('hidden');
        }
    });

    renderServices();
</script>
</body>
</html>
