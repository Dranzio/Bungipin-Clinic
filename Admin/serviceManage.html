<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- DENIED DIRECT PAGE ACCESS VIA URL -->
    <script src="../pageProtection.js"></script>
    <link href="/output.css" rel="stylesheet">
    <title>Service Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/fc8c3f4103.js" crossorigin="anonymous"></script>
    <script src="../Taskbar/Admin_Sidebar.js"></script>
</head>
<body class="min-h-screen md:h-screen md:overflow-hidden bg-[#F3EFE4] relative flex flex-col md:flex-row antialiased">

<!-- SIDEBAR -->
<div id="sidebar-placeholder"></div>
<script>
    function syncContentOffset() {
        const placeholder = document.getElementById('sidebar-placeholder');
        const sidebar = Array.from(placeholder.children)
            .find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
        if (!sidebar) return;

        const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

        const apply = () => {
            const desktop = window.innerWidth >= 768;
            set(placeholder, 'flexShrink', '0');
            set(sidebar, 'position', desktop ? 'sticky' : 'relative');
            set(sidebar, 'top', desktop ? '0px' : 'auto');
            set(sidebar, 'height', desktop ? '100vh' : '');
            set(sidebar, 'overflowY', desktop ? 'auto' : '');
        };

        window.addEventListener('resize', apply);
        apply();
    }

    (async () => {
        try {
            const response = await fetch('/Taskbar/Admin_Task.html');
            if (response.ok) {
                const data = await response.text();
                document.getElementById('sidebar-placeholder').innerHTML = data;
                const currentPage = window.location.pathname.split("/").pop();
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.getAttribute('data-page') === currentPage) {
                        link.classList.add('bg-[#FDFCE9]');
                    }
                });
                if (typeof initSidebar === 'function') {
                    initSidebar();
                }
                syncContentOffset();
            }
        } catch (error) {
            console.log('Sidebar fallback:', error);
        }
    })();
</script>

<div id="main-content" class="flex-1 min-w-0 md:min-h-0 md:overflow-y-auto">

    <!-- Header with logo -->
    <div class="flex justify-between items-start pt-5 pl-6 pr-4 md:pl-24 md:pr-8">
        <h1 class="text-2xl sm:text-3xl md:text-5xl 2xl:text-[73px] pt-5 font-bold text-[#2A1001] font-['Poppins']">
            Service Management
        </h1>
        <img
            src="../assets/logowithtitle.png"
            class="w-20 sm:w-24 md:w-28 h-auto object-contain shrink-0"
            alt="Logo"/>
    </div>
    <hr class="border-t border-[#2A1001] mt-2 mb-6" />

    <div class="px-6 md:px-16">

        <div class="flex justify-between items-center mb-6">
            <p class="text-sm font-bold text-[#2A1001]/70">Configure clinic treatment catalog, service duration & pricing</p>
            <button id="addServiceBtn" class="bg-[#D5C04D] hover:bg-[#c2ad3c] transition text-[#2A1001] font-bold px-6 py-2 rounded-full shadow-sm flex items-center gap-2 shrink-0 whitespace-nowrap">
                <i class="fa-solid fa-plus shrink-0"></i> Add New Service
            </button>
        </div>

        <div id="serviceGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-10">
            <!-- cards injected dynamically by JS -->
        </div>

    </div>
<!-- ================= SERVICE MODAL ================= -->
<div id="serviceModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-[30px] w-full max-w-md p-8 pt-6 relative shadow-xl border-2 border-black/10">

        <!-- Close Button -->
        <button id="closeServiceModal" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center text-2xl font-extrabold text-[#382414]/60 hover:text-[#382414] hover:bg-gray-100 rounded-full transition leading-none cursor-pointer">&times;</button>

        <h2 id="modalHeading" class="text-lg font-black text-[#382414] uppercase tracking-wider text-center mb-6">Edit Service Details</h2>

        <div class="flex flex-col items-center gap-5">

            <!-- Editable Icon -->
            <div class="relative w-32 h-32 group">
                <img id="serviceIconPreview" src="" class="w-full h-full object-contain hidden transition-opacity group-hover:opacity-80" />

                <div id="iconPlaceholder" class="w-full h-full flex items-center justify-center border-2 border-dashed border-[#2A1001]/25 rounded-2xl bg-[#FAF8F0] group-hover:bg-gray-50 transition">
                    <span class="text-xs text-[#2A1001]/50 text-center px-3">Click pencil to upload</span>
                </div>

                <button id="editIconBtn" type="button" class="absolute -bottom-1.5 -right-1.5 w-9 h-9 bg-white rounded-full flex items-center justify-center shadow-md border border-gray-100 hover:bg-gray-50 transition z-10 cursor-pointer">
                    <img src="../assets/editIcon.png" class="w-4 h-4 object-contain opacity-80" alt="Edit">
                </button>
                <input type="file" id="serviceIconInput" accept="image/*" class="hidden" />
            </div>

            <!-- Editable Title -->
            <div class="w-full">
                <label class="block text-[10px] font-bold text-[#2A1001]/50 uppercase tracking-wider text-center mb-1.5">Service Name</label>
                <div class="flex items-center justify-center gap-2 bg-[#FDFCE9] p-2.5 rounded-2xl border border-black/10">
                    <input id="serviceNameInput" type="text" readonly class="flex-1 text-base font-extrabold text-[#382414] font-['Poppins'] text-center bg-transparent outline-none border-b border-transparent focus:border-gray-400 transition cursor-default focus:cursor-text" placeholder="Service Name" />
                    <button id="editNameBtn" type="button" class="w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 shrink-0 hover:bg-gray-50 transition cursor-pointer">
                        <img src="../assets/editIcon.png" class="w-3.5 h-3.5 object-contain opacity-80" alt="Edit">
                    </button>
                </div>
            </div>

            <!-- Editable Estimated Duration -->
            <div class="w-full">
                <label class="block text-[10px] font-bold text-[#2A1001]/50 uppercase tracking-wider text-center mb-1.5">Estimated Duration</label>
                <div class="flex items-center justify-center gap-2 bg-[#FDFCE9] p-2.5 rounded-2xl border border-black/10">
                    <i class="fa-solid fa-stopwatch text-amber-600 text-sm"></i>
                    <input id="serviceDurationInput" type="number" min="10" step="5" readonly class="text-sm font-black text-[#382414] text-center bg-transparent outline-none w-16 border-b border-transparent focus:border-gray-400 transition appearance-none cursor-default focus:cursor-text" placeholder="30" />
                    <span class="text-xs font-bold text-[#382414]">minutes</span>
                    <button id="editDurationBtn" type="button" class="w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 shrink-0 hover:bg-gray-50 transition cursor-pointer">
                        <img src="../assets/editIcon.png" class="w-3.5 h-3.5 object-contain opacity-80" alt="Edit">
                    </button>
                </div>
            </div>

            <!-- Editable Price -->
            <div class="w-full">
                <label class="block text-[10px] font-bold text-[#2A1001]/50 uppercase tracking-wider text-center mb-1.5">Price</label>
                <div class="flex items-center justify-center gap-2 bg-[#FDFCE9] p-2.5 rounded-2xl border border-black/10">
                    <span class="text-sm font-bold text-[#382414]">₱</span>
                    <input id="servicePriceInput" type="number" min="0" readonly class="text-base font-black text-[#382414] text-center bg-transparent outline-none w-24 border-b border-transparent focus:border-gray-400 transition appearance-none cursor-default focus:cursor-text" placeholder="1500" />
                    <span class="text-sm font-bold text-[#382414]">PHP</span>
                    <button id="editPriceBtn" type="button" class="w-7 h-7 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 shrink-0 hover:bg-gray-50 transition cursor-pointer">
                        <img src="../assets/editIcon.png" class="w-3.5 h-3.5 object-contain opacity-80" alt="Edit">
                    </button>
                </div>
            </div>

            <!-- Save Button -->
            <button id="saveServiceBtn" class="bg-[#d8be50] hover:bg-[#c9af43] transition text-[#382414] font-black px-10 py-3 rounded-full shadow-md w-full mt-2 cursor-pointer">
                Save Service
            </button>
        </div>
    </div>
</div>

 <!-- ================= DELETE MODAL ================= -->
<div id="deleteModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-[30px] w-full max-w-sm p-8 text-center border-2 border-black/10 shadow-xl">
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-red-50 flex items-center justify-center">
            <i class="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i>
        </div>
        <h2 class="text-xl font-bold text-[#2A1001] font-['Poppins'] mb-2">Delete Service?</h2>
        <p class="text-sm text-[#2A1001]/70 mb-7 leading-relaxed" id="deleteModalText"></p>
        <div class="flex justify-center gap-3">
            <button id="cancelDeleteBtn" class="flex-1 px-6 py-2.5 rounded-full font-semibold text-[#2A1001] bg-white border border-[#2A1001]/20 hover:bg-[#F3EFE4] transition cursor-pointer">Cancel</button>
            <button id="confirmDeleteBtn" class="flex-1 px-6 py-2.5 rounded-full font-semibold text-white bg-[#D9534F] hover:bg-[#c9302c] transition cursor-pointer">Yes, Delete</button>
        </div>
    </div>
</div>
<script>
    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    function safeIconSrc(icon, fallback) {
        if (typeof icon === 'string' && (/^(\/|https?:\/\/|\.\.\/assets\/)/.test(icon))) {
            return encodeURI(icon);
        }
        return fallback;
    }

    function authHeaders(json = false) {
        const headers = { 'Authorization': `Bearer ${localStorage.getItem('userToken')}` };
        if (json) headers['Content-Type'] = 'application/json';
        return headers;
    }

    async function readError(response, fallback) {
        try {
            const body = await response.json();
            return body.message || body.error || fallback;
        } catch (_) {
            return fallback;
        }
    }

    async function getServices() {
        try {
            const response = await fetch('/api/services', { headers: authHeaders() });
            if (!response.ok) throw new Error(await readError(response, 'Failed to fetch services'));
            return await response.json();
        } catch (error) {
            console.error('Error fetching services:', error);
            return [];
        }
    }

    async function saveService(service) {
        const isEditing = !!service.service_id;
        const response = await fetch(isEditing ? `/api/services/${service.service_id}` : '/api/services', {
            method: isEditing ? 'PUT' : 'POST',
            headers: authHeaders(true),
            body: JSON.stringify(service)
        });
        if (!response.ok) throw new Error(await readError(response, 'Failed to save service'));
        return await response.json();
    }

    async function deleteService(id) {
        const response = await fetch(`/api/services/${id}`, { method: 'DELETE', headers: authHeaders() });
        if (!response.ok) throw new Error(await readError(response, 'Failed to delete service'));
    }

    let services = [];
    let editingServiceId = null;
    let pendingDeleteId = null;
    let uploadedIconData = null;

    const defaultIcons = {
        "Cleaning": "../assets/cleaning.png",
        "Pasta": "../assets/pasta.png",
        "Checkup": "../assets/Checkup.png",
        "Whitening": "../assets/whitening.png",
        "default": "../assets/logowithtitle.png"
    };

    function formatDuration(minutes) {
        const m = Number(minutes) || 30;
        const hrs = Math.floor(m / 60);
        const mins = m % 60;
        if (hrs > 0 && mins > 0) return `${hrs}h ${mins}m`;
        if (hrs > 0) return `${hrs} hr${hrs > 1 ? 's' : ''}`;
        return `${mins} mins`;
    }

    async function renderServices() {
        services = await getServices();
        const grid = document.getElementById('serviceGrid');

        if (services.length === 0) {
            grid.innerHTML = `<p class="col-span-full text-center text-[#2A1001]/60 py-10">No services found.</p>`;
            return;
        }

        grid.innerHTML = services.map(s => {
            const iconUrl = safeIconSrc(s.icon, defaultIcons[s.label] || defaultIcons['default']);
            const durationDisplay = formatDuration(s.duration_minutes);

            return `
            <div class="bg-white rounded-[30px] p-6 shadow-sm hover:shadow-md transition-all duration-300 relative flex flex-col items-center justify-between min-h-[340px] border border-black/5">
                
                <!-- Duration Badge -->
                <div class="absolute top-4 left-4 bg-amber-50 border border-amber-600/30 text-amber-900 text-[11px] font-black px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm">
                    <i class="fa-regular fa-clock text-[10px]"></i> ${durationDisplay}
                </div>

                <!-- Context Menu -->
                <div class="absolute top-4 right-4">
                    <button class="menuBtn w-8 h-8 bg-transparent rounded-full flex items-center justify-center text-[#2A1001] hover:bg-gray-100 transition font-bold text-xl leading-none pb-2 cursor-pointer" data-id="${s.service_id}">
                        ...
                    </button>
                    <div class="menuDropdown hidden absolute right-0 top-10 bg-white border border-[#2A1001]/10 rounded-xl shadow-lg z-10 w-36 overflow-hidden" data-menu-for="${s.service_id}">
                        <button class="editOption w-full flex items-center gap-3 px-4 py-2.5 text-xs font-bold text-[#2A1001] hover:bg-[#F3EFE4] cursor-pointer" data-id="${s.service_id}">
                            <img src="../assets/editIcon.png" class="w-4 h-4 object-contain shrink-0" alt="Edit"> <span class="whitespace-nowrap">Edit Service</span>
                        </button>
                        <button class="deleteOption w-full flex items-center gap-3 px-4 py-2.5 text-xs font-bold text-red-600 hover:bg-red-50 cursor-pointer" data-id="${s.service_id}">
                            <img src="../assets/trashIcon.png" class="w-4 h-4 object-contain shrink-0" alt="Delete"> <span class="whitespace-nowrap">Delete Service</span>
                        </button>
                    </div>
                </div>

                <!-- Title -->
                <h3 class="font-extrabold text-[#382414] text-xl mt-6 mb-2 w-full text-center px-4 line-clamp-2">${escapeHtml(s.label)}</h3>

                <!-- Icon -->
                <div class="flex-1 flex justify-center items-center my-3 w-28 h-28">
                    <img src="${escapeHtml(iconUrl)}" onerror="this.src='../assets/logowithtitle.png'" class="w-full h-full object-contain" alt="${escapeHtml(s.label)}" />
                </div>

                <!-- Price -->
                <div class="w-full pt-3 border-t border-[#2A1001]/10 flex justify-between items-center px-2 text-[#382414]">
                    <span class="text-xs font-bold text-gray-500 uppercase">Rate:</span>
                    <span class="font-black text-base text-[#667733]">₱${Number(s.price).toLocaleString()}</span>
                </div>
            </div>
            `;
        }).join('');
    }

    // Grid interaction delegation
    document.getElementById('serviceGrid').addEventListener('click', function (e) {
        if (e.target.classList.contains('menuBtn')) {
            const id = e.target.dataset.id;
            document.querySelectorAll('.menuDropdown').forEach(menu => {
                if (menu.dataset.menuFor !== id) menu.classList.add('hidden');
            });
            const thisMenu = document.querySelector(`.menuDropdown[data-menu-for="${id}"]`);
            thisMenu.classList.toggle('hidden');
            return;
        }

        if (e.target.closest('.editOption')) {
            const id = e.target.closest('.editOption').dataset.id;
            openServiceModal(id);
            document.querySelectorAll('.menuDropdown').forEach(m => m.classList.add('hidden'));
            return;
        }

        if (e.target.closest('.deleteOption')) {
            const id = e.target.closest('.deleteOption').dataset.id;
            const service = services.find(s => s.service_id == id);
            pendingDeleteId = id;

            document.getElementById('deleteModalText').textContent =
                `Are you sure you want to delete "${service ? service.label : 'this service'}"? This cannot be undone.`;

            document.getElementById('deleteModal').classList.remove('hidden');
            document.querySelectorAll('.menuDropdown').forEach(m => m.classList.add('hidden'));
            return;
        }
    });

    document.addEventListener('click', function (e) {
        if (!e.target.classList.contains('menuBtn')) {
            document.querySelectorAll('.menuDropdown').forEach(m => m.classList.add('hidden'));
        }
    });

    function openServiceModal(id = null) {
        editingServiceId = id;
        uploadedIconData = null;

        const heading = document.getElementById('modalHeading');
        const nameInput = document.getElementById('serviceNameInput');
        const priceInput = document.getElementById('servicePriceInput');
        const durationInput = document.getElementById('serviceDurationInput');
        const iconPreview = document.getElementById('serviceIconPreview');
        const iconPlaceholder = document.getElementById('iconPlaceholder');

        if (id) {
            heading.textContent = 'Edit Service Details';
            nameInput.setAttribute('readonly', true);
            nameInput.classList.add('cursor-default');
            priceInput.setAttribute('readonly', true);
            priceInput.classList.add('cursor-default');
            durationInput.setAttribute('readonly', true);
            durationInput.classList.add('cursor-default');

            const service = services.find(s => s.service_id == id);
            nameInput.value = service.label;
            priceInput.value = service.price;
            durationInput.value = service.duration_minutes || 30;

            if (service.icon) {
                iconPreview.src = safeIconSrc(service.icon, defaultIcons['default']);
                iconPreview.classList.remove('hidden');
                iconPlaceholder.classList.add('hidden');
                uploadedIconData = service.icon;
            } else {
                iconPreview.classList.add('hidden');
                iconPlaceholder.classList.remove('hidden');
            }
        } else {
            heading.textContent = 'Add New Service';
            nameInput.removeAttribute('readonly');
            nameInput.classList.remove('cursor-default');
            priceInput.removeAttribute('readonly');
            priceInput.classList.remove('cursor-default');
            durationInput.removeAttribute('readonly');
            durationInput.classList.remove('cursor-default');

            nameInput.value = '';
            priceInput.value = '';
            durationInput.value = '30';
            iconPreview.classList.add('hidden');
            iconPlaceholder.classList.remove('hidden');
        }

        document.getElementById('serviceModal').classList.remove('hidden');
    }

    document.getElementById('addServiceBtn').addEventListener('click', () => openServiceModal(null));

    document.getElementById('closeServiceModal').addEventListener('click', () => {
        document.getElementById('serviceModal').classList.add('hidden');
    });

    document.getElementById('serviceModal').addEventListener('click', function (e) {
        if (e.target === this) this.classList.add('hidden');
    });

    document.getElementById('editNameBtn').addEventListener('click', () => {
        const input = document.getElementById('serviceNameInput');
        input.removeAttribute('readonly');
        input.focus();
    });

    document.getElementById('editPriceBtn').addEventListener('click', () => {
        const input = document.getElementById('servicePriceInput');
        input.removeAttribute('readonly');
        input.focus();
    });

    document.getElementById('editDurationBtn').addEventListener('click', () => {
        const input = document.getElementById('serviceDurationInput');
        input.removeAttribute('readonly');
        input.focus();
    });

    document.getElementById('editIconBtn').addEventListener('click', () => {
        document.getElementById('serviceIconInput').click();
    });

    document.getElementById('serviceIconInput').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (event) {
            uploadedIconData = event.target.result;
            const preview = document.getElementById('serviceIconPreview');
            preview.src = uploadedIconData;
            preview.classList.remove('hidden');
            document.getElementById('iconPlaceholder').classList.add('hidden');
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('saveServiceBtn').addEventListener('click', async function () {
        const labelValue = document.getElementById('serviceNameInput').value.trim();
        const priceValue = parseFloat(document.getElementById('servicePriceInput').value);
        const durationValue = parseInt(document.getElementById('serviceDurationInput').value, 10);

        if (!labelValue || isNaN(priceValue) || isNaN(durationValue)) {
            alert('Please enter a valid service name, price, and estimated duration.');
            return;
        }

        const serviceData = {
            label: labelValue,
            price: priceValue,
            duration_minutes: durationValue,
            icon: uploadedIconData
        };

        if (editingServiceId) serviceData.service_id = Number(editingServiceId);

        try {
            await saveService(serviceData);
            document.getElementById('serviceModal').classList.add('hidden');
            await renderServices();
        } catch (error) {
            alert('Could not save service: ' + error.message);
        }
    });

    document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
        pendingDeleteId = null;
        document.getElementById('deleteModal').classList.add('hidden');
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
        if (pendingDeleteId) {
            try {
                await deleteService(pendingDeleteId);
                await renderServices();
            } catch (error) {
                alert('Could not delete service: ' + error.message);
            }
        }
        pendingDeleteId = null;
        document.getElementById('deleteModal').classList.add('hidden');
    });

    document.getElementById('deleteModal').addEventListener('click', function (e) {
        if (e.target === this) {
            pendingDeleteId = null;
            this.classList.add('hidden');
        }
    });

    renderServices();
</script>
</body>
</html>
