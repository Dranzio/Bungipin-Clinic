<div id="sidebar-placeholder"></div>
<script>
    function syncContentOffset() {
        const placeholder = document.getElementById('sidebar-placeholder');
        const sidebar = Array.from(placeholder?.children || []).find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
        if (!sidebar) return;

        const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

        const apply = () => {
            const desktop = window.innerWidth >= 768;
            set(placeholder, 'flexShrink', '0');
            set(sidebar, 'position', desktop ? 'sticky' : 'relative');
            set(sidebar, 'top', desktop ? '0px' : 'auto');
            set(sidebar, 'height', desktop ? '100vh' : '');
            set(sidebar, 'overflowY', desktop ? 'auto' : '');
        };

        window.addEventListener('resize', apply);
        apply();
    }

    (async () => {
        try {
            const response = await fetch('/Taskbar/Admin_Task.html');
            if (response.ok) {
                const data = await response.text();
                document.getElementById('sidebar-placeholder').innerHTML = data;
                const currentPage = window.location.pathname.split("/").pop();
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.getAttribute('data-page') === currentPage) {
                        link.classList.add('bg-[#FDFCE9]');
                    }
                });
                if (typeof initSidebar === 'function') initSidebar();
                syncContentOffset();
            }
        } catch (error) {
            console.log('Sidebar fallback:', error);
        }
    })();
</script>

    function authHeaders() {
        const token = localStorage.getItem('userToken');
        return {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatTimestamp(isoString) {
        if (!isoString) return 'N/A';
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return isoString;

        const pad = (n) => String(n).padStart(2, '0');
        const month = pad(d.getMonth() + 1);
        const day = pad(d.getDate());
        const year = d.getFullYear();

        let hours = d.getHours();
        const minutes = pad(d.getMinutes());
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;

        return `${month}/${day}/${year}, ${pad(hours)}:${minutes} ${ampm}`;
    }

    function formatActionDetails(action) {
        const act = (action || '').replace(/_/g, ' ');
        return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-white border border-[#2A1001]/20 text-[#2A1001] shadow-xs"><i class="fa-solid fa-circle text-[6px] text-[#667733]"></i> ${escapeHtml(act)}</span>`;
    }

    function generateAutomaticSummary(item) {
        if (item.notes && item.notes.trim()) {
            return item.notes.trim();
        }
        const target = item.target_table || 'system';
        const idStr = item.target_id ? ` #${item.target_id}` : '';
        return `Action executed on ${target}${idStr}`;
    }

    async function getLogs() {
        if (USE_MOCK_DATA) {
            return MOCK_ACTIVITY_LOGS.filter(l => {
                if (startDate) {
                    const startTs = new Date(`${startDate} 00:00:00`).getTime();
                    if (new Date(l.created_at).getTime() < startTs) return false;
                }
                if (endDate) {
                    const endTs = new Date(`${endDate} 23:59:59`).getTime();
                    if (new Date(l.created_at).getTime() > endTs) return false;
                }
                return true;
            });
        }

        try {
            const params = new URLSearchParams();
            if (startDate) params.append('startDate', startDate);
            if (endDate) params.append('endDate', endDate);

            const response = await fetch(`/api/activity-logs?${params.toString()}`, {
                method: 'GET',
                headers: authHeaders()
            });

            if (!response.ok) throw new Error(`Server returned ${response.status}`);
            const result = await response.json();
            return result.data || [];
        } catch (error) {
            console.error("Failed to load activity logs from server. Falling back to mock dataset:", error);
            return MOCK_ACTIVITY_LOGS;
        }
    }

        }

            chips.push({ key: 'date', label: `Date: ${startDate || 'Any'} to ${endDate || 'Any'}` });

            <span class="inline-flex items-center gap-1.5 bg-white border border-[#2A1001]/20 px-3 py-1 rounded-full text-xs font-bold text-[#2A1001] shadow-xs">
                <span>${escapeHtml(c.label)}</span>
                <button type="button" class="removeChipBtn text-gray-400 hover:text-red-500 font-bold ml-1 cursor-pointer" data-key="${c.key}">&times;</button>
            </span>
        `).join('');
    }

    function getFiltered() {
        return allLogs.filter(log => {
            const matchesRole = currentRoleFilter === "all" || log.user_role === currentRoleFilter;
            const matchesAction = currentActionFilter === "all" || (log.action || '').toUpperCase() === currentActionFilter.toUpperCase();
            const searchLower = currentSearch.toLowerCase();
            const matchesSearch = !currentSearch ||
                (log.user_full_name && log.user_full_name.toLowerCase().includes(searchLower)) ||
                (log.email && log.email.toLowerCase().includes(searchLower)) ||
                (log.action && log.action.toLowerCase().includes(searchLower)) ||
                (log.notes && log.notes.toLowerCase().includes(searchLower)) ||
                (log.target_table && log.target_table.toLowerCase().includes(searchLower)) ||
                (log.ip_address && log.ip_address.toLowerCase().includes(searchLower));

            return matchesRole && matchesAction && matchesSearch;
        });
    }

    function renderTable() {
        const filtered = getFiltered();
        const start = (currentPage - 1) * rowsPerPage;
        const pageItems = filtered.slice(start, start + rowsPerPage);

        const tbody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        tbody.innerHTML = '';

        if (pageItems.length === 0) {
            emptyState.classList.remove('hidden');
            renderPagination(0);
            return;
        } else {
            emptyState.classList.add('hidden');
        }

        pageItems.forEach(item => {
            const row = document.createElement('tr');
            row.className = "hover:bg-[#FDFCE9]/70 transition-colors border-b border-[#2A1001]/10";

            const dateText = formatTimestamp(item.created_at);
            const actionBadge = formatActionDetails(item.action);
            const summaryText = generateAutomaticSummary(item);

            row.innerHTML = `
                <!-- 1. Date & Time -->
                <td class="py-4 px-4 sm:px-6 font-medium text-[#2A1001]/80 whitespace-nowrap">
                    ${escapeHtml(dateText)}
                </td>

                <!-- 2. User Account -->
                <td class="py-4 px-4 sm:px-6">
                    <div class="font-extrabold text-[#2A1001]">${escapeHtml(item.user_full_name)}</div>
                    <div class="text-xs text-[#2A1001]/60 font-normal truncate max-w-xs">${escapeHtml(item.email)}</div>
                </td>

                <!-- 3. Role (Normal Plain Text) -->
                <td class="py-4 px-4 sm:px-6 text-center whitespace-nowrap font-extrabold text-xs sm:text-sm text-[#2A1001] capitalize">
                    ${escapeHtml(item.user_role || '—')}
                </td>

                <!-- 4. Activity & Automatic Summary -->
                <td class="py-4 px-4 sm:px-6">
                    <div class="flex items-center gap-2 mb-1 flex-wrap">
                        ${actionBadge}
                        <span class="text-[11px] font-mono text-gray-500 bg-white px-2 py-0.5 rounded-md border border-[#2A1001]/10">
                            ${escapeHtml(item.target_table || 'system')}
                        </span>
                    </div>
                    <p class="text-xs text-[#2A1001]/80 font-medium leading-relaxed line-clamp-2">
                        ${escapeHtml(summaryText)}
                    </p>
                </td>

                <!-- 5. Inspect Action Button -->
                <td class="py-4 px-4 sm:px-6 text-center whitespace-nowrap">
                    <button type="button" class="viewDetailBtn inline-flex items-center justify-center gap-1.5 bg-[#667733] hover:bg-[#556022] text-white text-xs font-bold px-4 py-1.5 rounded-full transition shadow-xs cursor-pointer active:scale-95" data-log-id="${item.log_id}">
                        <i class="fa-solid fa-eye text-xs"></i>
                        <span>View</span>
                    </button>
                </td>
            `;

            tbody.appendChild(row);
        });

        renderPagination(filtered.length);
    }

    // Queue-Style Circular Pagination
    function renderPagination(totalItems) {
        const totalPages = Math.max(1, Math.ceil(totalItems / rowsPerPage));
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        if (totalPages <= 1) return;

        const maxVisible = 7;
        const currentBatch = Math.floor((currentPage - 1) / maxVisible);
        const batchStart = currentBatch * maxVisible + 1;
        const batchEnd = Math.min(batchStart + maxVisible - 1, totalPages);

        if (batchStart > 1) {
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '‹';
            prevBtn.className = "w-9 h-9 rounded-full font-bold text-[#2A1001] bg-white border border-[#2A1001]/20 hover:bg-[#2A1001]/10 transition flex items-center justify-center cursor-pointer";
            prevBtn.addEventListener('click', () => {
                currentPage = batchStart - 1;
                renderTable();
            });
            pagination.appendChild(prevBtn);
        }

        for (let i = batchStart; i <= batchEnd; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `w-9 h-9 rounded-full font-semibold cursor-pointer transition ${
                i === currentPage
                    ? 'bg-[#667733] text-white shadow'
                    : 'bg-white text-[#2A1001] border border-[#2A1001]/20 hover:bg-gray-50'
            }`;
            btn.addEventListener('click', () => {
                currentPage = i;
                renderTable();
            });
            pagination.appendChild(btn);
        }

        if (batchEnd < totalPages) {
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '›';
            nextBtn.className = "w-9 h-9 rounded-full font-bold text-[#2A1001] bg-white border border-[#2A1001]/20 hover:bg-[#2A1001]/10 transition flex items-center justify-center cursor-pointer";
            nextBtn.addEventListener('click', () => {
                currentPage = batchEnd + 1;
                renderTable();
            });
            pagination.appendChild(nextBtn);
        }
    }

    // ── QUICK DATE PRESET BUTTONS ──
    document.querySelectorAll('.date-preset-btn').forEach(btn => {
        btn.addEventListener('click', async function () {
            const range = this.dataset.range;
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const toDateString = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

            endDate = toDateString(now);

            if (range === 'today') {
                startDate = toDateString(now);
            } else if (range === '7days') {
                const past = new Date();
                past.setDate(past.getDate() - 7);
                startDate = toDateString(past);
            } else if (range === '30days') {
                const past = new Date();
                past.setDate(past.getDate() - 30);
                startDate = toDateString(past);
            }

            document.getElementById('startDateFilter').value = startDate;
            document.getElementById('endDateFilter').value = endDate;

            currentPage = 1;
            updateActiveChips();
            allLogs = await getLogs();
            renderTable();
        });
    });

    // ── INSPECTION DETAIL MODAL ──
    document.getElementById('tableBody').addEventListener('click', function (e) {
        const btn = e.target.closest('.viewDetailBtn');
        if (!btn) return;
        const logId = parseInt(btn.dataset.logId, 10);
        const item = allLogs.find(l => l.log_id === logId);
        if (!item) return;

        document.getElementById('detailModalTimestamp').textContent = formatTimestamp(item.created_at);
        document.getElementById('detailModalUser').textContent = item.user_full_name || 'Unregistered User';
        document.getElementById('detailModalEmail').textContent = item.email || 'N/A';
        document.getElementById('detailModalIp').textContent = item.ip_address ? `IP: ${item.ip_address}` : 'IP: Unknown';

        document.getElementById('detailModalRoleText').textContent = item.user_role;
        document.getElementById('detailModalActionBadge').innerHTML = formatActionDetails(item.action);
        document.getElementById('detailModalTarget').textContent = `Target: ${item.target_table || 'system'}${item.target_id ? ` (ID #${item.target_id})` : ''}`;
        document.getElementById('detailModalNotes').textContent = item.notes || generateAutomaticSummary(item);

        document.getElementById('logDetailModal').classList.remove('hidden');
    });

    const closeDetail = () => document.getElementById('logDetailModal').classList.add('hidden');
    document.getElementById('closeDetailModal').addEventListener('click', closeDetail);
    document.getElementById('closeDetailModalBtn').addEventListener('click', closeDetail);
    document.getElementById('logDetailModal').addEventListener('click', function(e) {
        if (e.target === this) closeDetail();
    });

    // ── FILTER LISTENERS ──
    document.getElementById('roleFilter').addEventListener('change', function () {
        currentRoleFilter = this.value;
        currentPage = 1;
        updateActiveChips();
        renderTable();
    });

    document.getElementById('actionFilter').addEventListener('change', function () {
        currentActionFilter = this.value;
        currentPage = 1;
        updateActiveChips();
        renderTable();
    });

    document.getElementById('searchInput').addEventListener('input', function () {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
            currentSearch = this.value;
            currentPage = 1;
            updateActiveChips();
            renderTable();
        }, 250);
    });

    ['startDateFilter', 'endDateFilter'].forEach(id => {
        document.getElementById(id).addEventListener('change', async function () {
            startDate = document.getElementById('startDateFilter').value;
            endDate = document.getElementById('endDateFilter').value;
            currentPage = 1;
            updateActiveChips();
            allLogs = await getLogs();
            renderTable();
        });
    });

    document.getElementById('resetAllFiltersBtn').addEventListener('click', async () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('roleFilter').value = 'all';
        document.getElementById('actionFilter').value = 'all';
        document.getElementById('startDateFilter').value = '';
        document.getElementById('endDateFilter').value = '';
        currentSearch = '';
        currentRoleFilter = 'all';
        currentActionFilter = 'all';
        startDate = '';
        endDate = '';
        currentPage = 1;
        updateActiveChips();
        allLogs = await getLogs();
        renderTable();
    });

    document.getElementById('activeChipsContainer').addEventListener('click', async function (e) {
        const btn = e.target.closest('.removeChipBtn');
        if (!btn) return;
        const key = btn.dataset.key;

        if (key === 'role') {
            currentRoleFilter = 'all';
            document.getElementById('roleFilter').value = 'all';
        }
        if (key === 'action') {
            currentActionFilter = 'all';
            document.getElementById('actionFilter').value = 'all';
        }
        if (key === 'date') {
            startDate = '';
            endDate = '';
            document.getElementById('startDateFilter').value = '';
            document.getElementById('endDateFilter').value = '';
            allLogs = await getLogs();
        }
        if (key === 'search') {
            currentSearch = '';
            document.getElementById('searchInput').value = '';
        }

        currentPage = 1;
        updateActiveChips();
        renderTable();
    });

    // Initialize
    (async function init() {
        allLogs = await getLogs();
        updateActiveChips();
        renderTable();
    })();
</script>
</body>
</html>
