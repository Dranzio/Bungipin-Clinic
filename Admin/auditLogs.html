<div id="sidebar-placeholder" class="shrink-0 w-full md:w-auto"></div>
<script>
    function syncContentOffset() {
        const placeholder = document.getElementById('sidebar-placeholder');
        const sidebar = Array.from(placeholder?.children || []).find(el => !['SCRIPT', 'STYLE', 'LINK'].includes(el.tagName));
        if (!sidebar) return;

        const set = (el, prop, value) => { if (el.style[prop] !== value) el.style[prop] = value; };

        const apply = () => {
            const desktop = window.innerWidth >= 768;
            set(placeholder, 'flexShrink', '0');
            set(sidebar, 'position', desktop ? 'sticky' : 'relative');
            set(sidebar, 'top', desktop ? '0px' : 'auto');
            set(sidebar, 'height', desktop ? '100vh' : '');
            set(sidebar, 'overflowY', desktop ? 'auto' : '');
        };

        window.addEventListener('resize', apply);
        apply();
    }

    (async () => {
        try {
            const response = await fetch('/Taskbar/Admin_Task.html');
            if (response.ok) {
                const data = await response.text();
                document.getElementById('sidebar-placeholder').innerHTML = data;
                const currentPage = window.location.pathname.split("/").pop();
                document.querySelectorAll('.nav-link').forEach(link => {
                    if (link.getAttribute('data-page') === currentPage) {
                        link.classList.add('bg-[#FDFCE9]');
                    }
                });
                if (typeof initSidebar === 'function') initSidebar();
                syncContentOffset();
            }
        } catch (error) {
            console.log('Sidebar fallback:', error);
        }
    })();
</script>

<script>
    let allLogs = [];
    let currentRoleFilter = "all";
    let currentActionFilter = "all";
    let currentSearch = "";
    let startDate = "";
    let endDate = "";
    const rowsPerPage = 8;
    let currentPage = 1;
    let searchDebounce = null;

    function authHeaders() {
        const token = localStorage.getItem('userToken') || localStorage.getItem('token');
        return {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ── STRICT PHILIPPINE STANDARD TIME (UTC+8 / Asia/Manila) FORMATTER ──
    function formatTimestamp(raw) {
        if (!raw) return 'N/A';

        let dateObj;
        if (typeof raw === 'string') {
            dateObj = new Date(raw.includes('T') || raw.includes('Z') ? raw : raw.replace(' ', 'T') + '+08:00');
        } else {
            dateObj = new Date(raw);
        }

        if (isNaN(dateObj.getTime())) return String(raw);

        return new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Manila',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        }).format(dateObj);
    }

    // Helper to calculate YYYY-MM-DD in Asia/Manila for Quick Presets
    function getManilaDateString(offsetDays = 0) {
        const now = new Date();
        if (offsetDays !== 0) {
            now.setDate(now.getDate() + offsetDays);
        }
        return new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Manila',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }).format(now);
    }

    function formatActionDetails(action) {
        const act = (action || '').replace(/_/g, ' ');
        return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold bg-white border border-[#2A1001]/20 text-[#2A1001] shadow-xs"><i class="fa-solid fa-circle text-[6px] text-[#667733]"></i> ${escapeHtml(act)}</span>`;
    }

    function generateAutomaticSummary(item) {
        if (item.notes && item.notes.trim()) {
            return item.notes.trim();
        }
        const target = item.target_table || 'system';
        const idStr = item.target_id ? ` #${item.target_id}` : '';
        return `Action executed on ${target}${idStr}`;
    }

    async function getLogs() {
        try {
            const params = new URLSearchParams();
            if (startDate) params.append('startDate', startDate);
            if (endDate) params.append('endDate', endDate);
            if (currentRoleFilter !== 'all') params.append('role', currentRoleFilter);
            if (currentActionFilter !== 'all') params.append('action', currentActionFilter);
            if (currentSearch.trim()) params.append('search', currentSearch.trim());

            const response = await fetch(`/api/activity-logs?${params.toString()}`, {
                method: 'GET',
                headers: authHeaders()
            });

            if (!response.ok) throw new Error(`Server returned ${response.status}`);
            const result = await response.json();
            return result.data || [];
        } catch (error) {
            console.error("Failed to load activity logs:", error);
            return [];
        }
    }

    function updateActiveChips() {
        const container = document.getElementById('activeChipsContainer');
        const chips = [];

        if (currentRoleFilter !== 'all') {
            chips.push({ key: 'role', label: `Role: ${currentRoleFilter.toUpperCase()}` });
        }

        if (currentActionFilter !== 'all') {
            chips.push({ key: 'action', label: `Action: ${currentActionFilter}` });
        }

        if (startDate || endDate) {
            chips.push({ key: 'date', label: `Date: ${startDate || 'Any'} to ${endDate || 'Any'}` });
        }

        if (currentSearch.trim()) {
            chips.push({ key: 'search', label: `Search: "${currentSearch.trim()}"` });
        }

        container.innerHTML = chips.map(c => `
            <span class="inline-flex items-center gap-1.5 bg-white border border-[#2A1001]/20 px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold text-[#2A1001] shadow-xs">
                <span>${escapeHtml(c.label)}</span>
                <button type="button" class="removeChipBtn text-gray-400 hover:text-red-500 font-bold ml-1 cursor-pointer" data-key="${c.key}">&times;</button>
            </span>
        `).join('');
    }

    function getFiltered() {
        return allLogs.filter(log => {
            const matchesRole = currentRoleFilter === "all" || log.user_role === currentRoleFilter;
            const matchesAction = currentActionFilter === "all" || (log.action || '').toUpperCase() === currentActionFilter.toUpperCase();
            const searchLower = currentSearch.toLowerCase();
            const matchesSearch = !currentSearch ||
                (log.user_full_name && log.user_full_name.toLowerCase().includes(searchLower)) ||
                (log.email && log.email.toLowerCase().includes(searchLower)) ||
                (log.action && log.action.toLowerCase().includes(searchLower)) ||
                (log.notes && log.notes.toLowerCase().includes(searchLower)) ||
                (log.target_table && log.target_table.toLowerCase().includes(searchLower)) ||
                (log.ip_address && log.ip_address.toLowerCase().includes(searchLower));

            return matchesRole && matchesAction && matchesSearch;
        });
    }

    function renderTable() {
        const filtered = getFiltered();
        const start = (currentPage - 1) * rowsPerPage;
        const pageItems = filtered.slice(start, start + rowsPerPage);

        const tbody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        tbody.innerHTML = '';

        if (pageItems.length === 0) {
            emptyState.classList.remove('hidden');
            renderPagination(0);
            return;
        } else {
            emptyState.classList.add('hidden');
        }

        pageItems.forEach(item => {
            const row = document.createElement('tr');
            row.className = "hover:bg-[#FDFCE9]/70 transition-colors border-b border-[#2A1001]/10";

            const dateText = formatTimestamp(item.created_at);
            const actionBadge = formatActionDetails(item.action);
            const summaryText = generateAutomaticSummary(item);

            row.innerHTML = `
                <!-- 1. Date & Time -->
                <td class="py-3.5 sm:py-4 px-3.5 sm:px-6 font-medium text-[#2A1001]/80 whitespace-nowrap text-xs sm:text-sm">
                    ${escapeHtml(dateText)}
                </td>

                <!-- 2. User Account -->
                <td class="py-3.5 sm:py-4 px-3.5 sm:px-6">
                    <div class="font-extrabold text-[#2A1001] text-xs sm:text-sm break-words">${escapeHtml(item.user_full_name)}</div>
                    <div class="text-[11px] sm:text-xs text-[#2A1001]/60 font-normal truncate max-w-xs">${escapeHtml(item.email)}</div>
                </td>

                <!-- 3. Role -->
                <td class="py-3.5 sm:py-4 px-3.5 sm:px-6 text-center whitespace-nowrap font-extrabold text-xs sm:text-sm text-[#2A1001] capitalize">
                    ${escapeHtml(item.user_role || '—')}
                </td>

                <!-- 4. Activity & Automatic Summary -->
                <td class="py-3.5 sm:py-4 px-3.5 sm:px-6">
                    <div class="flex items-center gap-2 mb-1 flex-wrap">
                        ${actionBadge}
                        <span class="text-[10px] sm:text-[11px] font-mono text-gray-500 bg-white px-2 py-0.5 rounded-md border border-[#2A1001]/10">
                            ${escapeHtml(item.target_table || 'system')}
                        </span>
                    </div>
                    <p class="text-[11px] sm:text-xs text-[#2A1001]/80 font-medium leading-relaxed line-clamp-2 break-words [overflow-wrap:anywhere]">
                        ${escapeHtml(summaryText)}
                    </p>
                </td>

                <!-- 5. Inspect Action Button -->
                <td class="py-3.5 sm:py-4 px-3.5 sm:px-6 text-center whitespace-nowrap">
                    <button type="button" class="viewDetailBtn inline-flex items-center justify-center gap-1.5 bg-[#667733] hover:bg-[#556022] text-white text-[11px] sm:text-xs font-bold px-3.5 sm:px-4 py-1.5 rounded-full transition shadow-xs cursor-pointer active:scale-95" data-log-id="${item.log_id}">
                        <i class="fa-solid fa-eye text-[10px] sm:text-xs"></i>
                        <span>View</span>
                    </button>
                </td>
            `;

            tbody.appendChild(row);
        });

        renderPagination(filtered.length);
    }

    function renderPagination(totalItems) {
        const totalPages = Math.max(1, Math.ceil(totalItems / rowsPerPage));
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        if (totalPages <= 1) return;

        const maxVisible = 7;
        const currentBatch = Math.floor((currentPage - 1) / maxVisible);
        const batchStart = currentBatch * maxVisible + 1;
        const batchEnd = Math.min(batchStart + maxVisible - 1, totalPages);

        if (batchStart > 1) {
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '‹';
            prevBtn.className = "w-8 h-8 sm:w-9 sm:h-9 rounded-full font-bold text-[#2A1001] bg-white border border-[#2A1001]/20 hover:bg-[#2A1001]/10 transition flex items-center justify-center cursor-pointer text-xs sm:text-sm";
            prevBtn.addEventListener('click', () => {
                currentPage = batchStart - 1;
                renderTable();
            });
            pagination.appendChild(prevBtn);
        }

        for (let i = batchStart; i <= batchEnd; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `w-8 h-8 sm:w-9 sm:h-9 rounded-full font-semibold cursor-pointer transition text-xs sm:text-sm ${
                i === currentPage
                    ? 'bg-[#667733] text-white shadow'
                    : 'bg-white text-[#2A1001] border border-[#2A1001]/20 hover:bg-gray-50'
            }`;
            btn.addEventListener('click', () => {
                currentPage = i;
                renderTable();
            });
            pagination.appendChild(btn);
        }

        if (batchEnd < totalPages) {
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '›';
            nextBtn.className = "w-8 h-8 sm:w-9 sm:h-9 rounded-full font-bold text-[#2A1001] bg-white border border-[#2A1001]/20 hover:bg-[#2A1001]/10 transition flex items-center justify-center cursor-pointer text-xs sm:text-sm";
            nextBtn.addEventListener('click', () => {
                currentPage = batchEnd + 1;
                renderTable();
            });
            pagination.appendChild(nextBtn);
        }
    }

    // ── QUICK DATE PRESET BUTTONS (Asia/Manila PHT Aware) ──
    document.querySelectorAll('.date-preset-btn').forEach(btn => {
        btn.addEventListener('click', async function () {
            const range = this.dataset.range;
            endDate = getManilaDateString(0);

            if (range === 'today') {
                startDate = getManilaDateString(0);
            } else if (range === '7days') {
                startDate = getManilaDateString(-7);
            } else if (range === '30days') {
                startDate = getManilaDateString(-30);
            }

            document.getElementById('startDateFilter').value = startDate;
            document.getElementById('endDateFilter').value = endDate;

            currentPage = 1;
            updateActiveChips();
            allLogs = await getLogs();
            renderTable();
        });
    });

    // ── INSPECTION DETAIL MODAL ──
    document.getElementById('tableBody').addEventListener('click', function (e) {
        const btn = e.target.closest('.viewDetailBtn');
        if (!btn) return;
        const logId = parseInt(btn.dataset.logId, 10);
        const item = allLogs.find(l => l.log_id === logId);
        if (!item) return;

        document.getElementById('detailModalTimestamp').textContent = formatTimestamp(item.created_at);
        document.getElementById('detailModalUser').textContent = item.user_full_name || 'Unregistered User';
        document.getElementById('detailModalEmail').textContent = item.email || 'N/A';
        document.getElementById('detailModalIp').textContent = item.ip_address ? `IP: ${item.ip_address}` : 'IP: Unknown';

        document.getElementById('detailModalRoleText').textContent = item.user_role;
        document.getElementById('detailModalActionBadge').innerHTML = formatActionDetails(item.action);
        document.getElementById('detailModalTarget').textContent = `Target: ${item.target_table || 'system'}${item.target_id ? ` (ID #${item.target_id})` : ''}`;
        document.getElementById('detailModalNotes').textContent = item.notes || generateAutomaticSummary(item);

        document.getElementById('logDetailModal').classList.remove('hidden');
    });

    const closeDetail = () => document.getElementById('logDetailModal').classList.add('hidden');
    document.getElementById('closeDetailModal').addEventListener('click', closeDetail);
    document.getElementById('closeDetailModalBtn').addEventListener('click', closeDetail);
    document.getElementById('logDetailModal').addEventListener('click', function(e) {
        if (e.target === this) closeDetail();
    });

    // ── FILTER LISTENERS ──
    document.getElementById('roleFilter').addEventListener('change', async function () {
        currentRoleFilter = this.value;
        currentPage = 1;
        updateActiveChips();
        allLogs = await getLogs();
        renderTable();
    });

    document.getElementById('actionFilter').addEventListener('change', async function () {
        currentActionFilter = this.value;
        currentPage = 1;
        updateActiveChips();
        allLogs = await getLogs();
        renderTable();
    });

    document.getElementById('searchInput').addEventListener('input', function () {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(async () => {
            currentSearch = this.value;
            currentPage = 1;
            updateActiveChips();
            allLogs = await getLogs();
            renderTable();
        }, 250);
    });

    ['startDateFilter', 'endDateFilter'].forEach(id => {
        document.getElementById(id).addEventListener('change', async function () {
            startDate = document.getElementById('startDateFilter').value;
            endDate = document.getElementById('endDateFilter').value;
            currentPage = 1;
            updateActiveChips();
            allLogs = await getLogs();
            renderTable();
        });
    });

    document.getElementById('resetAllFiltersBtn').addEventListener('click', async () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('roleFilter').value = 'all';
        document.getElementById('actionFilter').value = 'all';
        document.getElementById('startDateFilter').value = '';
        document.getElementById('endDateFilter').value = '';
        currentSearch = '';
        currentRoleFilter = 'all';
        currentActionFilter = 'all';
        startDate = '';
        endDate = '';
        currentPage = 1;
        updateActiveChips();
        allLogs = await getLogs();
        renderTable();
    });

    document.getElementById('activeChipsContainer').addEventListener('click', async function (e) {
        const btn = e.target.closest('.removeChipBtn');
        if (!btn) return;
        const key = btn.dataset.key;

        if (key === 'role') {
            currentRoleFilter = 'all';
            document.getElementById('roleFilter').value = 'all';
        }
        if (key === 'action') {
            currentActionFilter = 'all';
            document.getElementById('actionFilter').value = 'all';
        }
        if (key === 'date') {
            startDate = '';
            endDate = '';
            document.getElementById('startDateFilter').value = '';
            document.getElementById('endDateFilter').value = '';
        }
        if (key === 'search') {
            currentSearch = '';
            document.getElementById('searchInput').value = '';
        }

        currentPage = 1;
        updateActiveChips();
        allLogs = await getLogs();
        renderTable();
    });

    // Initialize on page load
    (async function init() {
        allLogs = await getLogs();
        updateActiveChips();
        renderTable();
    })();
</script>
<script src="/InactivityTimer/InactivityTimer.js"></script>
</body>
</html>
